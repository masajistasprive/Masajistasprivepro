<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Panel Privé | Gestión Integral</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #070707;
            --card-bg: #121212;
            --card-border: rgba(223, 194, 133, 0.2);
            --gold: #dfc285;
            --gold-light: #f3e5ab;
            --text-main: #f5f5f5;
            --text-muted: #888888;
            --danger: #ff4d4d;
            --success: #00e676;
            --danger-bg: rgba(255, 77, 77, 0.12);
            --success-bg: rgba(0, 230, 118, 0.12);
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 15px;
            padding-bottom: 90px;
        }

        .container {
            max-width: 650px;
            margin: 0 auto;
        }

        /* Pantalla de Login Moderna */
        #loginOverlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(7, 7, 7, 0.95);
            backdrop-filter: blur(10px);
            display: flex; justify-content: center; align-items: center;
            z-index: 9999;
        }

        .login-card {
            background-color: var(--card-bg);
            border: 1px solid var(--gold);
            border-radius: 16px;
            padding: 30px;
            width: 90%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(223, 194, 133, 0.2);
        }

        .login-card h2 {
            color: var(--gold);
            margin-bottom: 20px;
            font-size: 1.4rem;
            font-family: 'Cormorant Garamond', serif;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .main-content {
            display: none;
        }

        /* Header Estilo App */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 15px;
        }

        h1 {
            color: var(--gold);
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-family: 'Cormorant Garamond', serif;
        }

        .back-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: var(--gold);
        }

        /* Tabs de Navegación */
        .nav-tabs {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 20px;
            background: #0e0e0e;
            padding: 4px;
            border-radius: 14px;
            border: 1px solid var(--card-border);
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 10px 6px;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, rgba(223, 194, 133, 0.2), rgba(223, 194, 133, 0.05));
            color: var(--gold);
            border: 1px solid var(--card-border);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .panel-section {
            display: none;
        }

        .panel-section.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Resúmenes Financieros (Grid) */
        .summary-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 12px;
        }

        .card-summary {
            background: linear-gradient(145deg, #141414, #0d0d0d);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            padding: 16px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
        }

        .card-summary.total-historico {
            grid-column: 1 / -1;
            border-color: rgba(0, 230, 118, 0.4);
            background: linear-gradient(145deg, #0d1a12, #08110c);
        }

        .summary-title {
            font-size: 0.65rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 6px;
        }

        .summary-amount {
            font-size: 1.6rem;
            color: var(--gold-light);
            font-weight: 700;
            font-family: 'Cormorant Garamond', serif;
        }

        .card-summary.total-historico .summary-amount {
            color: var(--success);
            font-size: 2rem;
        }

        .btn-corregir {
            background: var(--danger-bg);
            border: 1px solid rgba(255, 77, 77, 0.4);
            color: var(--danger);
            width: 100%;
            padding: 12px;
            border-radius: var(--radius);
            cursor: pointer;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 700;
            margin-bottom: 20px;
            transition: background 0.2s;
        }

        .btn-corregir:hover {
            background: rgba(255, 77, 77, 0.25);
        }

        /* Acordeón de Historial Anual */
        .historial-box {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            padding: 15px;
            margin-bottom: 20px;
        }

        .historial-toggle {
            background: none;
            border: none;
            color: var(--gold);
            width: 100%;
            text-align: left;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .historial-content {
            display: none;
            margin-top: 12px;
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 10px;
            max-height: 200px;
            overflow-y: auto;
        }

        .mes-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            color: #ccc;
        }

        /* Formularios y Inputs Modernos */
        .form-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
        }

        .form-card h2 {
            font-size: 1rem;
            color: var(--gold);
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-family: 'Cormorant Garamond', serif;
        }

        .form-group {
            margin-bottom: 14px;
        }

        label {
            display: block;
            font-size: 0.68rem;
            color: var(--text-muted);
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            background-color: #0b0b0b;
            border: 1px solid #222;
            border-radius: 8px;
            color: var(--text-main);
            font-size: 0.9rem;
            transition: border-color 0.2s;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 10px rgba(223, 194, 133, 0.15);
        }

        .btn-submit {
            background: linear-gradient(135deg, var(--gold), #b89751);
            color: #000;
            border: none;
            width: 100%;
            padding: 14px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(223, 194, 133, 0.3);
            transition: opacity 0.2s;
        }

        .btn-submit:hover {
            opacity: 0.9;
        }

        .btn-reset {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid #333;
            padding: 8px 14px;
            font-size: 0.7rem;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s;
        }

        .btn-reset:hover {
            border-color: var(--gold);
            color: var(--gold);
        }

        /* Listado de Anunciantes / Fichas */
        .cards-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .modelo-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .modelo-card.pagado-card {
            opacity: 0.75;
            border-color: rgba(0, 230, 118, 0.2);
            background: linear-gradient(145deg, #121212, #0d120f);
        }

        .modelo-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 10px;
        }

        .modelo-nombre-box {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .modelo-nombre {
            font-size: 1rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.5px;
        }

        .modelo-zona-cat {
            font-size: 0.72rem;
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 2px;
        }

        .modelo-body {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            align-items: center;
        }

        .status-badge {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.68rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-activo {
            background-color: var(--success-bg);
            color: var(--success);
            border: 1px solid rgba(0, 230, 118, 0.3);
        }

        .status-vencido {
            background-color: var(--danger-bg);
            color: var(--danger);
            border: 1px solid rgba(255, 77, 77, 0.3);
        }

        .monto-input {
            background: #090909;
            border: 1px solid #222;
            color: var(--success);
            font-weight: 700;
            padding: 8px;
            border-radius: 6px;
            font-size: 0.9rem;
            width: 100%;
            text-align: right;
        }

        .btn-check {
            background: #1a1a1a;
            border: 1px solid #333;
            color: var(--text-muted);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .btn-check.pagado {
            background-color: var(--success-bg);
            color: var(--success);
            border-color: var(--success);
            box-shadow: 0 0 12px rgba(0, 230, 118, 0.4);
        }

        .modelo-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.72rem;
            color: var(--text-muted);
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 8px;
        }

        .fecha-input {
            background: #090909;
            border: 1px solid #222;
            color: #fff;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.82rem;
            width: 100%;
        }

        .actions-row {
            display: flex;
            gap: 8px;
        }

        .btn-accion-card {
            background: rgba(223, 194, 133, 0.1);
            border: 1px solid var(--card-border);
            color: var(--gold);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: background 0.2s;
        }

        .btn-accion-card:hover {
            background: rgba(223, 194, 133, 0.2);
        }

        .btn-delete {
            background: rgba(255, 77, 77, 0.1);
            border: 1px solid rgba(255, 77, 77, 0.3);
            color: var(--danger);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
        }

        /* Modal Flotante para Editar Ficha Completa */
        #modalEditar {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            z-index: 10000;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--gold);
            border-radius: 16px;
            width: 100%;
            max-width: 480px;
            padding: 25px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.9);
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-content h3 {
            color: var(--gold);
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.3rem;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn-cancelar {
            background: #222;
            color: #fff;
            border: 1px solid #444;
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.75rem;
            text-transform: uppercase;
            font-weight: 700;
        }

        .empty-state {
            text-align: center;
            padding: 30px;
            color: var(--text-muted);
            font-style: italic;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <!-- Pantalla de Login -->
    <div id="loginOverlay">
        <div class="login-card">
            <h2>Master Privé</h2>
            <form id="loginForm">
                <div class="form-group" style="text-align: left;">
                    <label for="passwordInput">Contraseña de Acceso</label>
                    <input type="password" id="passwordInput" placeholder="••••••" required>
                </div>
                <button type="submit" class="btn-submit">Ingresar al Sistema</button>
                <div class="error-msg" id="errorMsg" style="color:var(--danger); font-size:0.75rem; margin-top:10px; display:none;">Contraseña incorrecta</div>
            </form>
        </div>
    </div>

    <!-- Contenido Principal -->
    <div class="container main-content" id="mainContent">
        <header>
            <h1>Master Panel Privé</h1>
            <a href="admin.html" class="back-link">&larr; Menú Principal</a>
        </header>

        <!-- Navegación por Pestañas -->
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="cambiarTab('cajaTab', this)">📊 Caja</button>
            <button class="tab-btn" onclick="cambiarTab('anunciantesTab', this)">👥 Fichas</button>
            <button class="tab-btn" onclick="cambiarTab('nuevoTab', this)">➕ Registrar</button>
        </div>

        <!-- PESTAÑA 1: CAJA & FINANZAS -->
        <div id="cajaTab" class="panel-section active">
            <div class="summary-grid">
                <div class="card-summary">
                    <div class="summary-title" id="tituloMesActual">Mes Actual</div>
                    <div class="summary-amount" id="totalMesActual">$0</div>
                </div>
                <div class="card-summary">
                    <div class="summary-title" id="tituloMesAnterior">Mes Anterior</div>
                    <div class="summary-amount" id="totalMesAnterior">$0</div>
                </div>
                <div class="card-summary total-historico">
                    <div class="summary-title">Importe Total Ingresado (Histórico)</div>
                    <div class="summary-amount" id="totalHistorico">$0</div>
                </div>
            </div>

            <button class="btn-corregir" onclick="deshacerUltimoPago()">↩️ Corregir último pago (Restar)</button>

            <div class="historial-box">
                <button class="historial-toggle" onclick="toggleHistorial()">
                    <span>📊 Desglose Anual por Meses</span>
                    <span id="flechaHistorial">▼</span>
                </button>
                <div class="historial-content" id="historialContent"></div>
            </div>
        </div>

        <!-- PESTAÑA 2: ANUNCIANTES & GESTIÓN DE FICHAS -->
        <div id="anunciantesTab" class="panel-section">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                <h2 style="font-size:0.9rem; color: var(--gold); text-transform: uppercase; letter-spacing:1px;">Gestión de Fichas</h2>
                <button class="btn-reset" onclick="restaurarDatosExcel()">Restaurar Originales</button>
            </div>
            <div class="cards-container" id="tarjetasContainer"></div>
        </div>

        <!-- PESTAÑA 3: REGISTRAR NUEVO PERFIL -->
        <div id="nuevoTab" class="panel-section">
            <div class="form-card">
                <h2>Nueva Ficha Completa</h2>
                <form id="cajaForm">
                    <div class="form-group">
                        <label for="nombre">Nombre de la Modelo</label>
                        <input type="text" id="nombre" placeholder="Ej: Jennyfer" required>
                    </div>
                    <div class="form-group">
                        <label for="zona">Barrio / Zona</label>
                        <input type="text" id="zona" placeholder="Ej: Tribunales" required>
                    </div>
                    <div class="form-group">
                        <label for="categoria">Categoría</label>
                        <select id="categoria" required>
                            <option value="TERAPEUTICAS">Terapéuticas ($50k)</option>
                            <option value="SENSUALES">Sensuales ($70k)</option>
                            <option value="FANTASIAS">Fantasías ($100k)</option>
                            <option value="MASCULINOS">Masculinos ($50k)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="whatsapp">WhatsApp / Teléfono</label>
                        <input type="text" id="whatsapp" placeholder="Ej: 5491131774848">
                    </div>
                    <div class="form-group">
                        <label for="fotoPrincipal">URL de la Foto Principal</label>
                        <input type="url" id="fotoPrincipal" placeholder="https://...">
                    </div>
                    <div class="form-group">
                        <label for="descripcion">Descripción / Perfil</label>
                        <textarea id="descripcion" placeholder="Escribí los detalles de los masajes, gabinete o atención..."></textarea>
                    </div>
                    <div class="form-group">
                        <label for="monto">Monto Pagado ($)</label>
                        <input type="number" id="monto" placeholder="50000" required>
                    </div>
                    <div class="form-group">
                        <label for="vencimiento">Fecha de Vencimiento</label>
                        <input type="date" id="vencimiento" required>
                    </div>
                    <button type="submit" class="btn-submit">Guardar Registro</button>
                </form>
            </div>
        </div>
    </div>

    <!-- MODAL DE EDICIÓN DE FICHA COMPLETA -->
    <div id="modalEditar">
        <div class="modal-content">
            <h3>Editar Ficha Completa</h3>
            <form id="formEditarFicha">
                <input type="hidden" id="editIndex">
                <div class="form-group">
                    <label>Nombre</label>
                    <input type="text" id="editNombre" required>
                </div>
                <div class="form-group">
                    <label>Zona / Barrio</label>
                    <input type="text" id="editZona" required>
                </div>
                <div class="form-group">
                    <label>Categoría</label>
                    <select id="editCategoria">
                        <option value="TERAPEUTICAS">Terapéuticas</option>
                        <option value="SENSUALES">Sensuales</option>
                        <option value="FANTASIAS">Fantasías</option>
                        <option value="MASCULINOS">Masculinos</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>WhatsApp / Teléfono</label>
                    <input type="text" id="editWhatsapp">
                </div>
                <div class="form-group">
                    <label>URL de la Foto Principal</label>
                    <input type="url" id="editFotoPrincipal">
                </div>
                <div class="form-group">
                    <label>Descripción / Perfil</label>
                    <textarea id="editDescripcion"></textarea>
                </div>
                <div class="form-group">
                    <label>Monto Actual ($)</label>
                    <input type="number" id="editMonto">
                </div>
                <div class="form-group">
                    <label>Fecha de Vencimiento</label>
                    <input type="date" id="editVencimiento">
                </div>
                <div class="modal-buttons">
                    <button type="button" class="btn-cancelar" onclick="cerrarModalEditar()">Cancelar</button>
                    <button type="submit" class="btn-submit" style="margin-top:0;">Guardar Cambios</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const CLASE_PASSWORD = "081101";

        const loginForm = document.getElementById('loginForm');
        const passwordInput = document.getElementById('passwordInput');
        const loginOverlay = document.getElementById('loginOverlay');
        const mainContent = document.getElementById('mainContent');
        const errorMsg = document.getElementById('errorMsg');

        if (sessionStorage.getItem('master_panel_auth') === 'true') {
            loginOverlay.style.display = 'none';
            mainContent.style.display = 'block';
        }

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            if (passwordInput.value === CLASE_PASSWORD) {
                sessionStorage.setItem('master_panel_auth', 'true');
                loginOverlay.style.display = 'none';
                mainContent.style.display = 'block';
            } else {
                errorMsg.style.display = 'block';
                passwordInput.value = '';
            }
        });

        window.cambiarTab = function(tabId, btnElement) {
            document.querySelectorAll('.panel-section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btnElement.classList.add('active');
        };

        const datosInicialesExcel = [
            { vencimiento: "2026-11-01", monto: 50000, nombre: "PRADA", zona: "TRIBUNALES", categoria: "TERAPEUTICAS", pagado: true, fechaPago: "2026-10-01", whatsapp: "5491131774848", fotoPrincipal: "", descripcion: "Masajes profesionales en gabinete propio." },
            { vencimiento: "2026-11-01", monto: 50000, nombre: "LUPITA", zona: "TRIBUNALES", categoria: "TERAPEUTICAS", pagado: true, fechaPago: "2026-10-01", whatsapp: "5491131774848", fotoPrincipal: "", descripcion: "Atención especializada." },
            { vencimiento: "2026-10-01", monto: 0, nombre: "JENNYFER", zona: "TRIBUNALES", categoria: "TERAPEUTICAS", pagado: false, fechaPago: "", whatsapp: "", fotoPrincipal: "", descripcion: "" }
        ];

        let historialPrecargado = [
            { fecha: "2026-09-01", nombre: "MORA", monto: 50000 },
            { fecha: "2026-09-01", nombre: "MORA S", monto: 50000 },
            { fecha: "2026-09-01", nombre: "RENATA", monto: 50000 },
            { fecha: "2026-10-02", nombre: "PRADA", monto: 50000 },
            { fecha: "2026-10-02", nombre: "LUPITA", monto: 50000 }
        ];

        if (!localStorage.getItem('prive_control_modelos')) {
            localStorage.setItem('prive_control_modelos', JSON.stringify(datosInicialesExcel));
        }
        if (!localStorage.getItem('prive_historial_pagos')) {
            localStorage.setItem('prive_historial_pagos', JSON.stringify(historialPrecargado));
        }

        let registros = JSON.parse(localStorage.getItem('prive_control_modelos'));
        let historialPagos = JSON.parse(localStorage.getItem('prive_historial_pagos'));

        document.getElementById('vencimiento').valueAsDate = new Date();

        const selectCat = document.getElementById('categoria');
        const inputMonto = document.getElementById('monto');
        
        selectCat.addEventListener('change', () => {
            if(selectCat.value === 'TERAPEUTICAS' || selectCat.value === 'MASCULINOS') inputMonto.value = '50000';
            else if(selectCat.value === 'SENSUALES') inputMonto.value = '70000';
            else if(selectCat.value === 'FANTASIAS') inputMonto.value = '100000';
        });
        selectCat.dispatchEvent(new Event('change'));

        const form = document.getElementById('cajaForm');
        const tarjetasContainer = document.getElementById('tarjetasContainer');
        const totalMesActual = document.getElementById('totalMesActual');
        const totalMesAnterior = document.getElementById('totalMesAnterior');
        const totalHistorico = document.getElementById('totalHistorico');
        const tituloMesActual = document.getElementById('tituloMesActual');
        const tituloMesAnterior = document.getElementById('tituloMesAnterior');
        const historialContent = document.getElementById('historialContent');

        function renderizarPanel() {
            tarjetasContainer.innerHTML = '';
            const hoy = new Date();
            hoy.setHours(0,0,0,0);

            const nombresMeses = {
                "01": "Enero", "02": "Febrero", "03": "Marzo", "04": "Abril",
                "05": "Mayo", "06": "Junio", "07": "Julio", "08": "Agosto",
                "09": "Septiembre", "10": "Octubre", "11": "Noviembre", "12": "Diciembre"
            };

            const anioActual = hoy.getFullYear();
            const mesNumActual = String(hoy.getMonth() + 1).padStart(2, '0');
            const mesActualKey = `${anioActual}-${mesNumActual}`;

            let fechaAnterior = new Date(hoy.getFullYear(), hoy.getMonth() - 1, 1);
            const anioAnt = fechaAnterior.getFullYear();
            const mesNumAnt = String(fechaAnterior.getMonth() + 1).padStart(2, '0');
            const mesAnteriorKey = `${anioAnt}-${mesNumAnt}`;

            tituloMesActual.textContent = `${nombresMeses[mesNumActual]} ${anioActual}`;
            tituloMesAnterior.textContent = `${nombresMeses[mesNumAnt]} ${anioAnt}`;

            let sumaMesActual = 0;
            let sumaMesAnterior = 0;
            let sumaHistorico = 0;

            historialPagos.forEach(p => {
                if (!p.fecha) return;
                const montoNum = Number(p.monto || 0);
                sumaHistorico += montoNum;

                if (p.fecha.startsWith(mesActualKey)) {
                    sumaMesActual += montoNum;
                } else if (p.fecha.startsWith(mesAnteriorKey)) {
                    sumaMesAnterior += montoNum;
                }
            });

            totalMesActual.textContent = `$${sumaMesActual.toLocaleString('es-AR')}`;
            totalMesAnterior.textContent = `$${sumaMesAnterior.toLocaleString('es-AR')}`;
            totalHistorico.textContent = `$${sumaHistorico.toLocaleString('es-AR')}`;

            renderizarHistorialAnual();

            if (registros.length === 0) {
                tarjetasContainer.innerHTML = `<div class="empty-state">No hay perfiles registrados todavía.</div>`;
                return;
            }

            let registrosOrdenados = [...registros];
            registrosOrdenados.sort((a, b) => {
                if (a.pagado !== b.pagado) return a.pagado ? 1 : -1;
                return new Date(a.vencimiento + 'T00:00:00') - new Date(b.vencimiento + 'T00:00:00');
            });

            registrosOrdenados.forEach((reg) => {
                const realIndex = registros.findIndex(r => r.nombre === reg.nombre);
                const fechaVen = new Date(reg.vencimiento + 'T00:00:00');
                const estaVencidoPorFecha = fechaVen < hoy;
                const estaAlDia = reg.pagado || !estaVencidoPorFecha;

                const badgeHtml = estaAlDia 
                    ? `<span class="status-badge status-activo">✓ Al Día</span>` 
                    : `<span class="status-badge status-vencido">⚠️ Vencido</span>`;

                const btnCheckClass = reg.pagado ? 'btn-check pagado' : 'btn-check';
                const cardClass = reg.pagado ? 'modelo-card pagado-card' : 'modelo-card';

                const card = document.createElement('div');
                card.className = cardClass;
                card.innerHTML = `
                    <div class="modelo-header">
                        <div class="modelo-nombre-box">
                            <button class="${btnCheckClass}" onclick="togglePagado(${realIndex})" title="Marcar como pagado">✓</button>
                            <div>
                                <div class="modelo-nombre">${reg.nombre}</div>
                                <div class="modelo-zona-cat">${reg.zona} • <span style="color:#dfc285;">${reg.categoria}</span></div>
                            </div>
                        </div>
                        <div>${badgeHtml}</div>
                    </div>
                    <div class="modelo-body">
                        <div>
                            <span style="font-size:0.65rem; color:#888; display:block; margin-bottom:2px;">VENCIMIENTO</span>
                            <input type="date" value="${reg.vencimiento}" onchange="actualizarFecha(${realIndex}, this.value)" class="fecha-input">
                        </div>
                        <div>
                            <span style="font-size:0.65rem; color:#888; display:block; margin-bottom:2px;">MONTO ($)</span>
                            <input type="number" value="${reg.monto || 0}" onchange="actualizarMonto(${realIndex}, this.value)" class="monto-input">
                        </div>
                    </div>
                    ${reg.descripcion ? `<div style="font-size:0.75rem; color:#aaa; font-style:italic; border-left:2px solid var(--gold); padding-left:6px;">"${reg.descripcion}"</div>` : ''}
                    <div class="modelo-footer">
                        <div class="actions-row">
                            <button class="btn-accion-card" onclick="abrirModalEditar(${realIndex})">✏️ Editar Ficha Completa</button>
                        </div>
                        <button class="btn-delete" onclick="eliminarRegistro(${realIndex})">Eliminar</button>
                    </div>
                `;
                tarjetasContainer.appendChild(card);
            });
        }

        window.actualizarFecha = function(index, nuevaFecha) {
            registros[index].vencimiento = nuevaFecha;
            localStorage.setItem('prive_control_modelos', JSON.stringify(registros));
            renderizarPanel();
        };

        window.actualizarMonto = function(index, nuevoMontoStr) {
            const nuevoMonto = parseFloat(nuevoMontoStr) || 0;
            const reg = registros[index];
            reg.monto = nuevoMonto;
            
            if (reg.pagado && reg.fechaPago) {
                const histIdx = historialPagos.findIndex(p => p.nombre === reg.nombre && p.fecha === reg.fechaPago);
                if (histIdx !== -1) {
                    historialPagos[histIdx].monto = nuevoMonto;
                } else {
                    historialPagos.push({ fecha: reg.fechaPago, nombre: reg.nombre, monto: nuevoMonto });
                }
                localStorage.setItem('prive_historial_pagos', JSON.stringify(historialPagos));
            }

            localStorage.setItem('prive_control_modelos', JSON.stringify(registros));
            renderizarPanel();
        };

        window.abrirModalEditar = function(index) {
            const reg = registros[index];
            document.getElementById('editIndex').value = index;
            document.getElementById('editNombre').value = reg.nombre || '';
            document.getElementById('editZona').value = reg.zona || '';
            document.getElementById('editCategoria').value = reg.categoria || 'TERAPEUTICAS';
            document.getElementById('editWhatsapp').value = reg.whatsapp || '';
            document.getElementById('editFotoPrincipal').value = reg.fotoPrincipal || '';
            document.getElementById('editDescripcion').value = reg.descripcion || '';
            document.getElementById('editMonto').value = reg.monto || 0;
            document.getElementById('editVencimiento').value = reg.vencimiento || '';
            document.getElementById('modalEditar').style.display = 'flex';
        };

        window.cerrarModalEditar = function() {
            document.getElementById('modalEditar').style.display = 'none';
        };

        document.getElementById('formEditarFicha').addEventListener('submit', (e) => {
            e.preventDefault();
            const index = parseInt(document.getElementById('editIndex').value);
            
            registros[index].nombre = document.getElementById('editNombre').value.trim().toUpperCase();
            registros[index].zona = document.getElementById('editZona').value.trim().toUpperCase();
            registros[index].categoria = document.getElementById('editCategoria').value;
            registros[index].whatsapp = document.getElementById('editWhatsapp').value.trim();
            registros[index].fotoPrincipal = document.getElementById('editFotoPrincipal').value.trim();
            registros[index].descripcion = document.getElementById('editDescripcion').value.trim();
            registros[index].monto = parseFloat(document.getElementById('editMonto').value) || 0;
            registros[index].vencimiento = document.getElementById('editVencimiento').value;

            localStorage.setItem('prive_control_modelos', JSON.stringify(registros));
            cerrarModalEditar();
            renderizarPanel();
        });

        function renderizarHistorialAnual() {
            historialContent.innerHTML = '';
            let agrupadoMeses = {};

            historialPagos.forEach(p => {
                if (!p.fecha) return;
                const mesAnio = p.fecha.slice(0, 7);
                if (!agrupadoMeses[mesAnio]) agrupadoMeses[mesAnio] = 0;
                agrupadoMeses[mesAnio] += Number(p.monto || 0);
            });

            const mesesKeys = Object.keys(agrupadoMeses).sort().reverse();
            if (mesesKeys.length === 0) {
                historialContent.innerHTML = `<div style="font-size:0.8rem; color:#888; text-align:center; padding:5px;">Sin pagos registrados aún.</div>`;
                return;
            }

            const nombresMeses = {
                "01": "Enero", "02": "Febrero", "03": "Marzo", "04": "Abril",
                "05": "Mayo", "06": "Junio", "07": "Julio", "08": "Agosto",
                "09": "Septiembre", "10": "Octubre", "11": "Noviembre", "12": "Diciembre"
            };

            mesesKeys.forEach(m => {
                const [anio, mesNum] = m.split('-');
                const nombreMesFormateado = `${nombresMeses[mesNum] || mesNum} ${anio}`;
                const row = document.createElement('div');
                row.className = 'mes-row';
                row.innerHTML = `
                    <span>${nombreMesFormateado}</span>
                    <strong style="color:var(--success);">+$${agrupadoMeses[m].toLocaleString('es-AR')}</strong>
                `;
                historialContent.appendChild(row);
            });
        }

        window.toggleHistorial = function() {
            const content = document.getElementById('historialContent');
            const flecha = document.getElementById('flechaHistorial');
            if (content.style.display === 'block') {
                content.style.display = 'none';
                flecha.textContent = '▼';
            } else {
                content.style.display = 'block';
                flecha.textContent = '▲';
            }
        };

        window.deshacerUltimoPago = function() {
            if (historialPagos.length === 0) {
                alert("No hay pagos en el historial para deshacer.");
                return;
            }
            const ultimo = historialPagos[historialPagos.length - 1];
            if (confirm(`¿Deshacer y restar el último pago registrado de "${ultimo.nombre}" por $${Number(ultimo.monto).toLocaleString('es-AR')}?`)) {
                historialPagos.pop();
                localStorage.setItem('prive_historial_pagos', JSON.stringify(historialPagos));
                renderizarPanel();
            }
        };

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const nombre = document.getElementById('nombre').value.trim().toUpperCase();
            const monto = parseFloat(document.getElementById('monto').value) || 0;
            const vencimiento = document.getElementById('vencimiento').value;
            const hoyStr = new Date().toISOString().split('T')[0];

            const nuevoReg = {
                vencimiento,
                monto,
                nombre,
                zona: document.getElementById('zona').value.trim().toUpperCase(),
                categoria: document.getElementById('categoria').value,
                whatsapp: document.getElementById('whatsapp').value.trim(),
                fotoPrincipal: document.getElementById('fotoPrincipal').value.trim(),
                descripcion: document.getElementById('descripcion').value.trim(),
                pagado: true,
                fechaPago: hoyStr
            };

            registros.unshift(nuevoReg);
            localStorage.setItem('prive_control_modelos', JSON.stringify(registros));

            if (monto > 0) {
                historialPagos.push({ fecha: hoyStr, nombre, monto });
                localStorage.setItem('prive_historial_pagos', JSON.stringify(historialPagos));
            }

            form.reset();
            selectCat.dispatchEvent(new Event('change'));
            document.getElementById('vencimiento').valueAsDate = new Date();
            
            document.querySelectorAll('.tab-btn')[1].click();
            renderizarPanel();
        });

        window.togglePagado = function(index) {
            const reg = registros[index];
            reg.pagado = !reg.pagado;
            const hoyStr = new Date().toISOString().split('T')[0];
            
            if (reg.pagado) {
                reg.fechaPago = hoyStr;
                const montoActual = Number(reg.monto || 0);
                if (montoActual > 0) {
                    historialPagos.push({ fecha: hoyStr, nombre: reg.nombre, monto: montoActual });
                    localStorage.setItem('prive_historial_pagos', JSON.stringify(historialPagos));
                }

                let partesFecha = reg.vencimiento.split('-');
                let fechaVen = new Date(partesFecha[0], partesFecha[1] - 1, partesFecha[2]);
                fechaVen.setDate(fechaVen.getDate() + 30);
                
                let anio = fechaVen.getFullYear();
                let mes = String(fechaVen.getMonth() + 1).padStart(2, '0');
                let dia = String(fechaVen.getDate()).padStart(2, '0');
                reg.vencimiento = `${anio}-${mes}-${dia}`;
            } else {
                const histIdx = historialPagos.map(p => p.nombre).lastIndexOf(reg.nombre);
                if (histIdx !== -1) {
                    historialPagos.splice(histIdx, 1);
                    localStorage.setItem('prive_historial_pagos', JSON.stringify(historialPagos));
                }
                reg.fechaPago = "";
            }

            localStorage.setItem('prive_control_modelos', JSON.stringify(registros));
            renderizarPanel();
        };

        window.eliminarRegistro = function(index) {
            const reg = registros[index];
            if (confirm(`¿Estás seguro de eliminar el registro de ${reg.nombre}?`)) {
                registros.splice(index, 1);
                localStorage.setItem('prive_control_modelos', JSON.stringify(registros));
                renderizarPanel();
            }
        };

        window.restaurarDatosExcel = function() {
            if (confirm('¿Restaurar los datos originales de la planilla? Se perderán los cambios recientes.')) {
                localStorage.removeItem('prive_control_modelos');
                localStorage.removeItem('prive_historial_pagos');
                location.reload();
            }
        };

        renderizarPanel();
    </script>
</body>
</html>
