<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Editor Pro Canvas | Masajistas Privé</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
            --card-bg: #111111;
            --card-border: rgba(223, 194, 133, 0.3);
            --gold: #dfc285;
            --gold-light: #f3e5ab;
            --text-main: #f5f5f5;
            --text-muted: #888888;
            --radius: 14px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 15px;
            padding-bottom: 100px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 12px;
        }

        h1 {
            color: var(--gold);
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-family: 'Cormorant Garamond', serif;
        }

        .back-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .back-link:hover { color: var(--gold); }

        .form-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 0.68rem;
            color: var(--gold);
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
        }

        input[type="file"], select {
            width: 100%;
            padding: 12px;
            background-color: #060606;
            border: 1px solid #222;
            border-radius: 8px;
            color: var(--text-main);
            font-size: 0.85rem;
        }

        .range-slider {
            width: 100%;
            accent-color: var(--gold);
            cursor: pointer;
        }

        .preview-container {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-bottom: 15px;
            overflow: hidden;
        }

        /* Lienzo Canvas Nativo para rendimiento fluido en Celular */
        .editor-canvas-wrapper {
            width: 100%;
            max-width: 400px;
            background: #000;
            border: 2px solid var(--gold);
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none; /* Bloquea el scroll del celular al arrastrar sobre el canvas */
        }

        canvas {
            width: 100%;
            height: auto;
            display: block;
            cursor: move;
        }

        .btn-accion {
            background: linear-gradient(135deg, var(--gold), #b89751);
            color: #000;
            border: none;
            width: 100%;
            padding: 14px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            box-shadow: 0 4px 15px rgba(223, 194, 133, 0.3);
            margin-top: 10px;
        }

        .btn-secundario {
            background: rgba(223, 194, 133, 0.15);
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 10px;
            border-radius: 8px;
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            width: 100%;
            margin-top: 8px;
        }

        .filtros-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }

        .filtro-btn {
            background: #1a1a1a;
            border: 1px solid #333;
            color: var(--text-muted);
            padding: 8px;
            border-radius: 6px;
            font-size: 0.62rem;
            text-transform: uppercase;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
        }
        .filtro-btn.active {
            background: rgba(223, 194, 133, 0.15);
            border-color: var(--gold);
            color: var(--gold);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Editor Pro Canvas</h1>
            <a href="panel_total.html" class="back-link">&larr; Volver</a>
        </header>

        <div class="form-card">
            <div class="form-group">
                <label>1. Seleccionar Fotografía (Tamaño Real)</label>
                <input type="file" id="inputFotoEditor" accept="image/*" onchange="cargarImagenEditor(event)">
            </div>

            <div class="form-group" style="border-top: 1px solid #222; padding-top: 10px;">
                <label style="color: var(--gold);">🔒 Zonas de Privacidad (Ojos, Tatuajes)</label>
                <button type="button" class="btn-secundario" onclick="agregarZonaBlur()">➕ Agregar Zona de Difuminado</button>
            </div>

            <div id="controlesZonaActiva" style="display: none; background: #080808; padding: 10px; border-radius: 8px; border: 1px solid #222; margin-bottom: 12px;">
                <div style="font-size: 0.65rem; color: var(--gold); margin-bottom: 8px; font-weight: 700; text-align: center;">⚙️ Ajustar Zona Seleccionada:</div>
                
                <div class="form-group">
                    <label>Forma</label>
                    <select id="selForma" onchange="actualizarPropiedadesZona()">
                        <option value="franja">Franja / Rectángulo (Ideal Ojos)</option>
                        <option value="circulo">Círculo</option>
                        <option value="cuadrado">Bloque Cuadrado</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Ancho (<span id="lblAncho">120</span>px)</label>
                    <input type="range" id="rngAncho" min="40" max="300" value="120" class="range-slider" oninput="actualizarPropiedadesZona()">
                </div>
                <div class="form-group">
                    <label>Alto (<span id="lblAlto">45</span>px)</label>
                    <input type="range" id="rngAlto" min="20" max="200" value="45" class="range-slider" oninput="actualizarPropiedadesZona()">
                </div>
                <div class="form-group" style="margin-bottom: 0;">
                    <label>Intensidad de Desenfoque (<span id="lblInt">12</span>px)</label>
                    <input type="range" id="rngInt" min="2" max="25" value="12" class="range-slider" oninput="actualizarPropiedadesZona()">
                </div>
                <button type="button" class="btn-secundario" style="background: rgba(255,80,80,0.15); border-color: #ff5050; color: #ff8080; margin-top: 8px;" onclick="eliminarZonaActiva()">🗑️ Eliminar Zona</button>
            </div>

            <div class="form-group" style="border-top: 1px solid #222; padding-top: 10px;">
                <label>Filtros Estéticos</label>
                <div class="filtros-grid">
                    <button type="button" class="filtro-btn active" onclick="aplicarFiltro('normal', this)">Normal</button>
                    <button type="button" class="filtro-btn" onclick="aplicarFiltro('cine', this)">Cine Dark</button>
                    <button type="button" class="filtro-btn" onclick="aplicarFiltro('calido', this)">Cálido Privé</button>
                </div>
            </div>

            <div class="form-group">
                <label>Luminosidad (<span id="valBrillo">100</span>%)</label>
                <input type="range" id="rangeBrillo" min="70" max="150" value="100" class="range-slider" oninput="redibujarCanvas()">
            </div>
        </div>

        <div style="text-align: center; margin-bottom: 8px; font-size: 0.68rem; color: var(--gold); text-transform: uppercase; letter-spacing: 1.5px;">👉 Tocá y arrastrá el cuadro directamente con el dedo por la foto</div>
        
        <div class="preview-container">
            <div class="editor-canvas-wrapper" id="editorCanvasBox">
                <canvas id="priveCanvas"></canvas>
            </div>
        </div>

        <button type="button" class="btn-accion" onclick="descargarFotoEditada()">📥 Descargar Imagen Pro (PNG)</button>
    </div>

    <script>
        let canvas = document.getElementById('priveCanvas');
        let ctx = canvas.getContext('2d');
        let imgOriginal = new Image();
        let imagenCargada = false;

        let zonasBlur = [];
        let indexZonaActiva = null;
        let isDragging = false;
        let dragOffsetX = 0;
        let dragOffsetY = 0;

        // Imagen por defecto inicial (monograma)
        imgOriginal.crossOrigin = "anonymous";
        imgOriginal.src = "img/monograma.png";
        imgOriginal.onload = function() {
            inicializarCanvas();
        };

        function inicializarCanvas() {
            canvas.width = imgOriginal.width;
            canvas.height = imgOriginal.height;
            
            // Si no hay zonas creadas, crear una por defecto arriba (zona de ojos)
            if (zonasBlur.length === 0) {
                zonasBlur.push({
                    x: (canvas.width / 2) - 60,
                    y: (canvas.height / 3) - 22,
                    width: 120,
                    height: 45,
                    blur: 12,
                    shape: 'franja'
                });
                indexZonaActiva = 0;
            }
            redibujarCanvas();
            actualizarPanelControles();
        }

        function cargarImagenEditor(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                imgOriginal.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function redibujarCanvas() {
            if (!imgOriginal.complete) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Aplicar filtros de luz/color globales
            let brillo = document.getElementById('rangeBrillo').value;
            let filtroBtnActivo = document.querySelector('.filtro-btn.active').textContent;
            
            if (filtroBtnActivo.includes('Cine')) {
                ctx.filter = `brightness(95%) contrast(120%) saturate(90%)`;
            } else if (filtroBtnActivo.includes('Cálido')) {
                ctx.filter = `brightness(105%) contrast(105%) sepia(15%)`;
            } else {
                ctx.filter = `brightness(${brillo}%)`;
            }

            // Dibujar imagen completa original en tamaño real
            ctx.drawImage(imgOriginal, 0, 0, canvas.width, canvas.height);
            ctx.filter = 'none'; // Resetear filtros para los recortes

            // 2. Dibujar y aplicar el difuminado real (blur) en cada zona de privacidad
            zonasBlur.forEach((z, index) => {
                ctx.save();
                ctx.beginPath();

                if (z.shape === 'circulo') {
                    let radio = Math.min(z.width, z.height) / 2;
                    ctx.arc(z.x + radio, z.y + radio, radio, 0, Math.PI * 2);
                } else if (z.shape === 'cuadrado') {
                    ctx.roundRect(z.x, z.y, z.width, z.height, 15);
                } else {
                    // Franja rectangular suave
                    ctx.roundRect(z.x, z.y, z.width, z.height, 6);
                }
                
                ctx.clip();

                // Aplicar desenfoque real recortando la sección de la imagen
                ctx.filter = `blur(${z.blur}px)`;
                ctx.drawImage(imgOriginal, 0, 0, canvas.width, canvas.height);
                ctx.restore();

                // Si es la zona activa, dibujarle un sutil borde guía dorado elegante
                if (index === indexZonaActiva) {
                    ctx.save();
                    ctx.strokeStyle = '#dfc285';
                    ctx.lineWidth = 3;
                    ctx.setLineDash([6, 4]);
                    if (z.shape === 'circulo') {
                        let radio = Math.min(z.width, z.height) / 2;
                        ctx.beginPath();
                        ctx.arc(z.x + radio, z.y + radio, radio, 0, Math.PI * 2);
                        ctx.stroke();
                    } else {
                        ctx.strokeRect(z.x, z.y, z.width, z.height);
                    }
                    ctx.restore();
                }
            });
        }

        function aplicarFiltro(tipo, btn) {
            document.querySelectorAll('.filtro-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            redibujarCanvas();
        }

        function agregarZonaBlur() {
            zonasBlur.push({
                x: (canvas.width / 2) - 60,
                y: (canvas.height / 2) - 22,
                width: 120,
                height: 45,
                blur: 12,
                shape: 'franja'
            });
            indexZonaActiva = zonasBlur.length - 1;
            redibujarCanvas();
            actualizarPanelControles();
        }

        function actualizarPanelControles() {
            if (indexZonaActiva !== null && zonasBlur[indexZonaActiva]) {
                document.getElementById('controlesZonaActiva').style.display = 'block';
                let z = zonasBlur[indexZonaActiva];
                document.getElementById('selForma').value = z.shape;
                document.getElementById('rngAncho').value = z.width;
                document.getElementById('lblAncho').textContent = z.width;
                document.getElementById('rngAlto').value = z.height;
                document.getElementById('lblAlto').textContent = z.height;
                document.getElementById('rngInt').value = z.blur;
                document.getElementById('lblInt').textContent = z.blur;
            } else {
                document.getElementById('controlesZonaActiva').style.display = 'none';
            }
        }

        function actualizarPropiedadesZona() {
            if (indexZonaActiva === null || !zonasBlur[indexZonaActiva]) return;
            let z = zonasBlur[indexZonaActiva];
            z.shape = document.getElementById('selForma').value;
            z.width = parseInt(document.getElementById('rngAncho').value);
            document.getElementById('lblAncho').textContent = z.width;
            z.height = parseInt(document.getElementById('rngAlto').value);
            document.getElementById('lblAlto').textContent = z.height;
            z.blur = parseInt(document.getElementById('rngInt').value);
            document.getElementById('lblInt').textContent = z.blur;

            redibujarCanvas();
        }

        function eliminarZonaActiva() {
            if (indexZonaActiva === null) return;
            zonasBlur.splice(indexZonaActiva, 1);
            indexZonaActiva = zonasBlur.length > 0 ? 0 : null;
            redibujarCanvas();
            actualizarPanelControles();
        }

        // --- SISTEMA DE ARRASTRE FLUIDO DIRECTO SOBRE EL CANVAS ---
        function obtenerCoordenadasCanvas(e) {
            let rect = canvas.getBoundingClientRect();
            let clientX = e.clientX || (e.touches && e.touches[0].clientX);
            let clientY = e.clientY || (e.touches && e.touches[0].clientY);
            
            let scaleX = canvas.width / rect.width;
            let scaleY = canvas.height / rect.height;

            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY
            };
        }

        function iniciarArrastre(e) {
            let coords = obtenerCoordenadasCanvas(e);
            
            // Buscar si tocó alguna zona existente (empezando desde la última creada)
            let encontrada = -1;
            for (let i = zonasBlur.length - 1; i >= 0; i--) {
                let z = zonasBlur[i];
                if (coords.x >= z.x && coords.x <= z.x + z.width && coords.y >= z.y && coords.y <= z.y + z.height) {
                    encontrada = i;
                    break;
                }
            }

            if (encontrada !== -1) {
                indexZonaActiva = encontrada;
                isDragging = true;
                let z = zonasBlur[indexZonaActiva];
                dragOffsetX = coords.x - z.x;
                dragOffsetY = coords.y - z.y;
                actualizarPanelControles();
                redibujarCanvas();
                e.preventDefault();
            }
        }

        function moverArrastre(e) {
            if (!isDragging || indexZonaActiva === null) return;
            let coords = obtenerCoordenadasCanvas(e);
            let z = zonasBlur[indexZonaActiva];

            z.x = coords.x - dragOffsetX;
            z.y = coords.y - dragOffsetY;

            redibujarCanvas();
            e.preventDefault();
        }

        function finalizarArrastre(e) {
            isDragging = false;
        }

        // Eventos táctiles y de mouse unidos al canvas
        canvas.addEventListener('mousedown', iniciarArrastre);
        window.addEventListener('mousemove', moverArrastre);
        window.addEventListener('mouseup', finalizarArrastre);

        canvas.addEventListener('touchstart', iniciarArrastre, {passive: false});
        window.addEventListener('touchmove', moverArrastre, {passive: false});
        window.addEventListener('touchend', finalizarArrastre);

        function descargarFotoEditada() {
            // Ocultar bordes guías dorados antes de exportar la imagen limpia
            let tempActiva = indexZonaActiva;
            indexZonaActiva = null;
            redibujarCanvas();

            const enlace = document.createElement('a');
            enlace.download = `prive-foto-pro-${Date.now()}.png`;
            enlace.href = canvas.toDataURL('image/png');
            enlace.click();

            // Restaurar selección
            indexZonaActiva = tempActiva;
            redibujarCanvas();
        }
    </script>
</body>
</html>
