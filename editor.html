<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#080808">
    <title>Editor Pro Canvas | Masajistas Privé</title>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            color-scheme: dark;

            --bg-color: #080808;
            --bg-soft: #0d0d0d;
            --card-bg: #121212;
            --card-bg-hover: #171717;
            --input-bg: #0a0a0a;

            --card-border: rgba(223, 194, 133, 0.20);
            --border-soft: rgba(255, 255, 255, 0.075);

            --gold: #dfc285;
            --gold-light: #f3e5ab;
            --gold-dark: #b89751;
            --gold-glow: rgba(223, 194, 133, 0.12);

            --text-main: #f5f3ed;
            --text-muted: #99958c;
            --text-subtle: #6f6b64;

            --danger: #ff8585;
            --danger-bg: rgba(255, 80, 80, 0.09);

            --radius-sm: 10px;
            --radius: 16px;
            --radius-lg: 22px;

            --shadow-card:
                0 12px 32px rgba(0, 0, 0, 0.30),
                inset 0 1px 0 rgba(255, 255, 255, 0.018);

            --transition: 180ms ease;
        }

        /* RESET */

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            min-height: 100%;
            background: var(--bg-color);
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            padding: 22px 16px 50px;
            color: var(--text-main);
            background:
                radial-gradient(
                    ellipse at 50% -10%,
                    rgba(223, 194, 133, 0.075),
                    transparent 48%
                ),
                var(--bg-color);
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        button,
        input,
        select {
            font: inherit;
        }

        button {
            -webkit-appearance: none;
            appearance: none;
        }

        button:focus-visible,
        a:focus-visible,
        input:focus-visible,
        select:focus-visible {
            outline: 2px solid var(--gold-light);
            outline-offset: 3px;
        }

        ::selection {
            color: #080808;
            background: var(--gold);
        }

        /* ESTRUCTURA PRINCIPAL */

        .container {
            width: 100%;
            max-width: 680px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
            padding: 8px 2px 18px;
            border-bottom: 1px solid var(--card-border);
            position: relative;
        }

        header::after {
            content: "";
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 76px;
            height: 2px;
            background: linear-gradient(
                90deg,
                var(--gold),
                transparent
            );
        }

        h1 {
            color: var(--gold);
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(1.25rem, 4vw, 1.65rem);
            font-weight: 700;
            line-height: 1.1;
            letter-spacing: 1.8px;
            text-transform: uppercase;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            flex-shrink: 0;
            padding: 10px 12px;
            border: 1px solid var(--border-soft);
            border-radius: 999px;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.025);
            text-decoration: none;
            font-size: 0.66rem;
            font-weight: 600;
            letter-spacing: 0.7px;
            text-transform: uppercase;
            transition:
                color var(--transition),
                border-color var(--transition),
                background var(--transition),
                transform var(--transition);
        }

        .back-link:hover {
            color: var(--gold-light);
            border-color: var(--card-border);
            background: var(--gold-glow);
        }

        .back-link:active {
            transform: scale(0.97);
        }

        /* TARJETAS */

        .form-card {
            position: relative;
            padding: 22px;
            margin-bottom: 22px;
            overflow: hidden;
            background:
                linear-gradient(
                    145deg,
                    rgba(255, 255, 255, 0.025),
                    transparent 38%
                ),
                var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-card);
        }

        .form-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 24px;
            right: 24px;
            height: 1px;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(243, 229, 171, 0.34),
                transparent
            );
            pointer-events: none;
        }

        .form-group {
            min-width: 0;
            margin-bottom: 20px;
        }

        .form-group:last-child {
            margin-bottom: 0;
        }

        label {
            display: block;
            margin-bottom: 9px;
            color: var(--gold);
            font-size: 0.69rem;
            font-weight: 700;
            line-height: 1.5;
            letter-spacing: 0.85px;
            text-transform: uppercase;
        }

        /* CAMPOS */

        input[type="file"],
        select {
            display: block;
            width: 100%;
            min-height: 46px;
            padding: 12px 13px;
            color: var(--text-main);
            background-color: var(--input-bg);
            border: 1px solid #303030;
            border-radius: var(--radius-sm);
            font-size: 0.8rem;
            transition:
                border-color var(--transition),
                background var(--transition),
                box-shadow var(--transition);
        }

        select {
            cursor: pointer;
        }

        input[type="file"] {
            padding: 8px;
            cursor: pointer;
        }

        input[type="file"]::file-selector-button {
            margin-right: 12px;
            padding: 9px 12px;
            color: #101010;
            background: linear-gradient(
                135deg,
                var(--gold-light),
                var(--gold-dark)
            );
            border: none;
            border-radius: 7px;
            font-size: 0.7rem;
            font-weight: 700;
            cursor: pointer;
            transition: filter var(--transition);
        }

        input[type="file"]::file-selector-button:hover {
            filter: brightness(1.1);
        }

        input[type="file"]:hover,
        select:hover {
            border-color: rgba(223, 194, 133, 0.45);
        }

        input[type="file"]:focus,
        select:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(223, 194, 133, 0.09);
        }

        select option {
            color: var(--text-main);
            background: var(--card-bg);
        }

        /* SEPARADORES DE SECCIÓN */

        .form-group[style*="border-top"] {
            border-top: 1px solid rgba(223, 194, 133, 0.14) !important;
            padding-top: 20px !important;
        }

        /* PANEL DE ZONA ACTIVA */

        #controlesZonaActiva {
            padding: 17px !important;
            margin-bottom: 20px !important;
            background:
                linear-gradient(
                    145deg,
                    rgba(223, 194, 133, 0.045),
                    transparent 65%
                ),
                #0a0a0a !important;
            border: 1px solid rgba(223, 194, 133, 0.24) !important;
            border-radius: var(--radius);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.02);
        }

        #controlesZonaActiva > div:first-child {
            padding-bottom: 12px;
            margin-bottom: 17px !important;
            border-bottom: 1px solid var(--border-soft);
            font-size: 0.7rem !important;
            letter-spacing: 0.7px;
        }

        #controlesZonaActiva .form-group {
            margin-bottom: 17px;
        }

        #controlesZonaActiva .form-group:last-of-type {
            margin-bottom: 8px;
        }

        /* DESLIZADORES */

        .range-slider {
            display: block;
            width: 100%;
            height: 24px;
            margin: 3px 0;
            accent-color: var(--gold);
            cursor: pointer;
            background: transparent;
        }

        .range-slider::-webkit-slider-runnable-track {
            height: 5px;
            background: #303030;
            border-radius: 999px;
        }

        .range-slider::-webkit-slider-thumb {
            width: 17px;
            height: 17px;
            margin-top: -6px;
            appearance: none;
            -webkit-appearance: none;
            background: linear-gradient(
                135deg,
                var(--gold-light),
                var(--gold-dark)
            );
            border: 2px solid #17130b;
            border-radius: 50%;
            box-shadow: 0 0 0 3px rgba(223, 194, 133, 0.11);
        }

        .range-slider::-moz-range-track {
            height: 5px;
            background: #303030;
            border-radius: 999px;
        }

        .range-slider::-moz-range-thumb {
            width: 13px;
            height: 13px;
            background: linear-gradient(
                135deg,
                var(--gold-light),
                var(--gold-dark)
            );
            border: 2px solid #17130b;
            border-radius: 50%;
            box-shadow: 0 0 0 3px rgba(223, 194, 133, 0.11);
        }

        /* BOTONES */

        .btn-accion,
        .btn-secundario {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            border-radius: var(--radius-sm);
            font-weight: 700;
            text-align: center;
            text-transform: uppercase;
            cursor: pointer;
            transition:
                transform var(--transition),
                filter var(--transition),
                background var(--transition),
                border-color var(--transition),
                box-shadow var(--transition);
        }

        .btn-accion {
            min-height: 54px;
            padding: 15px 18px;
            margin-top: 12px;
            color: #111;
            background: linear-gradient(
                135deg,
                var(--gold-light) 0%,
                var(--gold) 48%,
                var(--gold-dark) 100%
            );
            border: 1px solid rgba(243, 229, 171, 0.65);
            box-shadow:
                0 8px 22px rgba(0, 0, 0, 0.25),
                0 4px 16px rgba(223, 194, 133, 0.13);
            font-size: 0.78rem;
            letter-spacing: 1px;
        }

        .btn-accion:hover {
            filter: brightness(1.08);
            box-shadow:
                0 10px 26px rgba(0, 0, 0, 0.32),
                0 4px 20px rgba(223, 194, 133, 0.20);
        }

        .btn-secundario {
            min-height: 42px;
            padding: 11px 13px;
            margin-top: 8px;
            color: var(--gold-light);
            background: rgba(223, 194, 133, 0.055);
            border: 1px solid rgba(223, 194, 133, 0.42);
            font-size: 0.69rem;
            letter-spacing: 0.4px;
        }

        .btn-secundario:hover {
            background: rgba(223, 194, 133, 0.12);
            border-color: var(--gold);
        }

        .btn-accion:active,
        .btn-secundario:active {
            transform: scale(0.985);
        }

        /* BOTÓN ELIMINAR: CONSERVA EL ESTILO DE PELIGRO */

        #controlesZonaActiva .btn-secundario[onclick="eliminarZonaActiva()"] {
            color: var(--danger) !important;
            background: var(--danger-bg) !important;
            border-color: rgba(255, 80, 80, 0.48) !important;
        }

        #controlesZonaActiva .btn-secundario[onclick="eliminarZonaActiva()"]:hover {
            background: rgba(255, 80, 80, 0.15) !important;
            border-color: var(--danger) !important;
        }

        /* FILTROS ESTÉTICOS */

        .filtros-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 9px;
        }

        .filtro-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 42px;
            padding: 10px 5px;
            color: var(--text-muted);
            background: #171717;
            border: 1px solid #303030;
            border-radius: 9px;
            font-size: 0.63rem;
            font-weight: 700;
            line-height: 1.35;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 0.35px;
            cursor: pointer;
            transition:
                color var(--transition),
                background var(--transition),
                border-color var(--transition),
                transform var(--transition),
                box-shadow var(--transition);
        }

        .filtro-btn:hover {
            color: var(--gold-light);
            border-color: rgba(223, 194, 133, 0.45);
            background: #202020;
        }

        .filtro-btn.active {
            color: var(--gold-light);
            background: linear-gradient(
                135deg,
                rgba(223, 194, 133, 0.16),
                rgba(223, 194, 133, 0.055)
            );
            border-color: var(--gold);
            box-shadow: inset 0 0 0 1px rgba(223, 194, 133, 0.07);
        }

        .filtro-btn:active {
            transform: scale(0.97);
        }

        /* INSTRUCCIONES DEL LIENZO */

        .preview-container + button {
            margin-top: 8px;
        }

        body > .container > div[style*="text-align: center"] {
            max-width: 440px;
            margin: 4px auto 14px !important;
            padding: 0 8px;
            color: var(--text-muted) !important;
            font-size: 0.68rem !important;
            font-weight: 500;
            line-height: 1.7;
            letter-spacing: 0.6px !important;
        }

        /* LIENZO */

        .preview-container {
            display: flex;
            justify-content: center;
            width: 100%;
            margin-bottom: 17px;
            overflow: hidden;
        }

        .editor-canvas-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 440px;
            min-height: 120px;
            overflow: hidden;
            background:
                radial-gradient(
                    circle at center,
                    #171717 0%,
                    #080808 75%
                );
            border: 1px solid rgba(223, 194, 133, 0.75);
            border-radius: var(--radius);
            box-shadow:
                0 18px 40px rgba(0, 0, 0, 0.45),
                0 0 0 5px rgba(223, 194, 133, 0.035),
                inset 0 0 30px rgba(0, 0, 0, 0.30);
            touch-action: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
            max-width: 100%;
            cursor: move;
            touch-action: none;
        }

        /* VALORES Y ETIQUETAS */

        #lblAncho,
        #lblAlto,
        #lblInt,
        #valBrillo {
            display: inline-block;
            min-width: 20px;
            color: var(--gold-light);
            font-variant-numeric: tabular-nums;
        }

        /* RESPONSIVE: CELULARES */

        @media (max-width: 480px) {
            body {
                padding: 15px 12px 34px;
            }

            header {
                gap: 10px;
                margin-bottom: 18px;
                padding-bottom: 15px;
            }

            h1 {
                font-size: 1.18rem;
                letter-spacing: 1.2px;
            }

            .back-link {
                padding: 9px 10px;
                font-size: 0.60rem;
                letter-spacing: 0.4px;
            }

            .form-card {
                padding: 17px 14px;
                margin-bottom: 18px;
                border-radius: 17px;
            }

            .form-card::before {
                left: 16px;
                right: 16px;
            }

            .form-group {
                margin-bottom: 18px;
            }

            label {
                font-size: 0.65rem;
                letter-spacing: 0.65px;
            }

            input[type="file"],
            select {
                font-size: 0.76rem;
            }

            input[type="file"]::file-selector-button {
                padding: 9px 10px;
                font-size: 0.66rem;
            }

            #controlesZonaActiva {
                padding: 13px !important;
            }

            .filtros-grid {
                gap: 6px;
            }

            .filtro-btn {
                min-height: 40px;
                padding: 8px 3px;
                font-size: 0.58rem;
                letter-spacing: 0;
            }

            .btn-secundario {
                padding: 11px 8px;
                font-size: 0.65rem;
            }

            .btn-accion {
                min-height: 51px;
                padding: 13px 10px;
                font-size: 0.71rem;
                letter-spacing: 0.7px;
            }

            .editor-canvas-wrapper {
                border-radius: 12px;
            }

            body > .container > div[style*="text-align: center"] {
                font-size: 0.64rem !important;
                line-height: 1.65;
            }
        }

        /* PANTALLAS MUY ANGOSTAS */

        @media (max-width: 350px) {
            body {
                padding-right: 9px;
                padding-left: 9px;
            }

            h1 {
                font-size: 1.02rem;
            }

            .back-link {
                font-size: 0.56rem;
            }

            .form-card {
                padding: 14px 11px;
            }

            .filtro-btn {
                font-size: 0.54rem;
            }
        }

        /* PANTALLAS GRANDES */

        @media (min-width: 700px) {
            body {
                padding-top: 32px;
            }

            .form-card {
                padding: 25px;
            }
        }

        /* REDUCIR ANIMACIONES SI EL USUARIO LO PREFIERE */

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <header>
            <h1>Editor Pro Canvas</h1>
            <a href="panel_total.html" class="back-link">&larr; Volver</a>
        </header>

        <div class="form-card">
            <div class="form-group">
                <label>1. Seleccionar Fotografía (Tamaño Real)</label>
                <input type="file" id="inputFotoEditor" accept="image/*" onchange="cargarImagenEditor(event)">
            </div>

            <div class="form-group" style="border-top: 1px solid #222; padding-top: 10px;">
                <label style="color: var(--gold);">🔒 Zonas de Privacidad (Ojos, Tatuajes)</label>
                <button type="button" class="btn-secundario" onclick="agregarZonaBlur()">➕ Agregar Zona de Difuminado</button>
            </div>

            <div id="controlesZonaActiva" style="display: none; background: #080808; padding: 10px; border-radius: 8px; border: 1px solid #222; margin-bottom: 12px;">
                <div style="font-size: 0.65rem; color: var(--gold); margin-bottom: 8px; font-weight: 700; text-align: center;">⚙️ Ajustar Zona Seleccionada:</div>

                <div class="form-group">
                    <label>Forma</label>
                    <select id="selForma" onchange="actualizarPropiedadesZona()">
                        <option value="franja">Franja / Rectángulo (Ideal Ojos)</option>
                        <option value="circulo">Círculo</option>
                        <option value="cuadrado">Bloque Cuadrado</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Ancho (<span id="lblAncho">120</span>px)</label>
                    <input type="range" id="rngAncho" min="40" max="300" value="120" class="range-slider" oninput="actualizarPropiedadesZona()">
                </div>

                <div class="form-group">
                    <label>Alto (<span id="lblAlto">45</span>px)</label>
                    <input type="range" id="rngAlto" min="20" max="200" value="45" class="range-slider" oninput="actualizarPropiedadesZona()">
                </div>

                <div class="form-group" style="margin-bottom: 0;">
                    <label>Intensidad de Desenfoque (<span id="lblInt">12</span>px)</label>
                    <input type="range" id="rngInt" min="2" max="25" value="12" class="range-slider" oninput="actualizarPropiedadesZona()">
                </div>

                <button type="button" class="btn-secundario" style="background: rgba(255,80,80,0.15); border-color: #ff5050; color: #ff8080; margin-top: 8px;" onclick="eliminarZonaActiva()">🗑️ Eliminar Zona</button>
            </div>

            <div class="form-group" style="border-top: 1px solid #222; padding-top: 10px;">
                <label>Filtros Estéticos</label>

                <div class="filtros-grid">
                    <button type="button" class="filtro-btn active" onclick="aplicarFiltro('normal', this)">Normal</button>
                    <button type="button" class="filtro-btn" onclick="aplicarFiltro('cine', this)">Cine Dark</button>
                    <button type="button" class="filtro-btn" onclick="aplicarFiltro('calido', this)">Cálido Privé</button>
                </div>
            </div>

            <div class="form-group">
                <label>Luminosidad (<span id="valBrillo">100</span>%)</label>
                <input type="range" id="rangeBrillo" min="70" max="150" value="100" class="range-slider" oninput="redibujarCanvas()">
            </div>
        </div>

        <div style="text-align: center; margin-bottom: 8px; font-size: 0.68rem; color: var(--gold); text-transform: uppercase; letter-spacing: 1.5px;">👉 Tocá y arrastrá el cuadro directamente con el dedo por la foto</div>

        <div class="preview-container">
            <div class="editor-canvas-wrapper" id="editorCanvasBox">
                <canvas id="priveCanvas"></canvas>
            </div>
        </div>

        <button type="button" class="btn-accion" onclick="descargarFotoEditada()">📥 Descargar Imagen Pro (PNG)</button>
    </div>

    <script>
        let canvas = document.getElementById('priveCanvas');
        let ctx = canvas.getContext('2d');
        let imgOriginal = new Image();
        let imagenCargada = false;

        let zonasBlur = [];
        let indexZonaActiva = null;
        let isDragging = false;
        let dragOffsetX = 0;
        let dragOffsetY = 0;

        // Imagen por defecto inicial (monograma)
        imgOriginal.crossOrigin = "anonymous";
        imgOriginal.src = "img/monograma.png";
        imgOriginal.onload = function() {
            inicializarCanvas();
        };

        function inicializarCanvas() {
            canvas.width = imgOriginal.width;
            canvas.height = imgOriginal.height;

            // Si no hay zonas creadas, crear una por defecto arriba (zona de ojos)
            if (zonasBlur.length === 0) {
                zonasBlur.push({
                    x: (canvas.width / 2) - 60,
                    y: (canvas.height / 3) - 22,
                    width: 120,
                    height: 45,
                    blur: 12,
                    shape: 'franja'
                });
                indexZonaActiva = 0;
            }
            redibujarCanvas();
            actualizarPanelControles();
        }

        function cargarImagenEditor(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                imgOriginal.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function redibujarCanvas() {
            if (!imgOriginal.complete) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Aplicar filtros de luz/color globales
            let brillo = document.getElementById('rangeBrillo').value;
            let filtroBtnActivo = document.querySelector('.filtro-btn.active').textContent;

            if (filtroBtnActivo.includes('Cine')) {
                ctx.filter = `brightness(95%) contrast(120%) saturate(90%)`;
            } else if (filtroBtnActivo.includes('Cálido')) {
                ctx.filter = `brightness(105%) contrast(105%) sepia(15%)`;
            } else {
                ctx.filter = `brightness(${brillo}%)`;
            }

            // Dibujar imagen completa original en tamaño real
            ctx.drawImage(imgOriginal, 0, 0, canvas.width, canvas.height);
            ctx.filter = 'none'; // Resetear filtros para los recortes

            // 2. Dibujar y aplicar el difuminado real (blur) en cada zona de privacidad
            zonasBlur.forEach((z, index) => {
                ctx.save();
                ctx.beginPath();

                if (z.shape === 'circulo') {
                    let radio = Math.min(z.width, z.height) / 2;
                    ctx.arc(z.x + radio, z.y + radio, radio, 0, Math.PI * 2);
                } else if (z.shape === 'cuadrado') {
                    ctx.roundRect(z.x, z.y, z.width, z.height, 15);
                } else {
                    // Franja rectangular suave
                    ctx.roundRect(z.x, z.y, z.width, z.height, 6);
                }

                ctx.clip();

                // Aplicar desenfoque real recortando la sección de la imagen
                ctx.filter = `blur(${z.blur}px)`;
                ctx.drawImage(imgOriginal, 0, 0, canvas.width, canvas.height);
                ctx.restore();

                // Si es la zona activa, dibujarle un sutil borde guía dorado elegante
                if (index === indexZonaActiva) {
                    ctx.save();
                    ctx.strokeStyle = '#dfc285';
                    ctx.lineWidth = 3;
                    ctx.setLineDash([6, 4]);
                    if (z.shape === 'circulo') {
                        let radio = Math.min(z.width, z.height) / 2;
                        ctx.beginPath();
                        ctx.arc(z.x + radio, z.y + radio, radio, 0, Math.PI * 2);
                        ctx.stroke();
                    } else {
                        ctx.strokeRect(z.x, z.y, z.width, z.height);
                    }
                    ctx.restore();
                }
            });
        }

        function aplicarFiltro(tipo, btn) {
            document.querySelectorAll('.filtro-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            redibujarCanvas();
        }

        function agregarZonaBlur() {
            zonasBlur.push({
                x: (canvas.width / 2) - 60,
                y: (canvas.height / 2) - 22,
                width: 120,
                height: 45,
                blur: 12,
                shape: 'franja'
            });
            indexZonaActiva = zonasBlur.length - 1;
            redibujarCanvas();
            actualizarPanelControles();
        }

        function actualizarPanelControles() {
            if (indexZonaActiva !== null && zonasBlur[indexZonaActiva]) {
                document.getElementById('controlesZonaActiva').style.display = 'block';
                let z = zonasBlur[indexZonaActiva];
                document.getElementById('selForma').value = z.shape;
                document.getElementById('rngAncho').value = z.width;
                document.getElementById('lblAncho').textContent = z.width;
                document.getElementById('rngAlto').value = z.height;
                document.getElementById('lblAlto').textContent = z.height;
                document.getElementById('rngInt').value = z.blur;
                document.getElementById('lblInt').textContent = z.blur;
            } else {
                document.getElementById('controlesZonaActiva').style.display = 'none';
            }
        }

        function actualizarPropiedadesZona() {
            if (indexZonaActiva === null || !zonasBlur[indexZonaActiva]) return;
            let z = zonasBlur[indexZonaActiva];
            z.shape = document.getElementById('selForma').value;
            z.width = parseInt(document.getElementById('rngAncho').value);
            document.getElementById('lblAncho').textContent = z.width;
            z.height = parseInt(document.getElementById('rngAlto').value);
            document.getElementById('lblAlto').textContent = z.height;
            z.blur = parseInt(document.getElementById('rngInt').value);
            document.getElementById('lblInt').textContent = z.blur;

            redibujarCanvas();
        }

        function eliminarZonaActiva() {
            if (indexZonaActiva === null) return;
            zonasBlur.splice(indexZonaActiva, 1);
            indexZonaActiva = zonasBlur.length > 0 ? 0 : null;
            redibujarCanvas();
            actualizarPanelControles();
        }

        // --- SISTEMA DE ARRASTRE FLUIDO DIRECTO SOBRE EL CANVAS ---
        function obtenerCoordenadasCanvas(e) {
            let rect = canvas.getBoundingClientRect();
            let clientX = e.clientX || (e.touches && e.touches[0].clientX);
            let clientY = e.clientY || (e.touches && e.touches[0].clientY);

            let scaleX = canvas.width / rect.width;
            let scaleY = canvas.height / rect.height;

            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY
            };
        }

        function iniciarArrastre(e) {
            let coords = obtenerCoordenadasCanvas(e);

            // Buscar si tocó alguna zona existente (empezando desde la última creada)
            let encontrada = -1;
            for (let i = zonasBlur.length - 1; i >= 0; i--) {
                let z = zonasBlur[i];
                if (coords.x >= z.x && coords.x <= z.x + z.width && coords.y >= z.y && coords.y <= z.y + z.height) {
                    encontrada = i;
                    break;
                }
            }

            if (encontrada !== -1) {
                indexZonaActiva = encontrada;
                isDragging = true;
                let z = zonasBlur[indexZonaActiva];
                dragOffsetX = coords.x - z.x;
                dragOffsetY = coords.y - z.y;
                actualizarPanelControles();
                redibujarCanvas();
                e.preventDefault();
            }
        }

        function moverArrastre(e) {
            if (!isDragging || indexZonaActiva === null) return;
            let coords = obtenerCoordenadasCanvas(e);
            let z = zonasBlur[indexZonaActiva];

            z.x = coords.x - dragOffsetX;
            z.y = coords.y - dragOffsetY;

            redibujarCanvas();
            e.preventDefault();
        }

        function finalizarArrastre(e) {
            isDragging = false;
        }

        // Eventos táctiles y de mouse unidos al canvas
        canvas.addEventListener('mousedown', iniciarArrastre);
        window.addEventListener('mousemove', moverArrastre);
        window.addEventListener('mouseup', finalizarArrastre);

        canvas.addEventListener('touchstart', iniciarArrastre, {passive: false});
        window.addEventListener('touchmove', moverArrastre, {passive: false});
        window.addEventListener('touchend', finalizarArrastre);

        function descargarFotoEditada() {
            // Ocultar bordes guías dorados antes de exportar la imagen limpia
            let tempActiva = indexZonaActiva;
            indexZonaActiva = null;
            redibujarCanvas();

            const enlace = document.createElement('a');
            enlace.download = `prive-foto-pro-${Date.now()}.png`;
            enlace.href = canvas.toDataURL('image/png');
            enlace.click();

            // Restaurar selección
            indexZonaActiva = tempActiva;
            redibujarCanvas();
        }
    </script>
</body>
</html>
