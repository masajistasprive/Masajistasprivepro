<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Editor Pro Mobile | Masajistas Privé</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
            --card-bg: #111111;
            --card-border: rgba(223, 194, 133, 0.3);
            --gold: #dfc285;
            --gold-light: #f3e5ab;
            --text-main: #f5f5f5;
            --text-muted: #888888;
            --radius: 14px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 15px;
            padding-bottom: 100px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 12px;
        }

        h1 {
            color: var(--gold);
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-family: 'Cormorant Garamond', serif;
        }

        .back-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .back-link:hover { color: var(--gold); }

        .form-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 0.68rem;
            color: var(--gold);
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
        }

        input[type="file"], select {
            width: 100%;
            padding: 12px;
            background-color: #060606;
            border: 1px solid #222;
            border-radius: 8px;
            color: var(--text-main);
            font-size: 0.85rem;
        }

        .range-slider {
            width: 100%;
            accent-color: var(--gold);
            cursor: pointer;
        }

        .preview-container {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-bottom: 15px;
            overflow: hidden;
        }

        .editor-canvas-wrapper {
            width: 100%;
            max-width: 400px;
            min-height: 420px;
            background: #000;
            border: 2px solid var(--gold);
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
        }

        .editor-canvas-wrapper img {
            width: 100%;
            height: auto;
            max-height: 600px;
            object-fit: contain;
            display: block;
            pointer-events: none;
        }

        /* Zonas de difuminado con Pointer Events optimizados */
        .blur-spot {
            position: absolute;
            width: 90px;
            height: 35px;
            border-radius: 6px;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            background: rgba(20, 20, 20, 0.45);
            cursor: grab;
            z-index: 10;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
            border: 2px dashed rgba(223, 194, 133, 0.9);
            touch-action: none;
        }
        .blur-spot:active { cursor: grabbing; }
        .blur-spot.circulo { border-radius: 50%; }
        .blur-spot.cuadrado { border-radius: 12px; }
        .blur-spot.seleccionado {
            border: 2px solid var(--gold);
            box-shadow: 0 0 25px rgba(223, 194, 133, 0.9);
        }

        .btn-accion {
            background: linear-gradient(135deg, var(--gold), #b89751);
            color: #000;
            border: none;
            width: 100%;
            padding: 14px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            box-shadow: 0 4px 15px rgba(223, 194, 133, 0.3);
            margin-top: 10px;
        }

        .btn-secundario {
            background: rgba(223, 194, 133, 0.15);
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 10px;
            border-radius: 8px;
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            width: 100%;
            margin-top: 8px;
        }

        .filtros-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }

        .filtro-btn {
            background: #1a1a1a;
            border: 1px solid #333;
            color: var(--text-muted);
            padding: 8px;
            border-radius: 6px;
            font-size: 0.62rem;
            text-transform: uppercase;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
        }
        .filtro-btn.active {
            background: rgba(223, 194, 133, 0.15);
            border-color: var(--gold);
            color: var(--gold);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Editor Pro Mobile</h1>
            <a href="panel_total.html" class="back-link">&larr; Volver</a>
        </header>

        <div class="form-card">
            <div class="form-group">
                <label>1. Seleccionar Fotografía</label>
                <input type="file" id="inputFotoEditor" accept="image/*" onchange="cargarImagenEditor(event)">
            </div>

            <div class="form-group" style="border-top: 1px solid #222; padding-top: 10px;">
                <label style="color: var(--gold);">🔒 Zonas de Privacidad</label>
                <button type="button" class="btn-secundario" onclick="agregarZonaBlur()">➕ Agregar Zona de Difuminado</button>
            </div>

            <div id="controlesZonaActiva" style="display: none; background: #080808; padding: 10px; border-radius: 8px; border: 1px solid #222; margin-bottom: 12px;">
                <div style="font-size: 0.65rem; color: var(--gold); margin-bottom: 8px; font-weight: 700; text-align: center;">⚙️ Ajustar Zona Seleccionada:</div>
                
                <div class="form-group">
                    <label>Forma</label>
                    <select id="selForma" onchange="actualizarZonaActivaProp()">
                        <option value="franja">Franja / Rectángulo (Ideal Ojos)</option>
                        <option value="circulo">Círculo</option>
                        <option value="cuadrado">Bloque Cuadrado</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Ancho (<span id="lblAncho">90</span>px)</label>
                    <input type="range" id="rngAncho" min="30" max="250" value="90" class="range-slider" oninput="actualizarZonaActivaProp()">
                </div>
                <div class="form-group">
                    <label>Alto (<span id="lblAlto">35</span>px)</label>
                    <input type="range" id="rngAlto" min="15" max="150" value="35" class="range-slider" oninput="actualizarZonaActivaProp()">
                </div>
                <div class="form-group" style="margin-bottom: 0;">
                    <label>Intensidad de Desenfoque (<span id="lblInt">14</span>px)</label>
                    <input type="range" id="rngInt" min="4" max="25" value="14" class="range-slider" oninput="actualizarZonaActivaProp()">
                </div>
                <button type="button" class="btn-secundario" style="background: rgba(255,80,80,0.15); border-color: #ff5050; color: #ff8080; margin-top: 8px;" onclick="eliminarZonaActiva()">🗑️ Eliminar Zona</button>
            </div>

            <div class="form-group" style="border-top: 1px solid #222; padding-top: 10px;">
                <label>Filtros Estéticos</label>
                <div class="filtros-grid">
                    <button type="button" class="filtro-btn active" onclick="aplicarFiltro('normal', this)">Normal</button>
                    <button type="button" class="filtro-btn" onclick="aplicarFiltro('cine', this)">Cine Dark</button>
                    <button type="button" class="filtro-btn" onclick="aplicarFiltro('calido', this)">Cálido Privé</button>
                </div>
            </div>

            <div class="form-group">
                <label>Luminosidad (<span id="valBrillo">100</span>%)</label>
                <input type="range" id="rangeBrillo" min="70" max="150" value="100" class="range-slider" oninput="actualizarFiltrosCSS()">
            </div>
        </div>

        <div style="text-align: center; margin-bottom: 8px; font-size: 0.68rem; color: var(--gold); text-transform: uppercase; letter-spacing: 1.5px;">💡 Tip: Tocá la foto para mover la zona o arrastrala libremente</div>
        
        <div class="preview-container">
            <div class="editor-canvas-wrapper" id="editorCanvasBox" onclick="teleportarZona(event)">
                <img id="imagenEditada" src="img/monograma.png" alt="Foto" crossorigin="anonymous">
            </div>
        </div>

        <button type="button" class="btn-accion" onclick="descargarFotoEditada()">📥 Descargar Imagen Pro (PNG)</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <script>
        let filtroActual = 'normal';
        let zonasBlur = [];
        let idZonaActiva = null;

        function cargarImagenEditor(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('imagenEditada').src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function aplicarFiltro(tipo, btn) {
            filtroActual = tipo;
            document.querySelectorAll('.filtro-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            const img = document.getElementById('imagenEditada');
            if (tipo === 'cine') {
                img.style.filter = `brightness(95%) contrast(120%) saturate(90%)`;
            } else if (tipo === 'calido') {
                img.style.filter = `brightness(105%) contrast(105%) sepia(15%)`;
            } else {
                actualizarFiltrosCSS();
            }
        }

        function actualizarFiltrosCSS() {
            if (filtroActual !== 'normal') return;
            const b = document.getElementById('rangeBrillo').value;
            document.getElementById('valBrillo').textContent = b;
            document.getElementById('imagenEditada').style.filter = `brightness(${b}%)`;
        }

        function agregarZonaBlur() {
            const container = document.getElementById('editorCanvasBox');
            const id = 'blur_' + Date.now();
            
            const nuevaZona = {
                id: id,
                x: (container.clientWidth / 2) - 45,
                y: (container.clientHeight / 3) - 18,
                width: 90,
                height: 35,
                intensity: 14,
                shape: 'franja'
            };

            zonasBlur.push(nuevaZona);
            renderizarZonas();
            seleccionarZona(id);
        }

        function renderizarZonas() {
            const container = document.getElementById('editorCanvasBox');
            container.querySelectorAll('.blur-spot').forEach(el => el.remove());

            zonasBlur.forEach(z => {
                const div = document.createElement('div');
                let shapeClass = 'franja';
                if (z.shape === 'circulo') shapeClass = 'circulo';
                if (z.shape === 'cuadrado') shapeClass = 'cuadrado';

                div.className = `blur-spot ${shapeClass} ${z.id === idZonaActiva ? 'seleccionado' : ''}`;
                div.id = z.id;
                div.style.left = z.x + 'px';
                div.style.top = z.y + 'px';
                div.style.width = z.width + 'px';
                div.style.height = z.height + 'px';
                div.style.backdropFilter = `blur(${z.intensity}px)`;
                div.style.webkitBackdropFilter = `blur(${z.intensity}px)`;

                activarPointerDrag(div, z.id);
                container.appendChild(div);
            });
        }

        function seleccionarZona(id) {
            idZonaActiva = id;
            const zona = zonasBlur.find(z => z.id === id);
            if (!zona) return;

            document.getElementById('controlesZonaActiva').style.display = 'block';
            document.getElementById('selForma').value = zona.shape;
            document.getElementById('rngAncho').value = zona.width;
            document.getElementById('lblAncho').textContent = zona.width;
            document.getElementById('rngAlto').value = zona.height;
            document.getElementById('lblAlto').textContent = zona.height;
            document.getElementById('rngInt').value = zona.intensity;
            document.getElementById('lblInt').textContent = zona.intensity;

            renderizarZonas();
        }

        // Permitir hacer clic/toque en la foto para mover la zona activa de golpe al lugar exacto
        function teleportarZona(e) {
            if (!idZonaActiva) return;
            // Si tocó directamente una zona, dejamos que actúe el drag
            if (e.target.classList.contains('blur-spot')) return;

            const container = document.getElementById('editorCanvasBox');
            const rect = container.getBoundingClientRect();
            const zona = zonasBlur.find(z => z.id === idZonaActiva);
            if (!zona) return;

            const x = (e.clientX - rect.left) - (zona.width / 2);
            const y = (e.clientY - rect.top) - (zona.height / 2);

            zona.x = Math.max(0, Math.min(x, rect.width - zona.width));
            zona.y = Math.max(0, Math.min(y, rect.height - zona.height));

            renderizarZonas();
        }

        function actualizarZonaActivaProp() {
            if (!idZonaActiva) return;
            const zona = zonasBlur.find(z => z.id === idZonaActiva);
            if (!zona) return;

            zona.shape = document.getElementById('selForma').value;
            zona.width = parseInt(document.getElementById('rngAncho').value);
            document.getElementById('lblAncho').textContent = zona.width;

            zona.height = parseInt(document.getElementById('rngAlto').value);
            document.getElementById('lblAlto').textContent = zona.height;
            
            zona.intensity = parseInt(document.getElementById('rngInt').value);
            document.getElementById('lblInt').textContent = zona.intensity;

            renderizarZonas();
        }

        function eliminarZonaActiva() {
            if (!idZonaActiva) return;
            zonasBlur = zonasBlur.filter(z => z.id !== idZonaActiva);
            idZonaActiva = null;
            document.getElementById('controlesZonaActiva').style.display = 'none';
            renderizarZonas();
        }

        // Sistema de arrastre universal con Pointer Events (Optimizado 100% para Android / Chrome Mobile)
        function activarPointerDrag(elemento, id) {
            const container = document.getElementById('editorCanvasBox');
            let startX, startY;

            function onPointerDown(e) {
                seleccionarZona(id);
                const zona = zonasBlur.find(z => z.id === id);
                startX = e.clientX - zona.x;
                startY = e.clientY - zona.y;

                elemento.setPointerCapture(e.pointerId);
                elemento.onpointermove = onPointerMove;
                elemento.onpointerup = onPointerUp;
                e.stopPropagation();
            }

            function onPointerMove(e) {
                const zona = zonasBlur.find(z => z.id === id);
                const rect = container.getBoundingClientRect();

                let x = e.clientX - startX;
                let y = e.clientY - startY;

                x = Math.max(0, Math.min(x, rect.width - zona.width));
                y = Math.max(0, Math.min(y, rect.height - zona.height));

                zona.x = x;
                zona.y = y;

                elemento.style.left = x + 'px';
                elemento.style.top = y + 'px';
            }

            function onPointerUp(e) {
                elemento.releasePointerCapture(e.pointerId);
                elemento.onpointermove = null;
                elemento.onpointerup = null;
            }

            elemento.onpointerdown = onPointerDown;
        }

        function descargarFotoEditada() {
            const elemento = document.getElementById('editorCanvasBox');
            document.querySelectorAll('.blur-spot').forEach(el => el.classList.remove('seleccionado'));

            html2canvas(elemento, {
                scale: 2,
                useCORS: true,
                backgroundColor: '#000000'
            }).then(canvas => {
                const enlace = document.createElement('a');
                enlace.download = `prive-foto-pro-${Date.now()}.png`;
                enlace.href = canvas.toDataURL('image/png');
                enlace.click();
                renderizarZonas();
            }).catch(err => {
                alert("Error al procesar la imagen.");
                renderizarZonas();
            });
        }
    </script>
</body>
</html>
