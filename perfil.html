 try{
  const key='prive_visitor_metrics_v1';
  let id=localStorage.getItem(key);
  if(!id||!/^[a-f0-9]{32}$/.test(id)){
   const bytes=new Uint8Array(16);crypto.getRandomValues(bytes);
   id=Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join('');

 }catch{return null}
}
async function registrarMetricaPrivada(tipo){
 if(!modelo||!perfilId||!['visita','whatsapp'].includes(tipo))return;

  const dia=fechaMetrica();

 }catch(error){

}
const whatsappSvg='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M.057 24l1.687-6.163A11.8 11.8 0 0 1 .157 11.89C.16 5.34 5.49 0 12.05 0c6.55 0 11.89 5.34 11.89 11.9 0 6.56-5.34 11.89-11.89 11.89-1.99 0-3.95-.5-5.69-1.45L.057 24zm6.6-3.81c1.68 1 3.28 1.59 5.39 1.59 5.45 0 9.89-4.43 9.89-9.88 0-5.46-4.42-9.89-9.88-9.89-5.45 0-9.89 4.44-9.89 9.89 0 2.22.65 3.89 1.75 5.63l-1 3.65 3.74-.98zm11.38-5.46c-.07-.12-.27-.2-.57-.35-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.17-.17.2-.35.22-.64.07-.3-.15-1.26-.46-2.39-1.48-.88-.79-1.48-1.76-1.65-2.06-.18-.3-.02-.46.13-.61.13-.13.3-.35.44-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.08-.15-.67-1.61-.92-2.21-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-.27.3-1.04 1.02-1.04 2.48s1.07 2.88 1.21 3.07c.15.2 2.1 3.2 5.08 4.49.71.31 1.26.49 1.69.63.71.23 1.36.19 1.87.12.57-.09 1.76-.72 2.01-1.41.25-.7.25-1.29.17-1.42z"/></svg>';
function renderProfile(){
const m=modelo,L=t(),tr=m.traducciones||{},x=tr[idiomaPerfil]||tr.es||{};
const pick=(key,fall='')=>x[key]||fall;
const description=[pick('descPerfil1',m.descripcion),pick('descPerfil2')].filter(Boolean).join('\n\n');
const phone=String(m.whatsapp||'').replace(/\D/g,'');const whatsapp=phone?`https://wa.me/${phone}?text=${encodeURIComponent(`Hola ${m.nombre||''}, vi tu perfil en Masajistas Privé: ${location.href}`)}`:'';
const active=m.estado!=='pausado';
const pics=(Array.isArray(m.fotosGaleria)?m.fotosGaleria:[]).map(safeUrl).filter(Boolean);const main=safeUrl(m.fotoPrincipal)||safeUrl(m.foto)||pics[0]||'img/logo.png';
lightboxUrls=[main,...pics.filter(p=>p!==main)];
const details=[['valorHorarios','horarios',L.hours],['valorEquipamiento','equipamiento',L.equipment],['valorPagos','pagos',L.payments],['valorTurnos','turnos',L.appointments]].map(([key,fallback,label])=>{const value=pick(key,m[fallback]||'');return value?`<div class="detalle-item"><span>${esc(label)}</span> <span>${esc(value)}</span></div>`:''}).join('');
const favs=readFavs(),isFav=favs.includes(perfilId);
document.getElementById('contenedorWppFlotante').innerHTML=active&&whatsapp?`<a href="${esc(whatsapp)}" target="_blank" rel="noopener noreferrer" class="btn-whatsapp-flotante" data-metrica-whatsapp="flotante">${whatsappSvg}<span>${esc(L.whatsapp)}</span></a>`:'';
document.getElementById('perfil-content-box').innerHTML=`
<div class="perfil-galeria-grid"><img src="${esc(main)}" alt="${esc(m.nombre)}" class="foto-principal" id="fotoPrincipal" data-photo="0" fetchpriority="high" decoding="async"><div class="galeria-miniaturas">${lightboxUrls.map((p,i)=>`<img src="${esc(p)}" alt="${esc(m.nombre)} ${i+1}" data-photo="${i}" loading="lazy" decoding="async">`).join('')}</div></div>
<div class="perfil-info"><div class="perfil-titulo-seccion"><h2>${esc(m.nombre)}</h2><span class="badge-verificado">${esc(L.verified)}</span></div>
<p class="perfil-ubicacion">📍 ${esc(L.area)} <strong>${esc(pick('valorZona',m.zona))}</strong></p><p class="perfil-modalidad">🏠 ${esc(L.mode)} <strong>${esc(pick('valorModalidad',m.modalidad))}</strong></p>
<div class="perfil-descripcion"><h3>${esc(L.description)}</h3><div class="prive-description-text">${formatProfileText(description)}</div>${pick('valorTecnicas')?`<section class="prive-techniques"><strong class="prive-techniques-title">${esc(L.techniques)}</strong><div class="prive-techniques-text">${formatProfileText(pick('valorTecnicas'))}</div></section>`:''}</div>
${details?`<div class="perfil-detalles">${details}</div>`:''}
<div class="perfil-acciones-inferior"><div class="btn-accion-secundarios"><button type="button" id="btnFavElement" class="btn-accion-prive btn-accion-fav ${isFav?'activo':''}">❤️ ${esc(isFav?L.saved:L.favorite)}</button><button type="button" id="btnShare" class="btn-accion-prive btn-accion-compartir">↗ ${esc(L.share)}</button></div></div></div>
<section class="prive-review-panel"><h3>${esc(L.reviews)}</h3><div class="review-form"><div style="display:flex;justify-content:space-between;align-items:center;background:#1a1a1a;border:1px solid #dfc28555;padding:10px;border-radius:6px"><span style="color:#dfc285;font-size:13px">${esc(L.rating)}</span><div class="star-rating">${[5,4,3,2,1].map(n=>`<input type="radio" id="star${n}" name="rating" value="${n}"><label for="star${n}" title="${n} estrellas">★</label>`).join('')}</div></div><input type="text" id="pAuthor" maxlength="70" placeholder="${esc(L.author)}"><textarea id="pText" rows="3" maxlength="2000" placeholder="${esc(L.review)}"></textarea><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">${['😊','👍','🔥','❤️','⭐'].map(e=>`<button type="button" class="emoji-btn" data-emoji="${e}" style="background:none;border:0;font-size:20px;cursor:pointer">${e}</button>`).join('')}<label style="margin-left:auto;color:#dfc285;cursor:pointer">📎 ${esc(L.photo)} <input type="file" id="pImageFile" accept="image/jpeg,image/png,image/webp" style="display:none"></label></div><small id="pFileName" style="color:#dfc285"></small><button type="button" class="review-submit" id="pSubmit">${esc(L.publish)}</button><p id="pFormStatus" role="status" style="color:#dfc285;font-size:12px;margin:0"></p></div><div id="pCommentsContainer" aria-live="polite"><p class="review-status">${esc(L.loading)}</p></div></section>`;
document.getElementById('perfil-title').textContent=`${m.nombre||'Perfil'} | Masajistas Privé`;
document.querySelectorAll('[data-photo]').forEach(el=>{el.setAttribute('draggable','false');el.addEventListener('click',()=>openLightbox(Number(el.dataset.photo)));});
document.getElementById('btnFavElement').addEventListener('click',toggleFavorite);
document.getElementById('btnShare').addEventListener('click',shareProfile);
document.querySelectorAll('.emoji-btn').forEach(b=>b.addEventListener('click',()=>{const el=document.getElementById('pText');el.value+=b.dataset.emoji;el.focus()}));
document.getElementById('pImageFile').addEventListener('change',e=>document.getElementById('pFileName').textContent=e.target.files[0]?.name||'');
document.getElementById('pSubmit').addEventListener('click',submitReview);
}
function readFavs(){try{const a=JSON.parse(localStorage.getItem('priveFavoritos')||'[]');return Array.isArray(a)?a:[]}catch{return []}}
function toggleFavorite(){const f=readFavs(),i=f.indexOf(perfilId);if(i>=0)f.splice(i,1);else f.push(perfilId);localStorage.setItem('priveFavoritos',JSON.stringify(f));const b=document.getElementById('btnFavElement');b.classList.toggle('activo',i<0);b.textContent='❤️ '+(i<0?t().saved:t().favorite)}
async function shareProfile(){if(navigator.share){try{await navigator.share({title:`${modelo.nombre} | Masajistas Privé`,url:location.href});registrarMetrica('perfil_compartido',{metodo:'compartir_nativo'})}catch{}}else{try{await navigator.clipboard.writeText(location.href);registrarMetrica('perfil_compartido',{metodo:'copiar_enlace'});alert(t().copied)}catch{prompt('Copiá este enlace:',location.href)}}}
document.addEventListener('contextmenu',e=>{if(e.target.closest('.perfil-galeria-grid, .prive-lightbox-photo'))e.preventDefault()});
document.addEventListener('dragstart',e=>{if(e.target.closest('.perfil-galeria-grid, .prive-lightbox-photo'))e.preventDefault()});
function openLightbox(i){if(!lightboxUrls.length)return;lightboxIndex=(i+lightboxUrls.length)%lightboxUrls.length;document.getElementById('priveLightboxImg').src=lightboxUrls[lightboxIndex];document.getElementById('priveLightbox').style.display='flex';registrarMetrica('foto_abierta',{foto_numero:lightboxIndex+1})}
function moveLightbox(d){openLightbox(lightboxIndex+d)}
function closeLightbox(){document.getElementById('priveLightbox').style.display='none'}
document.getElementById('priveLbPrev').addEventListener('click',()=>moveLightbox(-1));document.getElementById('priveLbNext').addEventListener('click',()=>moveLightbox(1));document.getElementById('priveLbClose').addEventListener('click',closeLightbox);document.getElementById('priveLightbox').addEventListener('click',e=>{if(e.target.id==='priveLightbox')closeLightbox()});document.addEventListener('keydown',e=>{if(document.getElementById('priveLightbox').style.display!=='flex')return;if(e.key==='Escape')closeLightbox();if(e.key==='ArrowRight')moveLightbox(1);if(e.key==='ArrowLeft')moveLightbox(-1)});
let touchX=0;document.getElementById('priveLightbox').addEventListener('touchstart',e=>{touchX=e.changedTouches[0].screenX},{passive:true});document.getElementById('priveLightbox').addEventListener('touchend',e=>{const dx=e.changedTouches[0].screenX-touchX;if(Math.abs(dx)>40)moveLightbox(dx<0?1:-1)},{passive:true});
function listenReviews(){if(unsubscribeReviews)unsubscribeReviews();const el=document.getElementById('pCommentsContainer');el.innerHTML=`<p class="review-status">${esc(t().loading)}</p>`;
// La consulta debe filtrar aprobados: las reglas de Firestore no filtran resultados.
unsubscribeReviews=db.collection('perfiles_comentarios').doc(perfilId).collection('mensajes').where('aprobado','==',true).onSnapshot(snap=>{reviewItems=snap.docs.map(d=>({id:d.id,...d.data()}));renderReviews()},err=>{console.error('Error al cargar experiencias:',err);const e=document.getElementById('pCommentsContainer');if(e)e.innerHTML=`<p class="prive-error">No se pudieron cargar las experiencias (${esc(err.code||'error')}). Revisá las reglas de Firestore.</p>`});}
function renderReviews(){const container=document.getElementById('pCommentsContainer');if(!container)return;const L=t();container.replaceChildren();if(!reviewItems.length){container.innerHTML=`<p class="review-status">${esc(L.empty)}</p>`;return}
const items=[...reviewItems].sort((a,b)=>((b.likes||0)+(b.image?5:0))-((a.likes||0)+(a.image?5:0))||(b.fecha?.toMillis?.()||0)-(a.fecha?.toMillis?.()||0));
items.forEach(data=>{const stars=Math.max(1,Math.min(5,Number(data.rating)||5));const likes=Math.max(0,Number(data.likes)||0);const date=data.fecha?.toDate?.();const when=date?date.toLocaleString(idiomaPerfil==='es'?'es-AR':idiomaPerfil):'';const div=document.createElement('article');div.className='review-item';div.innerHTML=`<div class="review-top"><strong>${esc(data.autor||'Anónimo')}</strong><span>${'★'.repeat(stars)}${'☆'.repeat(5-stars)}</span></div><p>${esc(data.contenido)}</p>${safeUrl(data.image)?`<img src="${esc(safeUrl(data.image))}" alt="Foto adjunta" loading="lazy">`:''}<small style="color:#888">${esc(when)}</small><div class="review-actions"><button type="button" class="review-like">👍 ${esc(L.like)} (${likes})</button>${data.image?`<span style="color:#dfc285;font-size:10px">${esc(L.featured)}</span>`:''}</div>`;div.querySelector('.review-like').addEventListener('click',()=>likeReview(data.id));container.appendChild(div)})}
async function likeReview(id){const key=`priveLike:${perfilId}:${id}`;if(localStorage.getItem(key))return;const button=[...document.querySelectorAll('.review-like')].find(b=>b.closest('article')===document.activeElement?.closest('article'));if(button)button.disabled=true;try{await db.collection('perfiles_comentarios').doc(perfilId).collection('mensajes').doc(id).update({likes:firebase.firestore.FieldValue.increment(1)});localStorage.setItem(key,'1')}catch(err){console.error('Like bloqueado:',err);alert('No se pudo registrar el Me gusta. Requiere una operación segura en el servidor.')}finally{if(button)button.disabled=false}}
function compressPhoto(file){return new Promise((resolve,reject)=>{if(!file){resolve('');return}if(!['image/jpeg','image/png','image/webp'].includes(file.type)){reject(new Error('Formato de imagen no admitido'));return}if(file.size>8*1024*1024){reject(new Error('La imagen supera los 8 MB'));return}const img=new Image();const url=URL.createObjectURL(file);img.onload=()=>{try{const scale=Math.min(1,500/Math.max(img.width,img.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);const data=canvas.toDataURL('image/jpeg',.7);URL.revokeObjectURL(url);if(data.length>850000)reject(new Error('La imagen comprimida es demasiado grande'));else resolve(data)}catch(e){URL.revokeObjectURL(url);reject(e)}};img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('No se pudo leer la imagen'))};img.src=url})}
async function submitReview(){const L=t(),author=document.getElementById('pAuthor').value.trim(),content=document.getElementById('pText').value.trim(),rating=document.querySelector('input[name="rating"]:checked'),button=document.getElementById('pSubmit'),status=document.getElementById('pFormStatus');if(!author||!content||!rating){alert(L.required);return}button.disabled=true;button.textContent=L.pending;status.textContent='';try{const image=await compressPhoto(document.getElementById('pImageFile').files[0]);await db.collection('perfiles_comentarios').doc(perfilId).collection('mensajes').add({autor:author,contenido:content,rating:Number(rating.value),image,likes:0,aprobado:false,fecha:firebase.firestore.FieldValue.serverTimestamp()});document.getElementById('pAuthor').value='';document.getElementById('pText').value='';document.getElementById('pImageFile').value='';document.getElementById('pFileName').textContent='';rating.checked=false;status.textContent=L.sent;alert(L.sent)}catch(e){console.error('Error al enviar experiencia:',e);status.textContent=`${L.error} (${e.code||e.message}). Las reglas deben permitir la creación controlada de comentarios pendientes.`}finally{button.disabled=false;button.textContent=L.publish}}
async function loadProfile(){const box=document.getElementById('perfil-content-box');if(!perfilId){box.innerHTML='<p class="prive-error">Falta el ID del perfil en la dirección. Usá perfil.htm?id=nombre-del-perfil.</p>';hideTransition();return}try{const doc=await db.collection('modelos_prive').doc(perfilId).get();if(!doc.exists){box.innerHTML=`<p class="prive-error">No existe el perfil ${esc(perfilId)} en Firebase.</p>`;return}modelo=doc.data();renderProfile();listenReviews();registrarVisitaPerfil();}catch(err){console.error('Error al cargar perfil:',err);box.innerHTML=`<p class="prive-error">No se pudo cargar el perfil (${esc(err.code||err.message)}).</p>`}finally{hideTransition()}}
setLanguage(idiomaPerfil);loadProfile();
</script>
