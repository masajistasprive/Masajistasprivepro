<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="perfil-title">Perfil | Masajistas Privé</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="perfil-body">

    <!-- Header Estilo App de Lujo con Logo Grande y Selector de Idioma -->
    <header class="header-prive">
        <div class="header-left">
            <img src="img/monograma.png" alt="Monograma" class="header-monograma">
        </div>
        <div class="header-center">
            <img src="img/logo.png" alt="Masajistas Privé" class="header-logo-grande">
        </div>
        <div class="header-right" style="display: flex; align-items: center; gap: 10px;">
            <button id="btn-idioma" onclick="cambiarIdiomaPerfil()" style="background: rgba(223, 194, 133, 0.12); border: 1px solid #dfc285; color: #dfc285; padding: 7px 14px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600; font-family: 'Montserrat', sans-serif; letter-spacing: 1.5px; transition: all 0.3s; box-shadow: 0 4px 10px rgba(0,0,0,0.4);">
                🇺🇸 EN
            </button>
            <a href="index.html" class="btn-buscar">
                <span data-i18n="btnVolver">← Volver</span>
            </a>
        </div>
    </header>

    <main class="container perfil-container" id="perfil-content-box">
        <div style="text-align: center; color: #dfc285; padding: 50px 0; font-family: 'Montserrat', sans-serif;">
            Cargando perfil...
        </div>
    </main>

    <footer class="footer">
        <p data-i18n="footerLegal">Este es un sitio para adultos (+18). Las anunciantes no tienen vínculo laboral con el portal.</p>
        <p class="copyright" data-i18n="footerCopy">© 2026 Masajistas Privé. Todos los derechos reservados.</p>
    </footer>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBDSGPbs_ioH74p-RTctx9av5KKjhnDjBQ",
            authDomain: "masajistasprivepro.firebaseapp.com",
            projectId: "masajistasprivepro",
            storageBucket: "masajistasprivepro.firebasestorage.app",
            messagingSenderId: "768677270509",
            appId: "1:768677270509:web:f4409c2f9c0bbb42ebcde4",
            measurementId: "G-SBN70C32JF"
        };
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        const urlParams = new URLSearchParams(window.location.search);
        const perfilId = urlParams.get('id');

        let idiomaPerfil = localStorage.getItem('idiomaPrive') || 'es';
        let datosModeloActual = null;

        // Estructura base de etiquetas fijas por idioma
        const etiquetasIdiomas = {
            es: { btnVolver: "← Volver", badgeVerificado: "✓ Privé Verificado", labelZona: "Zona:", labelModalidad: "Modalidad:", tituloDesc: "Descripción", btnWpp: "Contactar por WhatsApp" },
            en: { btnVolver: "← Back", badgeVerificado: "✓ Privé Verified", labelZona: "Area:", labelModalidad: "Modality:", tituloDesc: "Description", btnWpp: "Contact via WhatsApp" },
            pt: { btnVolver: "← Voltar", badgeVerificado: "✓ Privé Verificado", labelZona: "Zona:", labelModalidade: "Modalidade:", tituloDesc: "Descrição", btnWpp: "Contatar por WhatsApp" },
            fr: { btnVolver: "← Retour", badgeVerificado: "✓ Privé Vérifié", labelZona: "Zone :", labelModalidad: "Modalité :", tituloDesc: "Description", btnWpp: "Contacter par WhatsApp" }
        };

        function aplicarIdiomaPerfil(lang) {
            idiomaPerfil = lang;
            localStorage.setItem('idiomaPrive', lang);

            const btn = document.getElementById('btn-idioma');
            if(btn) {
                if (lang === 'es') btn.innerHTML = '🇺🇸 EN';
                else if (lang === 'en') btn.innerHTML = '🇧🇷 PT';
                else if (lang === 'pt') btn.innerHTML = '🇫🇷 FR';
                else btn.innerHTML = '🇦🇷 ES';
            }

            if (datosModeloActual) {
                renderizarPerfil(datosModeloActual);
            }
        }

        function cambiarIdiomaPerfil() {
            if (idiomaPerfil === 'es') aplicarIdiomaPerfil('en');
            else if (idiomaPerfil === 'en') aplicarIdiomaPerfil('pt');
            else if (idiomaPerfil === 'pt') aplicarIdiomaPerfil('fr');
            else aplicarIdiomaPerfil('es');
        }

        function cargarPerfilDinamico() {
            const container = document.getElementById('perfil-content-box');

            if (!perfilId) {
                container.innerHTML = `<h2 style="color:#e74c3c; text-align:center;">Perfil no encontrado</h2><p style="text-align:center;"><a href="index.html" style="color:#dfc285;">Volver al inicio</a></p>`;
                return;
            }

            const docRef = db.collection("modelos_prive").doc(perfilId);

            const visitaKey = `visitaRegistrada_${perfilId}`;
            if (!sessionStorage.getItem(visitaKey)) {
                sessionStorage.setItem(visitaKey, "true");
                docRef.update({
                    visitas: firebase.firestore.FieldValue.increment(1)
                }).catch(err => {});
            }

            docRef.get().then((doc) => {
                if (!doc.exists) {
                    container.innerHTML = `<h2 style="color:#e74c3c; text-align:center;">El perfil solicitado no existe o fue removido.</h2><p style="text-align:center;"><a href="index.html" style="color:#dfc285;">Volver al inicio</a></p>`;
                    return;
                }

                datosModeloActual = doc.data();
                renderizarPerfil(datosModeloActual);
            }).catch(error => {
                container.innerHTML = `<p style="color:#e74c3c; text-align:center;">Error al cargar el perfil.</p>`;
            });
        }

        function renderizarPerfil(m) {
            const container = document.getElementById('perfil-content-box');
            const lang = idiomaPerfil;
            const labels = etiquetasIdiomas[lang] || etiquetasIdiomas['es'];

            // Extraer traducciones específicas de la modelo si están guardadas, o usar el español por defecto
            const traduccionesModelo = m.traducciones || {};
            const langData = traduccionesModelo[lang] || traduccionesModelo['es'] || {};

            const zonaTexto = langData.valorZona || m.zona || '';
            const modalidadTexto = langData.valorModalidad || m.modalidad || '';
            const descripcionTexto = langData.descPerfil || m.descripcion || '';
            const tecnicasTexto = langData.valorTecnicas ? `<div style="margin-top: 0.5rem; color: #94a3b8; font-size: 0.9rem;"><strong>${lang === 'en' ? 'Techniques:' : lang === 'pt' ? 'Técnicas:' : lang === 'fr' ? 'Techniques :' : 'Técnicas de masaje:'}</strong> ${langData.valorTecnicas}</div>` : '';

            const ocultarWpp = m.estado === 'pausado' ? 'display: none;' : '';

            let miniaturasHTML = '';
            if (m.fotosGaleria && m.fotosGaleria.length > 0) {
                m.fotosGaleria.forEach(fotoUrl => {
                    miniaturasHTML += `<img src="${fotoUrl}" alt="${m.nombre}" onclick="cambiarFoto(this)">`;
                });
            } else {
                miniaturasHTML = `<img src="${m.fotoPrincipal}" alt="${m.nombre}" onclick="cambiarFoto(this)">`;
            }

            container.innerHTML = `
                <!-- Galería de Fotos -->
                <div class="perfil-galeria-grid">
                    <img src="${m.fotoPrincipal}" alt="${m.nombre}" class="foto-principal" id="fotoPrincipal">
                    <div class="galeria-miniaturas">
                        ${miniaturasHTML}
                    </div>
                </div>

                <!-- Información de la Modelo -->
                <div class="perfil-info">
                    <div class="perfil-titulo-seccion">
                        <h2>${m.nombre}</h2>
                        <span class="badge-verificado">${labels.badgeVerificado}</span>
                    </div>

                    <p class="perfil-ubicacion">📍 ${labels.labelZona} <strong>${zonaTexto}</strong></p>
                    <p class="perfil-modalidad">🏠 ${labels.labelModalidad} <strong>${modalidadTexto}</strong></p>

                    <div class="perfil-descripcion">
                        <h3>${labels.tituloDesc}</h3>
                        <p>${descripcionTexto}</p>
                        ${tecnicasTexto}
                    </div>

                    <a href="${m.whatsappLink || 'https://wa.me/' + m.whatsapp}" target="_blank" rel="noopener noreferrer" class="btn-whatsapp" style="${ocultarWpp}">
                        💬 <span>${labels.btnWpp}</span>
                    </a>
                </div>

                <!-- Casilla de Comentarios / Experiencias -->
                <div id="seccion-comentarios"></div>
            `;

            document.getElementById('perfil-title').textContent = `${m.nombre} | Masajistas Privé`;
        }

        function cambiarFoto(element) {
            const fotoPrincipal = document.getElementById('fotoPrincipal');
            if (fotoPrincipal) {
                fotoPrincipal.src = element.src;
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            aplicarIdiomaPerfil(idiomaPerfil);
            cargarPerfilDinamico();
        });
    </script>
    <script src="comentarios.js"></script>

</body>
</html>
