                return;

                    container.innerHTML = `<h2 style="color:#e74c3c; text-align:center;">El perfil solicitado no existe o fue removido.</h2>`;

            const svgCompartir = `<svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92c0-1.61-1.31-2.92-2.92-2.92zM18 4c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zM6 13c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm12 7c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1z"/></svg>`;

            const contenedorWpp = document.getElementById('contenedorWppFlotante');
            if (m.estado !== 'pausado') {
                contenedorWpp.innerHTML = `
                    <a href="${wppLinkFinal}" target="_blank" rel="noopener noreferrer" class="btn-whatsapp-flotante" title="Contactar por WhatsApp">
                        ${svgWpp}
                        <span>${labels.btnWppFlotante}</span>
                    </a>
                `;
            } else {
                contenedorWpp.innerHTML = "";
            }

            const favoritosGuardados = JSON.parse(localStorage.getItem('priveFavoritos') || '[]');
            const esFavorito = favoritosGuardados.includes(perfilId);
            const claseFavActivo = esFavorito ? 'activo' : '';
            const textoFavFinal = esFavorito ? "❤️ Favorito Guardado" : `❤️ ${labels.btnFav}`;

            let miniaturasHTML = '';
            if (m.fotosGaleria && m.fotosGaleria.length > 0) {
                m.fotosGaleria.forEach(fotoUrl => {
                    miniaturasHTML += `<img src="${fotoUrl}" alt="${m.nombre}" onclick="cambiarFoto(this)">`;
                });
            } else {
                miniaturasHTML = `<img src="${m.fotoPrincipal}" alt="${m.nombre}" onclick="cambiarFoto(this)">`;
            }

            let videoHtml = '';
            if (m.videoPresentacion) {
                videoHtml = `
                    <div class="perfil-descripcion" style="margin-top: 20px;">
                        <h3>🎥 ${labels.tituloVideo}</h3>
                        <video controls controlslist="nodownload" style="width: 100%; max-height: 350px; border-radius: 8px; border: 1px solid rgba(223,194,133,0.3); background: #000; object-fit: cover;">
                            <source src="${m.videoPresentacion}" type="video/mp4">
                            Tu navegador no soporta videos.
                        </video>
                    </div>
                `;
            }

            let detallesHtml = '';
            if (horariosTexto) detallesHtml += `<div class="detalle-item"><span>${labels.labelHorarios}</span> <span>${horariosTexto}</span></div>`;
            if (equipamientoTexto) detallesHtml += `<div class="detalle-item"><span>${labels.labelEquipamiento}</span> <span>${equipamientoTexto}</span></div>`;
            if (pagosTexto) detallesHtml += `<div class="detalle-item"><span>${labels.labelPagos}</span> <span>${pagosTexto}</span></div>`;
            if (turnosTexto) detallesHtml += `<div class="detalle-item"><span>${labels.labelTurnos}</span> <span>${turnosTexto}</span></div>`;

            let tecnicasHtml = tecnicasTexto ? `<div style="margin-top: 0.5rem; color: #94a3b8; font-size: 0.9rem;"><strong>${labels.labelTecnicas}</strong> <span>${tecnicasTexto}</span></div>` : '';

            container.innerHTML = `
                <!-- Galería de Fotos -->
                <div class="perfil-galeria-grid">
                    <img src="${m.fotoPrincipal}" alt="${m.nombre}" class="foto-principal" id="fotoPrincipal">
                    <div class="galeria-miniaturas">
                        ${miniaturasHTML}
                    </div>
                </div>

                <!-- Información de la Modelo -->
                <div class="perfil-info">
                    <div class="perfil-titulo-seccion">
                        <h2>${m.nombre}</h2>
                        <span class="badge-verificado">${labels.badgeVerificado}</span>
                    </div>

                    <p class="perfil-ubicacion">📍 ${labels.labelZona} <strong>${zonaTexto}</strong></p>
                    <p class="perfil-modalidad">🏠 ${labels.labelModalidad} <strong>${modalidadTexto}</strong></p>

                    <div class="perfil-descripcion">
                        <h3>${labels.tituloDesc}</h3>
                        <p style="white-space: pre-line;">${descripcionTexto}</p>
                        ${tecnicasHtml}
                    </div>

                    ${videoHtml}

                    ${detallesHtml ? `<div class="perfil-detalles">${detallesHtml}</div>` : ''}

                    <!-- BOTONES DE ACCIÓN AL PIE DE LA DESCRIPCIÓN -->
                    <div class="perfil-acciones-inferior" style="${ocultarWpp}">
                        <a href="${wppLinkFinal}" target="_blank" rel="noopener noreferrer" class="btn-accion-prive btn-accion-wpp">
                            ${svgWpp}
                            <span>${labels.btnWppPie}</span>
                        </a>
                        <div class="btn-accion-secundarios">
                            <button onclick="window.toggleFavoritoPerfil('${perfilId}')" id="btnFavElement" class="btn-accion-prive btn-accion-fav ${claseFavActivo}">
                                ${textoFavFinal}
                            </button>
                            <button onclick="window.compartirPerfilActual('${m.nombre}')" class="btn-accion-prive btn-accion-compartir">
                                ${svgCompartir}
                                <span>${labels.btnCompartir}</span>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- SECCIÓN DE COMENTARIOS INTEGRADA AL PIE -->
                <div style="grid-column: 1 / -1; width: 100%; box-sizing: border-box; margin-top: 40px; padding: 25px 20px; background: #141414; border: 1px solid rgba(223, 194, 133, 0.25); border-radius: 10px; font-family: 'Montserrat', sans-serif; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
                    <h3 style="color: #dfc285; text-align: center; font-size: 22px; margin-bottom: 20px; font-family: 'Cormorant Garamond', serif; letter-spacing: 1.5px;">${labels.tituloSeccionComentarios}</h3>
                    
                    <div style="display: flex; flex-direction: column; gap: 12px; width: 100%; box-sizing: border-box;">
                        <div style="display: flex; align-items: center; justify-content: space-between; background: #1a1a1a; padding: 10px 15px; border-radius: 6px; border: 1px solid rgba(223, 194, 133, 0.3);">
                            <span style="font-size: 13px; color: #dfc285; font-weight: 500;">${labels.labelEstrellas}</span>
                            <div class="star-rating">
                                <input type="radio" id="star5" name="rating" value="5" /><label for="star5" title="5 estrellas">★</label>
                                <input type="radio" id="star4" name="rating" value="4" /><label for="star4" title="4 estrellas">★</label>
                                <input type="radio" id="star3" name="rating" value="3" /><label for="star3" title="3 estrellas">★</label>
                                <input type="radio" id="star2" name="rating" value="2" /><label for="star2" title="2 estrella">★</label>
                                <input type="radio" id="star1" name="rating" value="1" /><label for="star1" title="1 estrella">★</label>
                            </div>
                        </div>

                        <input type="text" id="pAuthor" placeholder="${labels.placeholderNombre}" style="width: 100% !important; padding: 12px 15px; box-sizing: border-box !important; border: 1px solid rgba(223, 194, 133, 0.3); background: #1a1a1a !important; color: #fff !important; border-radius: 6px; font-family: 'Montserrat', sans-serif; font-size: 14px;">
                        
                        <textarea id="pText" rows="3" placeholder="${labels.placeholderTexto}" style="width: 100% !important; padding: 12px 15px; box-sizing: border-box !important; border: 1px solid rgba(223, 194, 133, 0.3); background: #1a1a1a !important; color: #fff !important; border-radius: 6px; font-family: 'Montserrat', sans-serif; font-size: 14px; resize: vertical;"></textarea>
                        
                        <div style="display: flex; gap: 8px; align-items: center; background: #1a1a1a; padding: 10px 12px; border-radius: 6px; border: 1px solid rgba(223, 194, 133, 0.3); flex-wrap: wrap; width: 100%; box-sizing: border-box;">
                            <button type="button" onclick="window.agregarEmojiPerfil('😊')" style="background:none; border:none; font-size:1.2em; cursor:pointer; padding:2px;">😊</button>
                            <button type="button" onclick="window.agregarEmojiPerfil('👍')" style="background:none; border:none; font-size:1.2em; cursor:pointer; padding:2px;">👍</button>
                            <button type="button" onclick="window.agregarEmojiPerfil('🔥')" style="background:none; border:none; font-size:1.2em; cursor:pointer; padding:2px;">🔥</button>
                            <button type="button" onclick="window.agregarEmojiPerfil('❤️')" style="background:none; border:none; font-size:1.2em; cursor:pointer; padding:2px;">❤️</button>
                            <button type="button" onclick="window.agregarEmojiPerfil('⭐')" style="background:none; border:none; font-size:1.2em; cursor:pointer; padding:2px;">⭐</button>
                            
                            <label title="Adjuntar foto" style="color: #dfc285; cursor: pointer; font-size: 16px; display: inline-flex; align-items: center; justify-content: center; background: rgba(223,194,133,0.1); width: 34px; height: 34px; border-radius: 50%; border: 1px solid rgba(223, 194, 133, 0.4); margin-left: auto;">
                                📎 <input type="file" id="pImageFile" accept="image/*" onchange="window.previewPerfilFile()" style="display:none;">
                            </label>
                        </div>
                        <span id="pFileName" style="font-size: 11px; color: #dfc285; font-style: italic;"></span>

                        <button onclick="window.enviarComentarioPerfil()" style="background: linear-gradient(135deg, #dfc285, #c5a059); color: #0d0d0d; border: none; padding: 14px; cursor: pointer; border-radius: 6px; font-weight: 600; width: 100% !important; font-size: 12px; text-transform: uppercase; letter-spacing: 2px; font-family: 'Montserrat', sans-serif; box-shadow: 0 4px 15px rgba(223,194,133,0.25);">${labels.btnPublicar}</button>
                    </div>

                    <div id="pCommentsContainer" style="margin-top: 25px; width: 100%; box-sizing: border-box;">
                        <p style="text-align: center; color: #888; font-size: 13px; font-style: italic;">${labels.cargandoComentarios}</p>
                    </div>

                    <div style="text-align: center; margin-top: 35px; font-size: 11px;">
                        <span onclick="window.activarAdminPerfil()" style="cursor: pointer; color: #555; text-transform: uppercase; letter-spacing: 1px;">Admin</span>
                    </div>
                </div>
            `;

            document.getElementById('perfil-title').textContent = `${m.nombre} | Masajistas Privé`;
            setTimeout(inicializarVisorFotosDinamico, 300);
        }

        function cambiarFoto(element) {
            const fotoPrincipal = document.getElementById('fotoPrincipal');
            if (fotoPrincipal) fotoPrincipal.src = element.src;
        }

        function inicializarVisorFotosDinamico() {
            const lightbox = document.getElementById('priveLightbox');
            if (!lightbox) return;

            const miniaturas = document.querySelectorAll('.galeria-miniaturas img, .perfil-galeria-grid img');
            let listaUrlsFotos = [];
            miniaturas.forEach(img => {
                if (img.src && !listaUrlsFotos.includes(img.src)) {
                    listaUrlsFotos.push(img.src);
                }
            });

            if (listaUrlsFotos.length === 0) {
                const fotoPrin = document.getElementById('fotoPrincipal');
                if (fotoPrin) listaUrlsFotos.push(fotoPrin.src);
            }

            let indiceLightboxActual = 0;

            function actualizarImagenLightbox(index) {
                if (listaUrlsFotos.length === 0) return;
                if (index < 0) index = listaUrlsFotos.length - 1;
                if (index >= listaUrlsFotos.length) index = 0;
                indiceLightboxActual = index;
                
                const lbImg = document.getElementById('priveLightboxImg');
                if (lbImg) {
                    lbImg.style.opacity = '0.3';
                    setTimeout(() => {
                        lbImg.src = listaUrlsFotos[indiceLightboxActual];
                        lbImg.style.opacity = '1';
                    }, 100);
                }
            }

            const btnPrev = document.getElementById('priveLbPrev');
            const btnNext = document.getElementById('priveLbNext');
            const btnClose = document.getElementById('priveLbClose');

            if(btnPrev) btnPrev.onclick = (e) => { e.stopPropagation(); actualizarImagenLightbox(indiceLightboxActual - 1); };
            if(btnNext) btnNext.onclick = (e) => { e.stopPropagation(); actualizarImagenLightbox(indiceLightboxActual + 1); };
            if(btnClose) btnClose.onclick = () => { lightbox.style.display = 'none'; };
            lightbox.onclick = (e) => { if (e.target.id === 'priveLightbox') lightbox.style.display = 'none'; };

            let touchStartX = 0;
            lightbox.ontouchstart = (e) => { touchStartX = e.changedTouches[0].screenX; };
            lightbox.ontouchend = (e) => {
                let touchEndX = e.changedTouches[0].screenX;
                if (touchEndX < touchStartX - 40) {
                    actualizarImagenLightbox(indiceLightboxActual + 1);
                } else if (touchEndX > touchStartX + 40) {
                    actualizarImagenLightbox(indiceLightboxActual - 1);
                }
            };

            const fotosConVisor = document.querySelectorAll('.perfil-galeria-grid .foto-principal, img#fotoPrincipal, .galeria-miniaturas img');
            fotosConVisor.forEach(img => {
                img.style.cursor = 'zoom-in';
                if (!img.getAttribute('data-visor-vinculado')) {
                    img.setAttribute('data-visor-vinculado', 'true');
                    img.onclick = function(e) {
                        e.preventDefault();
                        e.stopPropagation();
                        const urlActual = this.src;
                        let idxEncontrado = listaUrlsFotos.indexOf(urlActual);
                        indiceLightboxActual = idxEncontrado !== -1 ? idxEncontrado : 0;
                        
                        actualizarImagenLightbox(indiceLightboxActual);
                        lightbox.style.display = 'flex';
                    };
                }
            });
        }

        function inicializarLogicaComentarios() {
            let isAdminPerfil = sessionStorage.getItem("priveAdmin") === "true";

            window.activarAdminPerfil = function() {
                const pass = prompt("Contraseña de administrador:");
                if (pass === "prive2026") {
                    isAdminPerfil = true;
                    sessionStorage.setItem("priveAdmin", "true");
                    alert("Modo administrador activado.");
                    location.reload();
                } else if (pass !== null) {
                    alert("Contraseña incorrecta.");
                }
            };

            window.agregarEmojiPerfil = function(emoji) {
                const txt = document.getElementById('pText');
                if(txt) { txt.value += emoji; txt.focus(); }
            };

            window.previewPerfilFile = function() {
                const input = document.getElementById('pImageFile');
                const span = document.getElementById('pFileName');
                if (input && input.files && input.files[0]) {
                    span.textContent = "✓ Archivo adjunto: " + input.files[0].name;
                } else if(span) {
                    span.textContent = "";
                }
            };

            function comprimirImagenPerfil(callback) {
                const input = document.getElementById('pImageFile');
                if (!input || !input.files || !input.files[0]) {
                    callback(null);
                    return;
                }
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        let w = img.width, h = img.height;
                        const max = 500;
                        if (w > h && w > max) { h *= max / w; w = max; }
                        else if (h > max) { w *= max / h; h = max; }
                        canvas.width = w; canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);
                        callback(canvas.toDataURL('image/jpeg', 0.7));
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(input.files[0]);
            }

            db.collection("perfiles_comentarios").doc(perfilId).collection("mensajes").onSnapshot((snapshot) => {
                const container = document.getElementById('pCommentsContainer');
                if (!container) return;
                container.innerHTML = "";

                if (snapshot.empty) {
                    container.innerHTML = `<p style='color: #777; font-size: 13px; text-align: center; font-style: italic;'>No hay experiencias aún. ¡Sé el primeiro en dejar una!</p>`;
                    return;
                }

                let lista = [];
                snapshot.forEach(doc => lista.push({ id: doc.id, ...doc.data() }));
                
                lista.sort((a, b) => {
                    const scoreA = (a.likes || 0) + (a.image ? 5 : 0);
                    const scoreB = (b.likes || 0) + (b.image ? 5 : 0);
                    if (scoreB !== scoreA) return scoreB - scoreA;
                    return (b.fecha?.toMillis() || 0) - (a.fecha?.toMillis() || 0);
                });

                lista.forEach(data => {
                    const fechaStr = data.fecha ? new Date(data.fecha.toDate()).toLocaleString() : 'Hace un momento';
                    const likes = data.likes || 0;
                    const numEstrellas = data.rating || 5;
                    const estrellasHtml = '★'.repeat(numEstrellas) + '☆'.repeat(5 - numEstrellas);

                    const imgHtml = data.image ? `<img src="${data.image}" style="max-width: 100%; max-height: 180px; border-radius: 6px; margin-top: 10px; display: block; object-fit: cover; border: 1px solid rgba(223,194,133,0.4);" alt="Adjunto">` : '';
                    const deleteBtn = isAdminPerfil ? `<button onclick="window.borrarComentarioPerfil('${data.id}')" style="background:none; border:none; color:#ff5555; cursor:pointer; font-size:11px; font-weight:bold; float:right; text-transform: uppercase;">Eliminar</button>` : '';

                    const div = document.createElement('div');
                    div.style.cssText = "font-size: 13px; margin-bottom: 15px; color: #ccc; word-break: break-word; background: #1a1a1a; padding: 15px; border-radius: 6px; position: relative; border-left: 3px solid #dfc285; border: 1px solid rgba(223,194,133,0.15); width: 100%; box-sizing: border-box;";
                    div.innerHTML = `
                        ${deleteBtn}
                        <div>
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                                <span style="color: #dfc285; font-weight: bold; margin-right: 6px;">${escapeHtmlPerfil(data.autor)}:</span>
                                <span style="color: #dfc285; font-size: 14px; letter-spacing: 2px;">${estrellasHtml}</span>
                            </div>
                            <span style="color: #e5e0d8; line-height: 1.5; display: block; margin-top: 4px;">${escapeHtmlPerfil(data.contenido)}</span>
                            ${imgHtml}
                            <span style="font-size: 11px; color: #777; margin-left: 2px; display: block; margin-top: 8px;">${fechaStr}</span>
                        </div>
                        <div style="margin-top: 12px; border-top: 1px solid rgba(255,255,255,0.06); padding-top: 8px; display: flex; align-items: center; justify-content: space-between;">
                            <button onclick="window.darLikePerfil('${data.id}', ${likes})" style="background:none; border:none; color:#dfc285; cursor:pointer; font-size:12px; font-weight:600; display:flex; align-items:center; gap:5px;">👍 Me gusta (<span id="plikes-${data.id}">${likes}</span>)</button>
                            ${data.image ? `<span style="font-size: 10px; color: #dfc285; background: rgba(223,194,133,0.1); padding: 3px 8px; border-radius: 4px; border: 1px solid rgba(223,194,133,0.3); text-transform: uppercase;">★ Destacado</span>` : ''}
                        </div>
                    `;
                    container.appendChild(div);
                });
            });

            window.enviarComentarioPerfil = function() {
                const autor = document.getElementById('pAuthor').value.trim();
                const contenido = document.getElementById('pText').value.trim();
                const ratingSeleccionado = document.querySelector('input[name="rating"]:checked');

                if (!autor || !contenido || !ratingSeleccionado) {
                    alert("Por favor completá tu nombre, elegí una calificación y escribí tu experiencia.");
                    return;
                }

                comprimirImagenPerfil((base64) => {
                    db.collection("perfiles_comentarios").doc(perfilId).collection("mensajes").add({
                        autor: autor,
                        contenido: contenido,
                        rating: parseInt(ratingSeleccionado.value),
                        image: base64 || "",
                        likes: 0,
                        fecha: firebase.firestore.FieldValue.serverTimestamp()
                    }).then(() => {
                        document.getElementById('pAuthor').value = '';
                        document.getElementById('pText').value = '';
                        document.getElementById('pImageFile').value = '';
                        document.getElementById('pFileName').textContent = '';
                        document.querySelectorAll('input[name="rating"]').forEach(r => r.checked = false);
                    });
                });
            };

            window.darLikePerfil = function(msgId, currentLikes) {
                db.collection("perfiles_comentarios").doc(perfilId).collection("mensajes").doc(msgId).update({
                    likes: currentLikes + 1
                });
            };

            window.borrarComentarioPerfil = function(msgId) {
                if (confirm("¿Estás seguro de eliminar este comentario?")) {
                    db.collection("perfiles_comentarios").doc(perfilId).collection("mensajes").doc(msgId).delete();
                }
            };

            function escapeHtmlPerfil(text) {
                if (!text) return '';
                return text.replace(/[&<>"']/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#039;' }[m]));
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            aplicarIdiomaPerfil(idiomaPerfil);
            cargarPerfilDinamico();
        });
    </script>

</body>
