/* EXPERIENCIAS APROBADAS */

function escucharExperiencias() {
  if (unsubscribeReviews) unsubscribeReviews();

  const contenedor = document.getElementById("pCommentsContainer");
  contenedor.innerHTML =
    `<p class="review-status">${esc(T().cargando)}</p>`;

  unsubscribeReviews = db
    .collection("perfiles_comentarios")
    .doc(perfilId)
    .collection("mensajes")
    .where("aprobado","==",true)
    .onSnapshot(snapshot => {
      reviewItems = snapshot.docs.map(doc => ({
        id:doc.id,
        ...doc.data()
      }));
      mostrarExperiencias();
    }, error => {
      console.error("Error experiencias:",error);

      const el = document.getElementById("pCommentsContainer");
      if (el) {
        el.innerHTML =
          `<p class="prive-error">
            No se pudieron cargar las experiencias.
            (${esc(error.code || "error")})
          </p>`;
      }
    });
}

function mostrarExperiencias() {
  const contenedor = document.getElementById("pCommentsContainer");
  if (!contenedor) return;

  const L = T();
  contenedor.replaceChildren();

  if (!reviewItems.length) {
    contenedor.innerHTML =
      `<p class="review-status">${esc(L.vacio)}</p>`;
    return;
  }

  const lista = [...reviewItems].sort((a,b) => {
    const scoreA = (a.likes||0)+(a.image?5:0);
    const scoreB = (b.likes||0)+(b.image?5:0);

    if (scoreB!==scoreA) return scoreB-scoreA;

    return (b.fecha?.toMillis?.()||0)-
           (a.fecha?.toMillis?.()||0);
  });

  lista.forEach(data => {
    const rating = Math.max(1,Math.min(5,Number(data.rating)||5));
    const likes = Math.max(0,Number(data.likes)||0);
    const fecha = data.fecha?.toDate?.();
    const fechaTexto = fecha ?
      fecha.toLocaleString("es-AR") : "";

    const foto = safeUrl(data.image);

    const div = document.createElement("article");
    div.className = "review-item";

    div.innerHTML = `
      <div class="review-top">
        <strong>${esc(data.autor || "Anónimo")}</strong>
        <span>
          ${"★".repeat(rating)}${"☆".repeat(5-rating)}
        </span>
      </div>

      <p>${esc(data.contenido)}</p>

      ${foto ? `
        <img src="${esc(foto)}"
             alt="Fotografía adjunta"
             loading="lazy">` : ""}

      <small style="color:#888">
        ${esc(fechaTexto)}
      </small>

      <div class="review-actions">
        <button type="button" class="review-like">
          👍 ${esc(L.gusta)} (${likes})
        </button>

        ${foto ? `<span style="color:#dfc285;font-size:10px">★ Destacado</span>` : ""}
      </div>
    `;

    div.querySelector(".review-like").onclick =
      () => darLike(data.id);

    contenedor.appendChild(div);
  });
}

/* LIKES: REQUIEREN PERMISOS SEGUROS */

async function darLike(id) {
  const clave = `priveLike:${perfilId}:${id}`;

  if (localStorage.getItem(clave)) {
    alert("Ya registraste tu Me gusta.");
    return;
  }

  try {
    await db.collection("perfiles_comentarios")
      .doc(perfilId)
      .collection("mensajes")
      .doc(id)
      .update({
        likes:firebase.firestore.FieldValue.increment(1)
      });

    localStorage.setItem(clave,"1");
  } catch(error) {
    console.error("Error like:",error);
    alert("No se pudo registrar el Me gusta. Falta configurar el permiso seguro.");
  }
}

/* COMPRESIÓN DE FOTOGRAFÍAS */

function comprimirImagen(file) {
  return new Promise((resolve,reject) => {
    if (!file) return resolve("");

    if (!["image/jpeg","image/png","image/webp"].includes(file.type)) {
      return reject(new Error("Formato de imagen no admitido"));
    }

    if (file.size > 8*1024*1024) {
      return reject(new Error("La imagen supera los 8 MB"));
    }

    const imagen = new Image();
    const url = URL.createObjectURL(file);

    imagen.onload = () => {
      try {
        const escala = Math.min(
          1,500/Math.max(imagen.width,imagen.height)
        );

        const canvas = document.createElement("canvas");
        canvas.width = Math.max(1,Math.round(imagen.width*escala));
        canvas.height = Math.max(1,Math.round(imagen.height*escala));

        canvas.getContext("2d").drawImage(
          imagen,0,0,canvas.width,canvas.height
        );

        const resultado = canvas.toDataURL("image/jpeg",.7);
        URL.revokeObjectURL(url);

        if (resultado.length > 850000) {
          reject(new Error("La fotografía comprimida es demasiado grande"));
        } else {
          resolve(resultado);
        }
      } catch(error) {
        URL.revokeObjectURL(url);
        reject(error);
      }
    };

    imagen.onerror = () => {
      URL.revokeObjectURL(url);
      reject(new Error("No se pudo procesar la imagen"));
    };

    imagen.src = url;
  });
}

/* ENVIAR EXPERIENCIAS A MODERACIÓN */

async function enviarExperiencia() {
  const autor = document.getElementById("pAuthor").value.trim();
  const contenido = document.getElementById("pText").value.trim();
  const rating = document.querySelector('input[name="rating"]:checked');

  const boton = document.getElementById("pSubmit");
  const estado = document.getElementById("pFormStatus");

  if (!autor || !contenido || !rating) {
    alert("Completá tu nombre, elegí estrellas y escribí tu experiencia.");
    return;
  }

  boton.disabled = true;
  boton.textContent = "Enviando...";
  estado.textContent = "";

  try {
    const archivo = document.getElementById("pImageFile").files[0];
    const imagen = await comprimirImagen(archivo);

    await db.collection("perfiles_comentarios")
      .doc(perfilId)
      .collection("mensajes")
      .add({
        autor:autor,
        contenido:contenido,
        rating:Number(rating.value),
        image:imagen,
        likes:0,
        aprobado:false,
        fecha:firebase.firestore.FieldValue.serverTimestamp()
      });

    document.getElementById("pAuthor").value = "";
    document.getElementById("pText").value = "";
    document.getElementById("pImageFile").value = "";
    document.getElementById("pFileName").textContent = "";
    rating.checked = false;

    estado.textContent = T().enviado;
    alert(T().enviado);

  } catch(error) {
    console.error("Error enviando experiencia:",error);
    estado.textContent =
      "No se pudo enviar la experiencia: "+
      (error.code || error.message);
  } finally {
    boton.disabled = false;
    boton.textContent = T().publicar;
  }
}
