let priveAuthPromise=null;
function priveUsuario(){
 if(priveAuthPromise)return priveAuthPromise;
 priveAuthPromise=(async()=>{
  if(!firebase.auth)throw new Error('Firebase Auth no cargó');
  const auth=firebase.auth();
  if(auth.currentUser)return auth.currentUser;
  return (await auth.signInAnonymously()).user;
 })().catch(e=>{priveAuthPromise=null;throw e});

function priveRutaVotos(id){return db.collection('votos_perfiles').doc(id).collection('usuarios')}
function privePintarVotos(id){
 const total=priveVotos.cuentas.get(id)||0,activo=priveVotos.propios.get(id)===true;
 document.querySelectorAll('[data-prive-voto="'+CSS.escape(id)+'"]').forEach(b=>{
  const n=b.querySelector('[data-prive-cuenta]'),cantidad=total?String(total):'';
  if(n&&n.textContent!==cantidad)n.textContent=cantidad;
  b.classList.toggle('prive-votado',activo);
  if(b.getAttribute('aria-pressed')!==String(activo))b.setAttribute('aria-pressed',String(activo));
  const ocupado=priveVotos.ocupados.has(id);if(b.disabled!==ocupado)b.disabled=ocupado;
 });
}
function priveEscucharVotos(id){
 window.priveVotosVisibles.registrar('perfil:'+id,'data-prive-voto',id,()=>{
  let vigente=true,ultimo=null,usuario=null;
  const pintar=()=>{if(!vigente||!ultimo)return;priveVotos.cuentas.set(id,ultimo.size);if(usuario)priveVotos.propios.set(id,ultimo.docs.some(d=>d.id===usuario.uid));privePintarVotos(id);};
  const stop=priveRutaVotos(id).onSnapshot(snap=>{ultimo=snap;pintar();},err=>console.warn('No se pudieron leer los votos:',id,err.code||err.message));
  priveUsuario().then(u=>{usuario=u;pintar();}).catch(err=>console.warn('No se pudo consultar tu voto:',err.code||err.message));
  return ()=>{vigente=false;ultimo=null;stop();};
 },()=>privePintarVotos(id));
}
async function priveAlternarVoto(id){
 if(priveVotos.ocupados.has(id))return;
 priveVotos.ocupados.add(id);privePintarVotos(id);
 try{
  const u=await priveUsuario(),ref=priveRutaVotos(id).doc(u.uid);
  // Revalidar en servidor antes de modificar, incluso con varias pestañas.
  const anterior=await ref.get({source:'server'});
  if(anterior.exists)await ref.delete();
  else await ref.set({usuarioId:u.uid,perfilId:id,creado:firebase.firestore.FieldValue.serverTimestamp()});
  priveVotos.propios.set(id,!anterior.exists);
 }catch(err){console.error('No se pudo votar:',err);alert('No pudimos guardar tu Me gusta. Revisá la conexión e intentá nuevamente.');}
 finally{priveVotos.ocupados.delete(id);privePintarVotos(id)}
}

function openLightbox(i){if(!lightboxUrls.length)return;lightboxIndex=(i+lightboxUrls.length)%lightboxUrls.length;document.getElementById('priveLightboxImg').src=lightboxUrls[lightboxIndex];document.getElementById('privePhotoCount').textContent=`${lightboxIndex+1} / ${lightboxUrls.length}`;document.getElementById('priveLightbox').style.display='flex';registrarMetrica('foto_abierta',{foto_numero:lightboxIndex+1})}
function moveLightbox(d){openLightbox(lightboxIndex+d)}
function closeLightbox(){document.getElementById('priveLightbox').style.display='none'}
document.getElementById('priveLbPrev').addEventListener('click',()=>moveLightbox(-1));document.getElementById('priveLbNext').addEventListener('click',()=>moveLightbox(1));document.getElementById('priveLbClose').addEventListener('click',closeLightbox);document.getElementById('priveLightbox').addEventListener('click',e=>{if(e.target.id==='priveLightbox')closeLightbox()});document.addEventListener('keydown',e=>{if(document.getElementById('priveLightbox').style.display!=='flex')return;if(e.key==='Escape')closeLightbox();if(e.key==='ArrowRight')moveLightbox(1);if(e.key==='ArrowLeft')moveLightbox(-1)});
let touchX=0;document.getElementById('priveLightbox').addEventListener('touchstart',e=>{touchX=e.changedTouches[0].screenX},{passive:true});document.getElementById('priveLightbox').addEventListener('touchend',e=>{const dx=e.changedTouches[0].screenX-touchX;if(Math.abs(dx)>40)moveLightbox(dx<0?1:-1)},{passive:true});
function listenReviews(){
 window.priveVotosVisibles.registrar('reviews:'+perfilId,'data-prive-reviews',perfilId,()=>{
  let vigente=true;reviewLoadError=null;renderReviews();
  // Consultar solo comentarios aprobados cuando la sección se acerca a la vista.
  const stop=db.collection('perfiles_comentarios').doc(perfilId).collection('mensajes').where('aprobado','==',true).onSnapshot(snap=>{
   if(!vigente)return;
   reviewItems=snap.docs.map(d=>({id:d.id,...d.data()}));reviewsLoaded=true;reviewLoadError=null;renderReviews();
  },err=>{if(!vigente)return;console.error('Error al cargar experiencias:',err);reviewLoadError=err;renderReviews()});
  const cleanup=()=>{vigente=false;stop();if(unsubscribeReviews===cleanup)unsubscribeReviews=null;};
  unsubscribeReviews=cleanup;return cleanup;
 },()=>renderReviews());
}
function renderReviews(){const container=document.getElementById('pCommentsContainer');if(!container)return;const L=t();container.replaceChildren();if(reviewLoadError){container.innerHTML=`<p class="prive-error">No se pudieron cargar las experiencias (${esc(reviewLoadError.code||'error')}). Revisá las reglas de Firestore.</p>`;return}if(!reviewsLoaded){container.innerHTML=`<p class="review-status">${esc(L.loading)}</p>`;return}if(!reviewItems.length){container.innerHTML=`<p class="review-status">${esc(L.empty)}</p>`;return}
const ids=new Set(reviewItems.map(r=>r.id));for(const id of priveReviewCounts.keys())if(!ids.has(id)){priveReviewCounts.delete(id);priveReviewMine.delete(id)}
const items=[...reviewItems].sort((a,b)=>((b.likes||0)+(b.image?5:0))-((a.likes||0)+(a.image?5:0))||(b.fecha?.toMillis?.()||0)-(a.fecha?.toMillis?.()||0));
items.forEach(data=>{const stars=Math.max(1,Math.min(5,Number(data.rating)||5));const likes=Math.max(0,Number(data.likes)||0);const date=data.fecha?.toDate?.();const when=date?date.toLocaleString(idiomaPerfil==='es'?'es-AR':idiomaPerfil):'';const div=document.createElement('article');div.className='review-item';div.innerHTML=`<div class="review-top"><strong>${esc(data.autor||'Anónimo')}</strong><span>${'★'.repeat(stars)}${'☆'.repeat(5-stars)}</span></div><p>${esc(data.contenido)}</p>${safeUrl(data.image)?`<img src="${esc(safeUrl(data.image))}" alt="" loading="lazy" class="review-photo">`:''}<small style="color:#888">${esc(when)}</small><div class="review-actions"><button type="button" class="review-like" data-review-id="${esc(data.id)}" aria-pressed="false">👍 ${esc(L.like)}</button>${data.image?`<span style="color:#dfc285;font-size:10px">${esc(L.featured)}</span>`:''}</div>`;div.querySelector('.review-like').addEventListener('click',()=>likeReview(data.id));priveEscucharReviewLikes(data.id);privePintarReviewLike(data.id);const reviewPhoto=div.querySelector('.review-photo');if(reviewPhoto){reviewPhoto.addEventListener('error',()=>reviewPhoto.remove());if(reviewPhoto.complete&&reviewPhoto.naturalWidth===0)reviewPhoto.remove()}container.appendChild(div)});
if(items.length>2){container.classList.add('prive-reviews-list','is-collapsed');const b=document.createElement('button');b.type='button';b.className='prive-reviews-more';b.textContent=({es:'Ver todas las experiencias',en:'See all reviews',pt:'Ver todas as avaliações',fr:'Voir tous les avis'})[idiomaPerfil];b.addEventListener('click',()=>{const closed=container.classList.toggle('is-collapsed');b.textContent=closed?({es:'Ver todas las experiencias',en:'See all reviews',pt:'Ver todas as avaliações',fr:'Voir tous les avis'})[idiomaPerfil]:({es:'Mostrar menos',en:'Show less',pt:'Mostrar menos',fr:'Afficher moins'})[idiomaPerfil];});container.appendChild(b)}else container.classList.remove('is-collapsed');}
function priveRutaReviewLikes(id){return db.collection('perfiles_comentarios').doc(perfilId).collection('mensajes').doc(id).collection('votos').doc()}
function privePintarReviewLike(id){
 const total=priveReviewCounts.get(id)||0,own=priveReviewMine.get(id)===true;
 document.querySelectorAll('.review-like[data-review-id]').forEach(b=>{
  if(b.dataset.reviewId!==id)return;
  b.textContent=`👍 ${t().like}${total?' ('+total+')':''}`;
  b.classList.toggle('activo',own);b.setAttribute('aria-pressed',String(own));
  b.disabled=priveReviewBusy.has(id);
 });
}
function priveEscucharReviewLikes(id){
 window.priveVotosVisibles.registrar('review:'+id,'data-review-id',id,()=>{
  let vigente=true,ultimo=null,usuario=null;
  const pintar=()=>{if(!vigente||!ultimo)return;priveReviewCounts.set(id,ultimo.size);if(usuario)priveReviewMine.set(id,ultimo.docs.some(d=>d.id===usuario.uid));privePintarReviewLike(id);};
  const col=db.collection('perfiles_comentarios').doc(perfilId).collection('mensajes').doc(id).collection('votos');
  const stop=col.onSnapshot(snap=>{ultimo=snap;pintar();},err=>console.warn('Votos comentario:',err.code||err.message));
  priveUsuario().then(u=>{usuario=u;pintar();}).catch(console.warn);
  return ()=>{vigente=false;ultimo=null;stop();};
 },()=>privePintarReviewLike(id));
}
async function likeReview(id){
 if(priveReviewBusy.has(id))return;
 priveReviewBusy.add(id);privePintarReviewLike(id);
 try{
  const u=await priveUsuario();
  const ref=db.collection('perfiles_comentarios').doc(perfilId).collection('mensajes').doc(id).collection('votos').doc(u.uid);
  const before=await ref.get({source:'server'});
  if(before.exists)await ref.delete();
  else await ref.set({usuarioId:u.uid,creado:firebase.firestore.FieldValue.serverTimestamp()});
  priveReviewMine.set(id,!before.exists);
 }catch(err){console.error('Error al votar comentario:',err);alert('No se pudo guardar el voto del comentario. Verificá que hayas publicado las reglas nuevas.');}
 finally{priveReviewBusy.delete(id);privePintarReviewLike(id)}
}

function compressPhoto(file){return new Promise((resolve,reject)=>{if(!file){resolve('');return}if(!['image/jpeg','image/png','image/webp'].includes(file.type)){reject(new Error('Formato de imagen no admitido'));return}if(file.size>8*1024*1024){reject(new Error('La imagen supera los 8 MB'));return}const img=new Image();const url=URL.createObjectURL(file);img.onload=()=>{try{const scale=Math.min(1,500/Math.max(img.width,img.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);const data=canvas.toDataURL('image/jpeg',.7);URL.revokeObjectURL(url);if(data.length>850000)reject(new Error('La imagen comprimida es demasiado grande'));else resolve(data)}catch(e){URL.revokeObjectURL(url);reject(e)}};img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('No se pudo leer la imagen'))};img.src=url})}
async function submitReview(){const L=t(),author=document.getElementById('pAuthor').value.trim(),content=document.getElementById('pText').value.trim(),rating=document.querySelector('input[name="rating"]:checked'),button=document.getElementById('pSubmit'),status=document.getElementById('pFormStatus');if(!author||!content||!rating){alert(L.required);return}button.disabled=true;button.textContent=L.pending;status.textContent='';try{const image=await compressPhoto(document.getElementById('pImageFile').files[0]);await db.collection('perfiles_comentarios').doc(perfilId).collection('mensajes').add({autor:author,contenido:content,rating:Number(rating.value),image,likes:0,aprobado:false,fecha:firebase.firestore.FieldValue.serverTimestamp()});document.getElementById('pAuthor').value='';document.getElementById('pText').value='';document.getElementById('pImageFile').value='';document.getElementById('pFileName').textContent='';rating.checked=false;status.textContent=L.sent;alert(L.sent)}catch(e){console.error('Error al enviar experiencia:',e);status.textContent=`${L.error} (${e.code||e.message}). Las reglas deben permitir la creación controlada de comentarios pendientes.`}finally{button.disabled=false;button.textContent=L.publish}}
async function loadProfile(){const box=document.getElementById('perfil-content-box');if(!perfilId){box.innerHTML='<p class="prive-error">Falta el ID del perfil en la dirección. Usá perfil.html?id=nombre-del-perfil.</p>';hideTransition();return}try{const doc=await db.collection('modelos_prive').doc(perfilId).get();if(!doc.exists){box.innerHTML=`<p class="prive-error">No existe el perfil ${esc(perfilId)} en Firebase.</p>`;return}modelo=doc.data();await window.priveEnlacePerfilListo;renderProfile();priveEscucharVotos(perfilId);listenReviews();registrarVisitaPerfil();}catch(err){console.error('Error al cargar perfil:',err);box.innerHTML=`<p class="prive-error">No se pudo cargar el perfil (${esc(err.code||err.message)}).</p>`}finally{hideTransition()}}
setLanguage(idiomaPerfil);loadProfile();
</script>
