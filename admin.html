<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control - Masajistas Privé</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d0d0d;
            --card-bg: #141414;
            --gold: #dfc285;
            --gold-glow: rgba(223, 194, 133, 0.25);
            --text-main: #f5f5f5;
            --text-muted: #888888;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 15px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 650px; }
        
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(223, 194, 133, 0.3); padding-bottom: 15px; margin-bottom: 20px; }
        h1 { color: var(--gold); font-family: 'Cormorant Garamond', serif; font-size: 1.5rem; letter-spacing: 2px; }
        .back-link { color: var(--text-muted); text-decoration: none; font-size: 0.8rem; text-transform: uppercase; }
        
        .metrics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 25px; }
        .metric-card { background: var(--card-bg); border: 1px solid rgba(223, 194, 133, 0.3); border-radius: 10px; padding: 15px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .metric-title { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
        .metric-value { font-size: 1.6rem; color: var(--gold); font-weight: bold; }
        
        .info-box { background: var(--card-bg); border: 1px solid rgba(223, 194, 133, 0.2); border-radius: 10px; padding: 20px; text-align: center; }
        .info-box p { color: var(--text-muted); font-size: 0.85rem; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Panel & Métricas Privé</h1>
            <a href="index.html" class="back-link">&larr; Ver Sitio</a>
        </header>

        <!-- Tarjetas de Métricas de Estilos -->
        <div class="metrics-grid">
            <div class="metric-card">
                <div class="metric-title">Estilo Normal (Privé)</div>
                <div class="metric-value" id="contadorNormal">0</div>
            </div>
            <div class="metric-card">
                <div class="metric-title">Estilo Tarjeta Grande</div>
                <div class="metric-value" id="contadorTarjeta">0</div>
            </div>
        </div>

        <div class="info-box">
            <p>📊 Las métricas se actualizan automáticamente en tiempo real cada vez que los usuarios interactúan con el selector de diseño en la página principal.</p>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBDSGPbs_ioH74p-RTctx9av5KKjhnDjBQ",
            authDomain: "masajistasprivepro.firebaseapp.com",
            projectId: "masajistasprivepro",
            storageBucket: "masajistasprivepro.firebasestorage.app",
            messagingSenderId: "768677270509",
            appId: "1:768677270509:web:f4409c2f9c0bbb42ebcde4",
            measurementId: "G-SBN70C32JF"
        };
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        // Escuchar en tiempo real la colección de métricas de estilos de Firebase
        db.collection("metricas_estilos").onSnapshot((snapshot) => {
            let totalNormal = 0;
            let totalTarjeta = 0;

            snapshot.forEach((doc) => {
                const data = doc.data();
                if (data.estilo === 'normal_prive') {
                    totalNormal++;
                } else if (data.estilo === 'tarjeta_grande') {
                    totalTarjeta++;
                }
            });

            document.getElementById('contadorNormal').textContent = totalNormal.toLocaleString('es-AR');
            document.getElementById('contadorTarjeta').textContent = totalTarjeta.toLocaleString('es-AR');
        });
    </script>
</body>
</html>
