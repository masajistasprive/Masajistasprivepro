<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración Empresarial | Masajistas Privé</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body.admin-body { background-color: #0d0d0d; color: #e5e5e5; font-family: 'Montserrat', sans-serif; margin: 0; padding: 20px; }
        .admin-container { max-width: 1100px; margin: 0 auto; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(223, 194, 133, 0.3); padding-bottom: 20px; margin-bottom: 30px; }
        .admin-header h1 { color: #dfc285; font-family: 'Cormorant Garamond', serif; font-size: 28px; margin: 0; }
        .card-admin { background: #141414; border: 1px solid rgba(223, 194, 133, 0.2); border-radius: 10px; padding: 25px; margin-bottom: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .card-admin h2 { color: #dfc285; font-size: 20px; margin-top: 0; font-family: 'Cormorant Garamond', serif; border-bottom: 1px solid rgba(223, 194, 133, 0.1); padding-bottom: 10px; }
        textarea.html-input { width: 100%; height: 90px; background: #1a1a1a; border: 1px solid #333; color: #fff; padding: 12px; border-radius: 6px; font-family: 'Montserrat', sans-serif; font-size: 13px; resize: vertical; box-sizing: border-box; }
        textarea.html-input:focus { border-color: #dfc285; outline: none; }
        input[type="text"] { width: 100%; background: #1a1a1a; border: 1px solid #333; color: #fff; padding: 10px 12px; border-radius: 6px; font-family: 'Montserrat', sans-serif; font-size: 13px; box-sizing: border-box; }
        input[type="text"]:focus { border-color: #dfc285; outline: none; }
        .btn-prive { background: #dfc285; color: #0d0d0d; border: none; padding: 12px 25px; border-radius: 6px; cursor: pointer; font-weight: 600; text-transform: uppercase; font-size: 12px; letter-spacing: 1.5px; transition: all 0.3s; }
        .btn-prive:hover { background: #c5a86d; }
        .btn-traducir { background: rgba(223, 194, 133, 0.15); border: 1px solid #dfc285; color: #dfc285; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; transition: all 0.3s; margin-bottom: 15px; display: inline-flex; align-items: center; gap: 6px; }
        .btn-traducir:hover { background: #dfc285; color: #0d0d0d; }
        table.admin-table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 13px; }
        table.admin-table th, table.admin-table td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #222; }
        table.admin-table th { color: #dfc285; font-weight: 600; text-transform: uppercase; font-size: 11px; letter-spacing: 1px; }
        .badge-estado { padding: 4px 8px; border-radius: 4px; font-size: 10px; font-weight: 600; text-transform: uppercase; }
        .badge-activo { background: rgba(46, 204, 113, 0.15); color: #2ecc71; border: 1px solid rgba(46, 204, 113, 0.3); }
        .badge-pausado { background: rgba(231, 76, 60, 0.15); color: #e74c3c; border: 1px solid rgba(231, 76, 60, 0.3); }
        .btn-accion { background: transparent; border: 1px solid #444; color: #ccc; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 11px; margin-right: 5px; transition: all 0.2s; }
        .btn-accion:hover { border-color: #dfc285; color: #dfc285; }
        .btn-danger:hover { border-color: #e74c3c; color: #e74c3c; }
        .switch-destacada { cursor: pointer; color: #777; font-size: 18px; }
        .switch-destacada.active { color: #dfc285; text-shadow: 0 0 8px rgba(223, 194, 133, 0.6); }

        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; margin-bottom: 15px; }
        .form-row { margin-bottom: 15px; }
        .form-row label { display: block; font-size: 11px; color: #dfc285; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
        
        .lang-tabs { display: flex; gap: 5px; margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .lang-tab { background: #1a1a1a; border: 1px solid #444; color: #aaa; padding: 6px 15px; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: 600; text-transform: uppercase; }
        .lang-tab.active { background: #dfc285; color: #0d0d0d; border-color: #dfc285; }
        .lang-section { display: none; }
        .lang-section.active { display: block; }
    </style>
</head>
<body class="admin-body">

    <div class="admin-container">
        <header class="admin-header">
            <h1>Panel de Administración — Masajistas Privé</h1>
            <a href="index.html" style="color: #dfc285; text-decoration: none; font-size: 13px;">← Volver al Portal</a>
        </header>

        <!-- SECCIÓN: CREAR / EDITAR FICHA EMPRESARIAL -->
        <div class="card-admin">
            <h2 id="tituloPanelForm">➕ Crear Nueva Ficha y Publicar al Instante</h2>
            <input type="hidden" id="editDocId">
            
            <div class="form-grid">
                <div class="form-row">
                    <label>Nombre de la Modelo:</label>
                    <input type="text" id="inputNombre" placeholder="Ej: Donatella">
                </div>
                <div class="form-row">
                    <label>ID Único / Slug (Ej: donatella):</label>
                    <input type="text" id="inputSlug" placeholder="Se genera solo si lo dejás vacío">
                </div>
                <div class="form-row">
                    <label>Categoría:</label>
                    <select id="inputCategoria" style="width: 100%; background: #1a1a1a; border: 1px solid #333; color: #fff; padding: 10px 12px; border-radius: 6px; font-size: 13px;">
                        <option value="terapeuticas">Terapéuticas</option>
                        <option value="sensuales">Sensuales</option>
                        <option value="masculinos">Masculinos</option>
                        <option value="fantasias">Fantasías</option>
                    </select>
                </div>
                <div class="form-row">
                    <label>Teléfono WhatsApp (Ej: 54911...):</label>
                    <input type="text" id="inputWhatsapp" placeholder="54911...">
                </div>
            </div>

            <div class="form-grid">
                <div class="form-row">
                    <label>URL Foto Principal (ej. img/donatella1.jpg):</label>
                    <input type="text" id="inputFotoPrincipal" placeholder="img/donatella1.jpg">
                </div>
                <div class="form-row">
                    <label>Fotos de Galería (separadas por coma):</label>
                    <input type="text" id="inputFotosGaleria" placeholder="img/donatella1.jpg, img/donatella2.jpg">
                </div>
            </div>

            <!-- Botón de Traducción Automática Inteligente -->
            <div style="margin-top: 15px; border-top: 1px solid rgba(223,194,133,0.2); padding-top: 15px;">
                <button type="button" class="btn-traducir" onclick="traducirAutomaticamenteAdmin()">✨ Traducir automáticamente campos de Español a Inglés, Portugués y Francés</button>
                <div id="tradStatusAdmin" style="font-size: 12px; color: #dfc285; margin-top: 5px;"></div>
            </div>

            <!-- SOLAPAS DE IDIOMAS -->
            <div style="margin-top: 15px;">
                <label style="display: block; color: #dfc285; font-size: 12px; text-transform: uppercase; margin-bottom: 10px; letter-spacing: 1px; font-weight: 600;">Textos y Traducciones:</label>
                <div class="lang-tabs">
                    <div class="lang-tab active" onclick="cambiarTabAdmin('es')">🇪🇸 Español</div>
                    <div class="lang-tab" onclick="cambiarTabAdmin('en')">🇺🇸 Inglés</div>
                    <div class="lang-tab" onclick="cambiarTabAdmin('pt')">🇧🇷 Portugués</div>
                    <div class="lang-tab" onclick="cambiarTabAdmin('fr')">🇫🇷 Francés</div>
                </div>

                <!-- Español -->
                <div id="admin-lang-es" class="lang-section active">
                    <div class="form-grid">
                        <div class="form-row"><label>Zona (ES):</label><input type="text" id="zona_es" placeholder="Ej: Microcentro CABA"></div>
                        <div class="form-row"><label>Modalidad (ES):</label><input type="text" id="modalidad_es" placeholder="Ej: Departamento propio"></div>
                    </div>
                    <div class="form-row"><label>Párrafo de Descripción 1 (ES):</label><textarea id="desc1_es" class="html-input" placeholder="Te recibo en un espacio privado..."></textarea></div>
                    <div class="form-row"><label>Párrafo de Descripción 2 (ES):</label><textarea id="desc2_es" class="html-input" placeholder="Cada sesión está pensada..."></textarea></div>
                    <div class="form-grid">
                        <div class="form-row"><label>Horarios (ES):</label><input type="text" id="horarios_es" placeholder="Lunes a sábado de 11 a 19 hs."></div>
                        <div class="form-row"><label>Atención / Detalles (ES):</label><input type="text" id="atencion_es" placeholder="Tu comodidad y privacidad son mi prioridad."></div>
                    </div>
                </div>

                <!-- Inglés -->
                <div id="admin-lang-en" class="lang-section">
                    <div class="form-grid">
                        <div class="form-row"><label>Area (EN):</label><input type="text" id="zona_en"></div>
                        <div class="form-row"><label>Modality (EN):</label><input type="text" id="modalidad_en"></div>
                    </div>
                    <div class="form-row"><label>Paragraph 1 (EN):</label><textarea id="desc1_en" class="html-input"></textarea></div>
                    <div class="form-row"><label>Paragraph 2 (EN):</label><textarea id="desc2_en" class="html-input"></textarea></div>
                    <div class="form-grid">
                        <div class="form-row"><label>Hours (EN):</label><input type="text" id="horarios_en"></div>
                        <div class="form-row"><label>Care (EN):</label><input type="text" id="atencion_en"></div>
                    </div>
                </div>

                <!-- Portugués -->
                <div id="admin-lang-pt" class="lang-section">
                    <div class="form-grid">
                        <div class="form-row"><label>Zona (PT):</label><input type="text" id="zona_pt"></div>
                        <div class="form-row"><label>Modalidade (PT):</label><input type="text" id="modalidad_pt"></div>
                    </div>
                    <div class="form-row"><label>Parágrafo 1 (PT):</label><textarea id="desc1_pt" class="html-input"></textarea></div>
                    <div class="form-row"><label>Parágrafo 2 (PT):</label><textarea id="desc2_pt" class="html-input"></textarea></div>
                    <div class="form-grid">
                        <div class="form-row"><label>Horários (PT):</label><input type="text" id="horarios_pt"></div>
                        <div class="form-row"><label>Atendimento (PT):</label><input type="text" id="atencion_pt"></div>
                    </div>
                </div>

                <!-- Francés -->
                <div id="admin-lang-fr" class="lang-section">
                    <div class="form-grid">
                        <div class="form-row"><label>Zone (FR):</label><input type="text" id="zona_fr"></div>
                        <div class="form-row"><label>Modalité (FR):</label><input type="text" id="modalidad_fr"></div>
                    </div>
                    <div class="form-row"><label>Paragraphe 1 (FR):</label><textarea id="desc1_fr" class="html-input"></textarea></div>
                    <div class="form-row"><label>Paragraphe 2 (FR):</label><textarea id="desc2_fr" class="html-input"></textarea></div>
                    <div class="form-grid">
                        <div class="form-row"><label>Horaires (FR):</label><input type="text" id="horarios_fr"></div>
                        <div class="form-row"><label>Attention (FR):</label><input type="text" id="atencion_fr"></div>
                    </div>
                </div>
            </div>

            <div style="margin-top: 25px; display: flex; gap: 15px; align-items: center; flex-wrap: wrap;">
                <button type="button" class="btn-prive" onclick="publicarFichaEmpresarial()">🚀 Publicar Ficha de Inmediato</button>
                <button type="button" class="btn-accion" onclick="limpiarFormularioAdmin()" style="padding: 12px 20px;">Limpiar Formulario</button>
            </div>
            <div id="statusAdmin" style="margin-top: 15px; font-weight: 500; font-size: 13px;"></div>
        </div>

        <!-- SECCIÓN: LISTADO GENERAL -->
        <div class="card-admin">
            <h2>📋 Nómina de Modelos Publicadas</h2>
            <div style="overflow-x: auto;">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>ID (Slug)</th>
                            <th>Zona</th>
                            <th>Categoría</th>
                            <th>Visitas</th>
                            <th>Estado</th>
                            <th>Destacada</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaModelosBody">
                        <tr><td colspan="8" style="text-align: center; color: #777;">Cargando nómina...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBDSGPbs_ioH74p-RTctx9av5KKjhnDjBQ",
            authDomain: "masajistasprivepro.firebaseapp.com",
            projectId: "masajistasprivepro",
            storageBucket: "masajistasprivepro.firebasestorage.app",
            messagingSenderId: "768677270509",
            appId: "1:768677270509:web:f4409c2f9c0bbb42ebcde4",
            measurementId: "G-SBN70C32JF"
        };
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        function cambiarTabAdmin(lang) {
            document.querySelectorAll('.lang-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.lang-section').forEach(s => s.classList.remove('active'));
            event.currentTarget.classList.add('active');
            document.getElementById(`admin-lang-${lang}`).classList.add('active');
        }

        async function traducirAutomaticamenteAdmin() {
            const status = document.getElementById('tradStatusAdmin');
            status.textContent = "⏳ Traduciendo textos del español automáticamente...";
            
            const campos = ['zona', 'modalidad', 'desc1', 'desc2', 'horarios', 'atencion'];
            const destinos = [
                { code: 'en', suf: 'en' },
                { code: 'pt', suf: 'pt' },
                { code: 'fr', suf: 'fr' }
            ];

            try {
                for (let dest of destinos) {
                    for (let campo of campos) {
                        let valEs = document.getElementById(`${campo}_es`).value;
                        if (valEs.trim()) {
                            let res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(valEs)}&langpair=es|${dest.code}`);
                            let data = await res.json();
                            if (data && data.responseData) {
                                document.getElementById(`${campo}_${dest.suf}`).value = data.responseData.translatedText;
                            }
                        }
                    }
                }
                status.textContent = "✅ ¡Traducción automática completada con éxito!";
            } catch (e) {
                status.textContent = "❌ Error al traducir de forma automática.";
            }
        }

        function publicarFichaEmpresarial() {
            const nombre = document.getElementById('inputNombre').value.trim();
            let slug = document.getElementById('inputSlug').value.trim().toLowerCase().replace(/[^a-z0-9\-]/g, '');
            const statusDiv = document.getElementById('statusAdmin');

            if (!nombre) {
                statusDiv.style.color = '#e74c3c';
                statusDiv.textContent = '❌ Por favor, ingresá al menos el nombre de la modelo.';
                return;
            }

            if (!slug) {
                slug = nombre.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]/g, '');
            }

            const categoria = document.getElementById('inputCategoria').value;
            const whatsapp = document.getElementById('inputWhatsapp').value.trim();
            const fotoPrincipal = document.getElementById('inputFotoPrincipal').value.trim() || 'img/monograma.png';
            const galeriaRaw = document.getElementById('inputFotosGaleria').value.trim();
            const fotosGaleria = galeriaRaw ? galeriaRaw.split(',').map(s => s.trim()).filter(Boolean) : [fotoPrincipal];

            let traducciones = { es: {}, en: {}, pt: {}, fr: {} };
            ['es', 'en', 'pt', 'fr'].forEach(l => {
                traducciones[l] = {
                    perfilTitle: `${nombre} | Masajistas Privé`,
                    btnVolver: l === 'es' ? '← Volver' : (l === 'en' ? '← Back' : (l === 'pt' ? '← Voltar' : '← Retour')),
                    badgeVerificado: l === 'es' ? '✓ Privé Verificado' : (l === 'en' ? '✓ Privé Verified' : '✓ Privé Verificado'),
                    labelZona: l === 'es' ? 'Zona:' : (l === 'en' ? 'Area:' : (l === 'pt' ? 'Zona:' : 'Zone :')),
                    valorZona: document.getElementById(`zona_${l}`).value.trim(),
                    labelModalidad: l === 'es' ? 'Modalidad:' : (l === 'en' ? 'Modality:' : (l === 'pt' ? 'Modalidade:' : 'Modalité :')),
                    valorModalidad: document.getElementById(`modalidad_${l}`).value.trim(),
                    tituloSobreMi: l === 'es' ? 'Sobre mí y Servicios' : (l === 'en' ? 'About Me and Services' : (l === 'pt' ? 'Sobre mim e Serviços' : 'À propos de moi et Services')),
                    descPerfil1: document.getElementById(`desc1_${l}`).value.trim(),
                    descPerfil2: document.getElementById(`desc2_${l}`).value.trim(),
                    labelHorarios: l === 'es' ? 'Horarios:' : (l === 'en' ? 'Hours:' : (l === 'pt' ? 'Horários:' : 'Horaires :')),
                    valorHorarios: document.getElementById(`horarios_${l}`).value.trim(),
                    labelAtencion: l === 'es' ? 'Atención:' : (l === 'en' ? 'Care:' : (l === 'pt' ? 'Atendimento:' : 'Attention :')),
                    valorAtencion: document.getElementById(`atencion_${l}`).value.trim(),
                    btnWpp: l === 'es' ? 'Contactar por WhatsApp' : (l === 'en' ? 'Contact via WhatsApp' : (l === 'pt' ? 'Contatar por WhatsApp' : 'Contacter par WhatsApp')),
                    footerLegal: "Este é um site para adultos (+18)...",
                    footerCopy: "© 2026 Masajistas Privé. Todos os direitos reservados."
                };
            });

            const datosModelo = {
                nombre: nombre,
                idSlug: slug,
                categoria: categoria,
                whatsapp: whatsapp,
                whatsappLink: `https://wa.me/${whatsapp}?text=Hola%20${encodeURIComponent(nombre)},%20vi%20tu%20perfil%20en%20Masajistas%20Privé`,
                fotoPrincipal: fotoPrincipal,
                fotosGaleria: fotosGaleria,
                zona: traducciones.es.valorZona,
                modalidad: traducciones.es.valorModalidad,
                descripcion: traducciones.es.descPerfil1,
                traducciones: traducciones,
                estado: 'activa',
                destacada: false,
                visitas: 0,
                fechaActualizacion: firebase.firestore.FieldValue.serverTimestamp()
            };

            db.collection("modelos_prive").doc(slug).set(datosModelo, { merge: true })
                .then(() => {
                    statusDiv.style.color = '#2ecc71';
                    statusDiv.textContent = `🚀 ¡Ficha de ${nombre} publicada con éxito! Ya se puede ver en el portal.`;
                    limpiarFormularioAdmin();
                    cargarNovedadesAdmin();
                })
                .catch(err => {
                    statusDiv.style.color = '#e74c3c';
                    statusDiv.textContent = `❌ Error al publicar: ` + err.message;
                });
        }

        function cargarNovedadesAdmin() {
            const tbody = document.getElementById('tablaModelosBody');
            db.collection("modelos_prive").onSnapshot((snapshot) => {
                if (snapshot.empty) {
                    tbody.innerHTML = `<tr><td colspan="8" style="text-align: center; color: #777;">No hay perfiles publicados todavía.</td></tr>`;
                    return;
                }

                let htmlContent = '';
                snapshot.forEach((docSnap) => {
                    const m = docSnap.data();
                    const docId = docSnap.id;
                    const esActiva = m.estado !== 'pausado';
                    const esDestacada = m.destacada === true;

                    htmlContent += `
                        <tr>
                            <td><strong>${m.nombre}</strong></td>
                            <td><code style="color:#dfc285; background:#1e1e1e; padding:2px 6px; border-radius:4px;">${docId}</code></td>
                            <td>${m.zona || '-'}</td>
                            <td style="text-transform: capitalize;">${m.categoria || '-'}</td>
                            <td>👁 ${(m.visitas || 0).toLocaleString()}</td>
                            <td>
                                <span class="badge-estado ${esActiva ? 'badge-activo' : 'badge-pausado'}">
                                    ${esActiva ? 'Activa' : 'Pausada'}
                                </span>
                            </td>
                            <td style="text-align: center;">
                                <span class="switch-destacada ${esDestacada ? 'active' : ''}" onclick="toggleDestacadaAdmin('${docId}', ${!esDestacada})">★</span>
                            </td>
                            <td>
                                <button class="btn-accion" onclick="editarModeloAdmin('${docId}')">Editar</button>
                                <button class="btn-accion" onclick="toggleEstadoAdmin('${docId}', '${m.estado}')">${esActiva ? 'Pausar' : 'Activar'}</button>
                                <button class="btn-accion btn-danger" onclick="eliminarModeloAdmin('${docId}', '${m.nombre}')">Eliminar</button>
                            </td>
                        </tr>
                    `;
                });
                tbody.innerHTML = htmlContent;
            });
        }

        function editarModeloAdmin(docId) {
            db.collection("modelos_prive").doc(docId).get().then((doc) => {
                if (doc.exists) {
                    const m = doc.data();
                    document.getElementById('editDocId').value = docId;
                    document.getElementById('inputNombre').value = m.nombre || '';
                    document.getElementById('inputSlug').value = docId;
                    document.getElementById('inputCategoria').value = m.categoria || 'terapeuticas';
                    document.getElementById('inputWhatsapp').value = m.whatsapp || '';
                    document.getElementById('inputFotoPrincipal').value = m.fotoPrincipal || '';
                    document.getElementById('inputFotosGaleria').value = m.fotosGaleria ? m.fotosGaleria.join(', ') : '';

                    const trad = m.traducciones || {};
                    ['es', 'en', 'pt', 'fr'].forEach(l => {
                        const tLang = trad[l] || {};
                        document.getElementById(`zona_${l}`).value = tLang.valorZona || '';
                        document.getElementById(`modalidad_${l}`).value = tLang.valorModalidad || '';
                        document.getElementById(`desc1_${l}`).value = tLang.descPerfil1 || '';
                        document.getElementById(`desc2_${l}`).value = tLang.descPerfil2 || '';
                        document.getElementById(`horarios_${l}`).value = tLang.valorHorarios || '';
                        document.getElementById(`atencion_${l}`).value = tLang.valorAtencion || '';
                    });

                    document.getElementById('tituloPanelForm').textContent = `✏️ Editando Ficha de: ${m.nombre}`;
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            });
        }

        function limpiarFormularioAdmin() {
            document.getElementById('editDocId').value = '';
            document.getElementById('inputNombre').value = '';
            document.getElementById('inputSlug').value = '';
            document.getElementById('inputWhatsapp').value = '';
            document.getElementById('inputFotoPrincipal').value = '';
            document.getElementById('inputFotosGaleria').value = '';
            document.getElementById('statusAdmin').textContent = '';
            document.getElementById('tradStatusAdmin').textContent = '';
            document.getElementById('tituloPanelForm').textContent = '➕ Crear Nueva Ficha y Publicar al Instante';
            
            ['es', 'en', 'pt', 'fr'].forEach(l => {
                document.getElementById(`zona_${l}`).value = '';
                document.getElementById(`modalidad_${l}`).value = '';
                document.getElementById(`desc1_${l}`).value = '';
                document.getElementById(`desc2_${l}`).value = '';
                document.getElementById(`horarios_${l}`).value = '';
                document.getElementById(`atencion_${l}`).value = '';
            });
        }

        function toggleEstadoAdmin(docId, estadoActual) {
            db.collection("modelos_prive").doc(docId).update({ estado: (estadoActual === 'pausado') ? 'activa' : 'pausado' });
        }

        function toggleDestacadaAdmin(docId, nuevoValor) {
            db.collection("modelos_prive").doc(docId).update({ destacada: nuevoValor });
        }

        function eliminarModeloAdmin(docId, nombre) {
            if (confirm(`¿Estás seguro de eliminar a ${nombre}?`)) {
                db.collection("modelos_prive").doc(docId).delete();
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            cargarNovedadesAdmin();
        });
    </script>
</body>
</html>
