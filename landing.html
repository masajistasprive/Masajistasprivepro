<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centro de Masajes y Bienestar | CABA</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0b0b0b;
            color: #f5f5f5;
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            justify-content: center;
            align-items: center;
        }
        .landing-box {
            max-width: 550px;
            width: 90%;
            background: #141414;
            border: 1px solid rgba(223, 194, 133, 0.3);
            border-radius: 14px;
            padding: 50px 30px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.9);
            text-align: center;
        }
        .landing-logo {
            max-width: 180px;
            width: 100%;
            height: auto;
            margin-bottom: 30px;
            filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5));
        }
        h1 {
            color: #dfc285;
            font-family: 'Cormorant Garamond', serif;
            font-size: 26px;
            margin-bottom: 12px;
            letter-spacing: 1px;
        }
        p {
            color: #bbb;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 35px;
            font-weight: 300;
        }
        .btn-ingresar-grande {
            display: block;
            background: linear-gradient(135deg, #dfc285, #c5a059);
            color: #0d0d0d;
            text-decoration: none;
            padding: 18px 25px;
            font-weight: 700;
            border-radius: 8px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 15px;
            box-shadow: 0 6px 20px rgba(223, 194, 133, 0.35);
            transition: all 0.3s ease;
        }
        .btn-ingresar-grande:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(223, 194, 133, 0.5);
        }
        .footer-text {
            margin-top: 25px;
            font-size: 11px;
            color: #666;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="landing-box">
        <!-- Logo Grande Centrado -->
        <img src="img/logo.png" alt="Masajistas Privé" class="landing-logo">

        <h1>Portal de Bienestar y Masajes en CABA</h1>
        <p>Espacio exclusivo de atención profesional, gabinetes acondicionados y servicios independientes con reserva previa.</p>

        <!-- Botón Gigante y Llamativo -->
        <a href="index.html" class="btn-ingresar-grande">Ingresar al Portal &rarr;</a>

        <div class="footer-text">
            © 2026 Masajistas Privé. Todos los derechos reservados.
        </div>
    </div>

</body>
</html>
