<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foro - Masajistas Privé</title>
    <!-- Firebase App (compat) y Firestore -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <style>
        :root {
            --champagne: #dfbc63;
            --champagne-light: #f3e5ab;
            --champagne-dark: #b8973e;
            --bg-dark: #121212;
            --card-bg: #1a1a1a;
            --box-bg: #222222;
        }

        body { font-family: Arial, sans-serif; background-color: var(--bg-dark); color: #e0e0e0; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: var(--card-bg); padding: 20px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.7); border: 1px solid #333; }
        h1, h2 { color: var(--champagne); text-align: center; }
        .form-group { margin-bottom: 15px; }
        input[type="text"], textarea { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #444; background: #252525; color: #fff; border-radius: 4px; }
        input[type="text"]:focus, textarea:focus { border-color: var(--champagne); outline: none; }
        
        /* Botones color Champagne */
        button { background: var(--champagne); color: #121212; border: none; padding: 10px 15px; cursor: pointer; border-radius: 4px; font-weight: bold; width: 100%; transition: background 0.2s; }
        button:hover { background: var(--champagne-light); }
        
        #loading { text-align: center; font-style: italic; color: #888; margin: 20px 0; }
        
        .post { background: var(--box-bg); padding: 15px; margin-bottom: 20px; border-radius: 6px; border-left: 4px solid var(--champagne); }
        .post h3 { margin: 0 0 5px 0; color: var(--champagne); }
        .post p { margin: 0 0 10px 0; word-break: break-word; color: #ddd; }
        .post small { color: #aaa; }

        .actions-bar { display: flex; gap: 15px; margin-top: 10px; font-size: 0.85em; justify-content: space-between; align-items: center; }
        .like-btn { background: none; border: none; color: var(--champagne); cursor: pointer; padding: 0; font-weight: bold; width: auto; display: flex; align-items: center; gap: 4px; }
        .like-btn:hover { color: var(--champagne-light); background: none; }
        
        .view-btn { background: var(--champagne); color: #121212; border: none; padding: 6px 12px; border-radius: 4px; font-size: 0.85em; cursor: pointer; font-weight: bold; width: auto; }
        .view-btn:hover { background: var(--champagne-light); }

        .back-btn { background: #252525; color: var(--champagne); border: 1px solid var(--champagne); padding: 8px 15px; margin-bottom: 20px; border-radius: 4px; cursor: pointer; font-weight: bold; width: auto; display: inline-block; }
        .back-btn:hover { background: #333; }

        .comments-section { margin-top: 15px; border-top: 1px solid #333; padding-top: 12px; }
        .comment-item { font-size: 0.9em; margin-bottom: 10px; color: #ccc; word-break: break-word; background: #1c1c1c; padding: 10px; border-radius: 4px; }
        .comment-author { color: var(--champagne); font-weight: bold; margin-right: 6px; }
        .comment-time { font-size: 0.75em; color: #777; margin-left: 8px; }
        
        .comment-form { margin-top: 15px; display: flex; flex-direction: column; gap: 8px; }
        .comment-inputs { display: flex; gap: 6px; }
        .comment-inputs input { font-size: 0.9em; padding: 8px; background: #1a1a1a; border: 1px solid #444; }
        .comment-btn { width: auto; padding: 8px 16px; font-size: 0.9em; background: var(--champagne); color: #121212; white-space: nowrap; }

        .emoji-bar { display: flex; gap: 5px; flex-wrap: wrap; background: #181818; padding: 5px; border-radius: 4px; border: 1px solid #333; }
        .emoji-btn { background: none; border: none; font-size: 1.2em; cursor: pointer; padding: 2px 6px; width: auto; }
        .emoji-btn:hover { background: #333; border-radius: 3px; }

        .reply-box { margin-top: 8px; display: none; flex-direction: column; gap: 6px; padding-left: 15px; border-left: 2px solid var(--champagne); }
        .reply-trigger { color: var(--champagne); cursor: pointer; font-size: 0.85em; background: none; border: none; padding: 0; text-decoration: underline; width: auto; }
        .reply-trigger:hover { color: var(--champagne-light); background: none; }
        
        .msg-media { max-width: 100%; max-height: 220px; border-radius: 6px; margin-top: 8px; display: block; object-fit: contain; background: #000; }
    </style>
</head>
<body>

<div style="text-align: center; margin-bottom: 20px;">
    <img src="img/logo.png" alt="Logo" style="max-height: 80px;">
</div>

<div class="container">
    <h1>Foro Masajistas Privé</h1>

    <!-- VISTA 1: LISTA DE TEMAS -->
    <div id="listView">
        <div class="form-group">
            <h2>Crear nuevo tema</h2>
            <input type="text" id="autorInput" placeholder="Tu nombre o apodo">
        </div>
        <div class="form-group">
            <input type="text" id="tituloInput" placeholder="Título del tema">
        </div>
        <div class="form-group">
            <textarea id="contenidoInput" rows="4" placeholder="Escribí tu mensaje aquí..."></textarea>
            <div class="emoji-bar" style="margin-top: 5px;">
                <button class="emoji-btn" onclick="agregarEmoji('contenidoInput', '😊')">😊</button>
                <button class="emoji-btn" onclick="agregarEmoji('contenidoInput', '👍')">👍</button>
                <button class="emoji-btn" onclick="agregarEmoji('contenidoInput', '🔥')">🔥</button>
                <button class="emoji-btn" onclick="agregarEmoji('contenidoInput', '❤️')">❤️</button>
                <button class="emoji-btn" onclick="agregarEmoji('contenidoInput', '👏')">👏</button>
                <button class="emoji-btn" onclick="agregarEmoji('contenidoInput', '✨')">✨</button>
                <input type="text" id="gifInput" placeholder="Link de GIF / Imagen (opcional)" style="flex: 1; font-size: 0.8em; padding: 4px;">
            </div>
        </div>
        <button id="publicarBtn">Publicar Tema</button>

        <hr style="border: 0; border-top: 1px solid #333; margin: 30px 0;">

        <h2>Temas del Foro</h2>
        <div id="loading">Cargando temas...</div>
        <div id="postsContainer"></div>
    </div>

    <!-- VISTA 2: HILO INDIVIDUAL -->
    <div id="threadView" style="display: none;">
        <button class="back-btn" onclick="volverAlListado()">← Volver al Foro</button>
        <div id="singlePostContainer"></div>
        
        <div class="comments-section">
            <h3>Comentarios y Respuestas</h3>
            <div id="singleCommentsContainer"></div>
            
            <div class="comment-form">
                <div class="comment-inputs">
                    <input type="text" id="activeAuthor" placeholder="Tu nombre" style="flex: 1;">
                    <input type="text" id="activeCommentText" placeholder="Escribir comentario..." style="flex: 2.5;">
                </div>
                <div class="emoji-bar">
                    <button class="emoji-btn" onclick="agregarEmoji('activeCommentText', '😊')">😊</button>
                    <button class="emoji-btn" onclick="agregarEmoji('activeCommentText', '👍')">👍</button>
                    <button class="emoji-btn" onclick="agregarEmoji('activeCommentText', '🔥')">🔥</button>
                    <button class="emoji-btn" onclick="agregarEmoji('activeCommentText', '❤️')">❤️</button>
                    <input type="text" id="activeGifInput" placeholder="Link de GIF / Imagen (opcional)" style="flex: 1; font-size: 0.8em; padding: 4px;">
                </div>
                <button class="comment-btn" onclick="enviarComentarioActivo()">Comentar</button>
            </div>
        </div>
    </div>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBDSGPbs_ioH74p-RTctx9av5KKjhnDjBQ",
    authDomain: "masajistasprivepro.firebaseapp.com",
    projectId: "masajistasprivepro",
    storageBucket: "masajistasprivepro.firebasestorage.app",
    messagingSenderId: "768677270509",
    appId: "1:768677270509:web:f4409c2f9c0bbb42ebcde4",
    measurementId: "G-SBN70C32JF"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  let currentPostId = null;

  const loadingDiv = document.getElementById('loading');
  const postsContainer = document.getElementById('postsContainer');
  const publicarBtn = document.getElementById('publicarBtn');

  window.agregarEmoji = function(elementId, emoji) {
      const input = document.getElementById(elementId);
      input.value += emoji;
      input.focus();
  };

  // Procesador inteligente de links de GIFs (soporta Tenor, Giphy y links directos)
  function renderMedia(url) {
      if (!url || url.trim() === "") return "";
      let cleanUrl = url.trim();
      
      // Si es un link de Tenor web, intentamos adaptarlo o mostrarlo seguro
      return `<img src="${cleanUrl}" class="msg-media" alt="GIF" onerror="this.onerror=null; this.insertAdjacentHTML('afterend', '<a href=\'${cleanUrl}\' target=\'_blank\' style=\'color:var(--champagne); display:block; font-size:0.85em; margin-top:5px;\'>Ver GIF adjunto ↗</a>'); this.style.display='none';">`;
  }

  // Cargar lista principal de temas
  db.collection("temas").orderBy("fecha", "desc").onSnapshot((snapshot) => {
      loadingDiv.style.display = 'none';
      postsContainer.innerHTML = "";

      if (snapshot.empty) {
          postsContainer.innerHTML = "<p style='text-align: center; color: #888;'>No hay temas publicados todavía. ¡Sé el primero en crear uno!</p>";
          return;
      }

      snapshot.forEach((docSnap) => {
          const data = docSnap.data();
          const postId = docSnap.id;
          const fechaFormateada = data.fecha ? new Date(data.fecha.toDate()).toLocaleString() : 'Hace un momento';
          const likesCount = data.likes || 0;
          
          let mediaHtml = renderMedia(data.gif);

          const postElement = document.createElement('div');
          postElement.className = 'post';
          postElement.innerHTML = `
              <h3>${escapeHtml(data.titulo)}</h3>
              <p>${escapeHtml(data.contenido)}</p>
              ${mediaHtml}
              <small>Publicado por <b>${escapeHtml(data.autor)}</b> el ${fechaFormateada}</small>
              
              <div class="actions-bar">
                  <button class="like-btn" onclick="darLikePost('${postId}', ${likesCount})">👍 Me gusta (<span id="likes-count-${postId}">${likesCount}</span>)</button>
                  <button class="view-btn" onclick="abrirHilo('${postId}')">Ver Debate / Responder</button>
              </div>
          `;
          postsContainer.appendChild(postElement);
      });
  });

  // Publicar tema principal
  publicarBtn.addEventListener('click', () => {
      const autor = document.getElementById('autorInput').value.trim();
      const titulo = document.getElementById('tituloInput').value.trim();
      const contenido = document.getElementById('contenidoInput').value.trim();
      const gif = document.getElementById('gifInput').value.trim();

      if (!autor || !titulo || !contenido) {
          alert("Por favor completá nombre, título y mensaje antes de publicar.");
          return;
      }

      publicarBtn.disabled = true;
      publicarBtn.textContent = "Publicando...";

      db.collection("temas").add({
          autor: autor,
          titulo: titulo,
          contenido: contenido,
          gif: gif,
          likes: 0,
          fecha: firebase.firestore.FieldValue.serverTimestamp()
      })
      .then(() => {
          document.getElementById('autorInput').value = '';
          document.getElementById('tituloInput').value = '';
          document.getElementById('contenidoInput').value = '';
          document.getElementById('gifInput').value = '';
          publicarBtn.disabled = false;
          publicarBtn.textContent = "Publicar Tema";
      })
      .catch((error) => {
          console.error("Error al guardar el tema: ", error);
          publicarBtn.disabled = false;
          publicarBtn.textContent = "Publicar Tema";
      });
  });

  // Abrir vista de hilo individual
  window.abrirHilo = function(postId) {
      currentPostId = postId;
      document.getElementById('listView').style.display = 'none';
      document.getElementById('threadView').style.display = 'block';

      db.collection("temas").doc(postId).get().then((doc) => {
          if (doc.exists) {
              const data = doc.data();
              const fechaFormateada = data.fecha ? new Date(data.fecha.toDate()).toLocaleString() : '';
              const likesCount = data.likes || 0;
              let mediaHtml = renderMedia(data.gif);

              document.getElementById('singlePostContainer').innerHTML = `
                  <div class="post" style="border-left-color: var(--champagne); margin-bottom: 10px;">
                      <h2>${escapeHtml(data.titulo)}</h2>
                      <p style="font-size: 1.1em;">${escapeHtml(data.contenido)}</p>
                      ${mediaHtml}
                      <small>Publicado por <b>${escapeHtml(data.autor)}</b> el ${fechaFormateada}</small>
                      <div class="actions-bar" style="margin-top: 15px;">
                          <button class="like-btn" onclick="darLikePost('${postId}', ${likesCount})">👍 Me gusta (<span id="likes-count-${postId}">${likesCount}</span>)</button>
                      </div>
                  </div>
              `;
          }
      });

      db.collection("temas").doc(postId).collection("respuestas").orderBy("fecha", "asc")
        .onSnapshot((snapshot) => {
            const commentsContainer = document.getElementById('singleCommentsContainer');
            commentsContainer.innerHTML = "";

            if (snapshot.empty) {
                commentsContainer.innerHTML = "<p style='color: #777; font-size: 0.9em;'>No hay comentarios aún. ¡Sé el primero en responder!</p>";
                return;
            }

            snapshot.forEach((replyDoc) => {
                const rData = replyDoc.data();
                const rId = replyDoc.id;
                const rFecha = rData.fecha ? new Date(rData.fecha.toDate()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
                const rLikes = rData.likes || 0;
                let rMedia = renderMedia(rData.gif);

                const commentDiv = document.createElement('div');
                commentDiv.className = 'comment-item';
                commentDiv.innerHTML = `
                    <div>
                        <span class="comment-author">${escapeHtml(rData.autor)}:</span>
                        <span>${escapeHtml(rData.contenido)}</span>
                        ${rMedia}
                        <span class="comment-time">${rFecha}</span>
                    </div>
                    <div style="display: flex; gap: 15px; margin-top: 8px; align-items: center;">
                        <button class="like-btn" style="font-size: 0.8em;" onclick="darLikeComentario('${postId}', '${rId}', ${rLikes})">👍 <span id="r-likes-${rId}">${rLikes}</span></button>
                        <button class="reply-trigger" onclick="toggleReplyBox('${rId}')">Responder</button>
                    </div>
                    <div id="reply-box-${rId}" class="reply-box">
                        <input type="text" id="rAuthor-${rId}" placeholder="Nombre" style="font-size: 0.85em; padding: 6px;">
                        <input type="text" id="rText-${rId}" placeholder="Responder a ${escapeHtml(rData.autor)}..." style="font-size: 0.85em; padding: 6px;">
                        <input type="text" id="rGif-${rId}" placeholder="Link GIF / Imagen (opcional)" style="font-size: 0.8em; padding: 4px;">
                        <button class="comment-btn" onclick="enviarRespuestaAComentario('${postId}', '${rId}', '${escapeHtml(rData.autor)}')">Enviar respuesta</button>
                    </div>
                `;
                commentsContainer.appendChild(commentDiv);
            });
        });
  };

  window.volverAlListado = function() {
      currentPostId = null;
      document.getElementById('threadView').style.display = 'none';
      document.getElementById('listView').style.display = 'block';
  };

  window.enviarComentarioActivo = function() {
      if (!currentPostId) return;
      const autor = document.getElementById('activeAuthor').value.trim();
      const contenido = document.getElementById('activeCommentText').value.trim();
      const gif = document.getElementById('activeGifInput').value.trim();

      if (!autor || (!contenido && !gif)) {
          alert("Ingresá tu nombre y un comentario o un GIF.");
          return;
      }

      db.collection("temas").doc(currentPostId).collection("respuestas").add({
          autor: autor,
          contenido: contenido,
          gif: gif,
          likes: 0,
          fecha: firebase.firestore.FieldValue.serverTimestamp()
      })
      .then(() => {
          document.getElementById('activeCommentText').value = '';
          document.getElementById('activeGifInput').value = '';
      });
  };

  window.enviarRespuestaAComentario = function(postId, replyId, targetAuthor) {
      const autor = document.getElementById(`rAuthor-${replyId}`).value.trim();
      const contenido = document.getElementById(`rText-${replyId}`).value.trim();
      const gif = document.getElementById(`rGif-${replyId}`).value.trim();

      if (!autor || (!contenido && !gif)) {
          alert("Ingresá tu nombre y tu respuesta o GIF.");
          return;
      }

      db.collection("temas").doc(postId).collection("respuestas").add({
          autor: autor,
          contenido: `@${targetAuthor} ${contenido}`,
          gif: gif,
          likes: 0,
          fecha: firebase.firestore.FieldValue.serverTimestamp()
      })
      .then(() => {
          document.getElementById(`rText-${replyId}`).value = '';
          document.getElementById(`rGif-${replyId}`).value = '';
          document.getElementById(`reply-box-${replyId}`).style.display = 'none';
      });
  };

  window.darLikePost = function(postId, currentLikes) {
      db.collection("temas").doc(postId).update({ likes: currentLikes + 1 });
  };

  window.darLikeComentario = function(postId, replyId, currentLikes) {
      db.collection("temas").doc(postId).collection("respuestas").doc(replyId).update({ likes: currentLikes + 1 });
  };

  window.toggleReplyBox = function(rId) {
      const box = document.getElementById(`reply-box-${rId}`);
      box.style.display = box.style.display === 'flex' ? 'none' : 'flex';
  };

  function escapeHtml(text) {
      if (!text) return '';
      const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
      return text.replace(/[&<>"']/g, function(m) { return map[m]; });
  }
</script>

</body>
</html>
