<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foro - Masajistas Privé</title>
    <!-- Firebase App (compat) y Firestore -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #e0e0e0; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: #1a1a1a; padding: 20px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.7); border: 1px solid #333; }
        h1, h2 { color: #d4af37; text-align: center; }
        .form-group { margin-bottom: 15px; }
        input[type="text"], textarea { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #444; background: #252525; color: #fff; border-radius: 4px; }
        input[type="text"]:focus, textarea:focus { border-color: #d4af37; outline: none; }
        button { background: #d4af37; color: #121212; border: none; padding: 10px 15px; cursor: pointer; border-radius: 4px; font-weight: bold; width: 100%; transition: background 0.2s; }
        button:hover { background: #c5a059; }
        #loading { text-align: center; font-style: italic; color: #888; margin: 20px 0; }
        
        .post { background: #222; padding: 15px; margin-bottom: 20px; border-radius: 6px; border-left: 4px solid #d4af37; }
        .post h3 { margin: 0 0 5px 0; color: #f3e5ab; }
        .post p { margin: 0 0 10px 0; word-break: break-word; color: #ddd; }
        .post small { color: #aaa; }

        .actions-bar { display: flex; gap: 15px; margin-top: 10px; font-size: 0.85em; }
        .like-btn { background: none; border: none; color: #d4af37; cursor: pointer; padding: 0; font-weight: bold; width: auto; display: flex; align-items: center; gap: 4px; }
        .like-btn:hover { color: #f3e5ab; background: none; }

        /* Estilo de comentarios e hilos */
        .comments-section { margin-top: 15px; border-top: 1px solid #333; padding-top: 12px; }
        .comment-item { font-size: 0.9em; margin-bottom: 10px; color: #ccc; word-break: break-word; background: #1c1c1c; padding: 8px; border-radius: 4px; }
        .comment-author { color: #f3e5ab; font-weight: bold; margin-right: 6px; }
        .comment-time { font-size: 0.75em; color: #777; margin-left: 8px; }
        
        .comment-form { margin-top: 10px; display: flex; gap: 6px; }
        .comment-form input { font-size: 0.85em; padding: 6px 10px; background: #1a1a1a; border: 1px solid #444; }
        .comment-btn { width: auto; padding: 6px 12px; font-size: 0.85em; background: #d4af37; color: #121212; white-space: nowrap; }

        /* Caja para responder a un comentario específico */
        .reply-box { margin-top: 6px; display: none; gap: 5px; padding-left: 15px; border-left: 2px solid #d4af37; }
        .reply-trigger { color: #c5a059; cursor: pointer; font-size: 0.8em; background: none; border: none; padding: 0; text-decoration: underline; width: auto; }
        .reply-trigger:hover { color: #f3e5ab; background: none; }
    </style>
</head>
<body>

<div style="text-align: center; margin-bottom: 20px;">
    <img src="img/logo.png" alt="Logo" style="max-height: 80px;">
</div>

<div class="container">
    <h1>Foro Masajistas Privé</h1>
    
    <!-- Formulario para crear un tema -->
    <div class="form-group">
        <h2>Crear nuevo tema</h2>
        <input type="text" id="autorInput" placeholder="Tu nombre o apodo">
    </div>
    <div class="form-group">
        <input type="text" id="tituloInput" placeholder="Título del tema">
    </div>
    <div class="form-group">
        <textarea id="contenidoInput" rows="4" placeholder="Escribí tu mensaje aquí..."></textarea>
    </div>
    <button id="publicarBtn">Publicar Tema</button>

    <hr style="border: 0; border-top: 1px solid #333; margin: 30px 0;">

    <h2>Temas del Foro</h2>
    <div id="loading">Cargando temas...</div>
    <div id="postsContainer"></div>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBDSGPbs_ioH74p-RTctx9av5KKjhnDjBQ",
    authDomain: "masajistasprivepro.firebaseapp.com",
    projectId: "masajistasprivepro",
    storageBucket: "masajistasprivepro.firebasestorage.app",
    messagingSenderId: "768677270509",
    appId: "1:768677270509:web:f4409c2f9c0bbb42ebcde4",
    measurementId: "G-SBN70C32JF"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  const loadingDiv = document.getElementById('loading');
  const postsContainer = document.getElementById('postsContainer');
  const publicarBtn = document.getElementById('publicarBtn');

  // Cargar temas y comentarios en tiempo real
  db.collection("temas").orderBy("fecha", "desc").onSnapshot((snapshot) => {
      loadingDiv.style.display = 'none';
      postsContainer.innerHTML = "";

      if (snapshot.empty) {
          postsContainer.innerHTML = "<p style='text-align: center; color: #888;'>No hay temas publicados todavía. ¡Sé el primero en crear uno!</p>";
          return;
      }

      snapshot.forEach((docSnap) => {
          const data = docSnap.data();
          const postId = docSnap.id;
          const fechaFormateada = data.fecha ? new Date(data.fecha.toDate()).toLocaleString() : 'Hace un momento';
          const likesCount = data.likes || 0;
          
          const postElement = document.createElement('div');
          postElement.className = 'post';
          postElement.innerHTML = `
              <h3>${escapeHtml(data.titulo)}</h3>
              <p>${escapeHtml(data.contenido)}</p>
              <small>Publicado por <b>${escapeHtml(data.autor)}</b> el ${fechaFormateada}</small>
              
              <div class="actions-bar">
                  <button class="like-btn" onclick="darLikePost('${postId}', ${likesCount})">👍 Me gusta (<span id="likes-count-${postId}">${likesCount}</span>)</button>
              </div>

              <div class="comments-section">
                  <div id="comments-${postId}"></div>
                  <div class="comment-form">
                      <input type="text" id="commAuthor-${postId}" placeholder="Nombre" style="flex: 1;">
                      <input type="text" id="commText-${postId}" placeholder="Escribir comentario..." style="flex: 2.5;">
                      <button class="comment-btn" onclick="enviarComentario('${postId}')">Enviar</button>
                  </div>
              </div>
          `;
          postsContainer.appendChild(postElement);

          // Cargar comentarios en tiempo real
          db.collection("temas").doc(postId).collection("respuestas").orderBy("fecha", "asc")
            .onSnapshot((replySnapshot) => {
                const commentsContainer = document.getElementById(`comments-${postId}`);
                commentsContainer.innerHTML = "";

                replySnapshot.forEach((replyDoc) => {
                    const rData = replyDoc.data();
                    const rId = replyDoc.id;
                    const rFecha = rData.fecha ? new Date(rData.fecha.toDate()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
                    const rLikes = rData.likes || 0;
                    
                    const commentDiv = document.createElement('div');
                    commentDiv.className = 'comment-item';
                    commentDiv.innerHTML = `
                        <div>
                            <span class="comment-author">${escapeHtml(rData.autor)}:</span>
                            <span>${escapeHtml(rData.contenido)}</span>
                            <span class="comment-time">${rFecha}</span>
                        </div>
                        <div style="display: flex; gap: 10px; margin-top: 5px; align-items: center;">
                            <button class="like-btn" style="font-size: 0.8em;" onclick="darLikeComentario('${postId}', '${rId}', ${rLikes})">👍 <span id="r-likes-${rId}">${rLikes}</span></button>
                            <button class="reply-trigger" onclick="toggleReplyBox('${rId}')">Responder</button>
                        </div>
                        <div id="reply-box-${rId}" class="reply-box">
                            <input type="text" id="rAuthor-${rId}" placeholder="Nombre" style="flex: 1;">
                            <input type="text" id="rText-${rId}" placeholder="Responder a ${escapeHtml(rData.autor)}..." style="flex: 2;">
                            <button class="comment-btn" onclick="enviarRespuestaAComentario('${postId}', '${rId}', '${escapeHtml(rData.autor)}')">Responder</button>
                        </div>
                    `;
                    commentsContainer.appendChild(commentDiv);
                });
            });
      });
  }, (error) => {
      console.error("Error al cargar los temas: ", error);
      loadingDiv.innerHTML = "Error al conectar con la base de datos.";
  });

  // Publicar tema principal
  publicarBtn.addEventListener('click', () => {
      const autor = document.getElementById('autorInput').value.trim();
      const titulo = document.getElementById('tituloInput').value.trim();
      const contenido = document.getElementById('contenidoInput').value.trim();

      if (!autor || !titulo || !contenido) {
          alert("Por favor completá todos los campos antes de publicar.");
          return;
      }

      publicarBtn.disabled = true;
      publicarBtn.textContent = "Publicando...";

      db.collection("temas").add({
          autor: autor,
          titulo: titulo,
          contenido: contenido,
          likes: 0,
          fecha: firebase.firestore.FieldValue.serverTimestamp()
      })
      .then(() => {
          document.getElementById('tituloInput').value = '';
          document.getElementById('contenidoInput').value = '';
          publicarBtn.disabled = false;
          publicarBtn.textContent = "Publicar Tema";
      })
      .catch((error) => {
          console.error("Error al guardar el tema: ", error);
          alert("Hubo un error al publicar. Intentá nuevamente.");
          publicarBtn.disabled = false;
          publicarBtn.textContent = "Publicar Tema";
      });
  });

  // Dar Me Gusta a un tema
  window.darLikePost = function(postId, currentLikes) {
      db.collection("temas").doc(postId).update({
          likes: currentLikes + 1
      });
  };

  // Dar Me Gusta a un comentario
  window.darLikeComentario = function(postId, replyId, currentLikes) {
      db.collection("temas").doc(postId).collection("respuestas").doc(replyId).update({
          likes: currentLikes + 1
      });
  };

  // Mostrar u ocultar cajita de respuesta individual
  window.toggleReplyBox = function(rId) {
      const box = document.getElementById(`reply-box-${rId}`);
      box.style.display = box.style.display === 'flex' ? 'none' : 'flex';
  };

  // Enviar comentario general
  window.enviarComentario = function(postId) {
      const authorInput = document.getElementById(`commAuthor-${postId}`);
      const textInput = document.getElementById(`commText-${postId}`);
      
      const autor = authorInput.value.trim();
      const contenido = textInput.value.trim();

      if (!autor || !contenido) {
          alert("Ingresá tu nombre y el texto del comentario.");
          return;
      }

      db.collection("temas").doc(postId).collection("respuestas").add({
          autor: autor,
          contenido: contenido,
          likes: 0,
          fecha: firebase.firestore.FieldValue.serverTimestamp()
      })
      .then(() => {
          textInput.value = '';
      })
      .catch((error) => {
          console.error("Error al enviar comentario:", error);
      });
  };

  // Enviar respuesta directa a un comentario (mencionando al usuario)
  window.enviarRespuestaAComentario = function(postId, replyId, targetAuthor) {
      const authorInput = document.getElementById(`rAuthor-${replyId}`);
      const textInput = document.getElementById(`rText-${replyId}`);
      
      const autor = authorInput.value.trim();
      const contenido = textInput.value.trim();

      if (!autor || !contenido) {
          alert("Ingresá tu nombre y tu respuesta.");
          return;
      }

      const contenidoConMencion = `@${targetAuthor} ${contenido}`;

      db.collection("temas").doc(postId).collection("respuestas").add({
          autor: autor,
          contenido: contenidoConMencion,
          likes: 0,
          fecha: firebase.firestore.FieldValue.serverTimestamp()
      })
      .then(() => {
          textInput.value = '';
          document.getElementById(`reply-box-${replyId}`).style.display = 'none';
      })
      .catch((error) => {
          console.error("Error al enviar respuesta:", error);
      });
  };

  function escapeHtml(text) {
      const map = {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#039;'
      };
      return text.replace(/[&<>"']/g, function(m) { return map[m]; });
  }
</script>

</body>
</html>
