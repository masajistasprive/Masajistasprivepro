<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foro & Comunidad | Masajistas Privé</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #0d0d0d; color: #e5e0d8; font-family: 'Montserrat', sans-serif; line-height: 1.6; }
        h1, h2, h3, .logo, .thread-title, .btn-nuevo, .modal-content h3 { font-family: 'Cormorant Garamond', serif; letter-spacing: 1.5px; }
        
        header { 
            background: #141414; 
            border-bottom: 1px solid rgba(223, 194, 133, 0.2); 
            padding: 18px 30px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }
        .logo { 
            color: #dfc285; 
            font-size: 20px; 
            font-weight: 600; 
            text-decoration: none; 
            text-transform: uppercase; 
            letter-spacing: 2px;
        }
        .nav-links { display: flex; gap: 25px; align-items: center; }
        .nav-links a { 
            color: #aaa; 
            text-decoration: none; 
            font-size: 13px; 
            font-weight: 400; 
            letter-spacing: 1px; 
            transition: color 0.3s; 
        }
        .nav-links a:hover, .nav-links a.active { color: #dfc285; }

        .container { max-width: 900px; margin: 30px auto; padding: 0 20px; }
        .foro-header { text-align: center; margin-bottom: 40px; }
        .foro-header h1 { color: #dfc285; font-size: 32px; font-weight: 600; text-transform: uppercase; margin-bottom: 10px; }
        .foro-header p { color: #aaa; font-size: 14px; font-weight: 300; }
        .thread-card { background: #141414; border: 1px solid rgba(223, 194, 133, 0.25); border-radius: 6px; padding: 22px; margin-bottom: 20px; }
        .thread-category { color: #dfc285; font-size: 11px; text-transform: uppercase; letter-spacing: 2px; font-weight: 500; display: block; margin-bottom: 6px; }
        .thread-title { color: #ffffff; font-size: 22px; font-weight: 600; text-decoration: none; display: block; margin-bottom: 10px; }
        .thread-snippet { color: #bcbbb5; font-size: 14px; font-weight: 300; margin-bottom: 15px; }
        .thread-meta { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #777; border-top: 1px solid rgba(255, 255, 255, 0.06); padding-top: 12px; font-weight: 300; }
        
        .btn-nuevo { 
            background: transparent; 
            color: #dfc285; 
            border: 1px solid #dfc285; 
            padding: 10px 22px; 
            border-radius: 4px; 
            font-weight: 600; 
            font-size: 15px; 
            text-transform: uppercase; 
            letter-spacing: 1.5px; 
            margin-bottom: 30px; 
            cursor: pointer; 
            transition: 0.3s; 
        }
        .btn-nuevo:hover { background: #dfc285; color: #0d0d0d; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 1000; padding: 20px; overflow-y: auto; }
        .modal-content { background: #141414; border: 1px solid #dfc285; border-radius: 8px; width: 100%; max-width: 600px; padding: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); max-height: 90vh; overflow-y: auto; }
        .modal-content h3 { color: #dfc285; font-size: 24px; margin-bottom: 20px; text-align: center; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 12px; color: #aaa; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
        .form-control { width: 100%; background: #0d0d0d; border: 1px solid #333; border-radius: 4px; padding: 10px; color: #e5e0d8; font-family: 'Montserrat', sans-serif; font-size: 14px; }
        .form-control:focus { border-color: #dfc285; outline: none; }
        .modal-buttons { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
        .btn-cancelar { background: transparent; color: #aaa; border: 1px solid #444; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-size: 13px; }
        .btn-enviar { background: #dfc285; color: #0d0d0d; border: none; padding: 8px 20px; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 13px; text-transform: uppercase; }
        footer { text-align: center; padding: 30px 20px; color: #666; font-size: 12px; border-top: 1px solid rgba(255,255,255,0.06); margin-top: 50px; font-weight: 300; }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">Masajistas Privé</a>
        <div class="nav-links">
            <a href="index.html">Inicio</a>
            <a href="foro.html" class="active">Foro</a>
        </div>
    </header>

    <div class="container">
        <div class="foro-header">
            <h1>Círculo Privé — Comunidad</h1>
            <p>Un espacio de intercambio exclusivo sobre bienestar, recomendaciones y experiencias con total discreción.</p>
        </div>

        <div style="text-align: right;">
            <button class="btn-nuevo" onclick="abrirModal()">+ Iniciar Debate</button>
        </div>

        <div id="lista-hilos">
            <p style="color: #888; text-align: center; font-size: 14px;">Cargando debates...</p>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="modalDebate">
        <div class="modal-content">
            <h3>Iniciar Nuevo Debate</h3>
            <div>
                <div class="form-group">
                    <label>Tu Seudónimo / Nombre</label>
                    <input type="text" id="inputAutor" class="form-control" placeholder="Ej: Visitante_Discreto" required>
                </div>
                <div class="form-group">
                    <label>Categoría</label>
                    <select id="inputCat" class="form-control">
                        <option value="Recomendaciones & Zonas">Recomendaciones & Zonas</option>
                        <option value="Bienestar & Técnicas">Bienestar & Técnicas</option>
                        <option value="General">General</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Título del Debate</label>
                    <input type="text" id="inputTitulo" class="form-control" placeholder="¿De qué querés hablar?" required>
                </div>
                <div class="form-group">
                    <label>Mensaje o Descripción</label>
                    <textarea id="inputTexto" class="form-control" rows="4" placeholder="Escribí tu consulta o reflexión..." required></textarea>
                </div>
                <div class="modal-buttons">
                    <button type="button" class="btn-cancelar" onclick="cerrarModal()">Cancelar</button>
                    <button type="button" class="btn-enviar" onclick="guardarDebate()">Publicar</button>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Masajistas Privé. Todos los derechos reservados. Espacio exclusivo para adultos.</p>
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBDSGPbs_ioH74p-RTctx9av5KKjhnDjBQ",
            authDomain: "masajistasprivepro.firebaseapp.com",
            projectId: "masajistasprivepro",
            storageBucket: "masajistasprivepro.firebasestorage.app",
            messagingSenderId: "768677270509",
            appId: "1:768677270509:web:f4409c2f9c0bbb42ebcde4",
            measurementId: "G-SBN70C32JF"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.abrirModal = function() {
            document.getElementById('modalDebate').style.display = 'flex';
        }

        window.cerrarModal = function() {
            document.getElementById('modalDebate').style.display = 'none';
        }

        async function cargarForo() {
            const contenedor = document.getElementById('lista-hilos');
            try {
                const querySnapshot = await getDocs(collection(db, "foro_debates"));
                contenedor.innerHTML = '';
                
                if (querySnapshot.empty) {
                    contenedor.innerHTML = '<p style="color: #888; text-align: center; font-size: 14px;">Aún no hay debates creados. ¡Sé el primero en iniciar uno!</p>';
                    return;
                }

                querySnapshot.forEach((doc) => {
                    const item = doc.data();
                    const card = document.createElement('div');
                    card.className = 'thread-card';
                    card.innerHTML = `
                        <span class="thread-category">${item.categoria || 'General'}</span>
                        <a class="thread-title">${item.titulo}</a>
                        <p class="thread-snippet">${item.texto}</p>
                        <div class="thread-meta">
                            <span class="thread-author">Por: ${item.autor}</span>
                            <span>Comunidad Activa</span>
                        </div>
                    `;
                    contenedor.appendChild(card);
                });
            } catch (err) {
                console.error("Error al cargar:", err);
                contenedor.innerHTML = '<p style="color: #ff6b6b; text-align: center; font-size: 14px;">Error al conectar con la base de datos.</p>';
            }
        }

        window.guardarDebate = async function() {
            const autor = document.getElementById('inputAutor').value.trim();
            const categoria = document.getElementById('inputCat').value;
            const titulo = document.getElementById('inputTitulo').value.trim();
            const texto = document.getElementById('inputTexto').value.trim();

            if (!autor || !titulo || !texto) {
                alert("Por favor completá todos los campos.");
                return;
            }

            try {
                await addDoc(collection(db, "foro_debates"), {
                    autor: autor,
                    categoria: categoria,
                    titulo: titulo,
                    texto: texto,
                    fecha: new Date().toISOString()
                });

                document.getElementById('inputAutor').value = '';
                document.getElementById('inputTitulo').value = '';
                document.getElementById('inputTexto').value = '';
                cerrarModal();
                
                cargarForo();
            } catch (err) {
                console.error("Error al guardar:", err);
                alert("No se pudo guardar el debate.");
            }
        }

        cargarForo();
    </script>
</body>
</html>
