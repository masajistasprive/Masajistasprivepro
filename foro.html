<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foro - Masajistas Privé</title>
    <!-- Firebase App (compat) y Firestore -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --champagne: #dfc285;
            --champagne-light: #f5ebd0;
            --bg-dark: #0d0d0e;
            --card-bg: rgba(22, 22, 24, 0.7);
            --box-bg: rgba(28, 28, 30, 0.8);
        }

        body { 
            font-family: 'Montserrat', sans-serif; 
            background: radial-gradient(circle at 50% 0%, #1a1814 0%, #0d0d0e 65%, #080808 100%) !important;
            background-attachment: fixed !important;
            color: #e0e0e0; 
            margin: 0; 
            padding: 20px; 
        }
        
        .container { 
            max-width: 800px; 
            margin: 0 auto; 
            background: var(--card-bg); 
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 25px; 
            border-radius: 12px; 
            box-shadow: 0 15px 40px rgba(0,0,0,0.8); 
            border: 1px solid rgba(223, 194, 133, 0.22); 
        }

        h1, h2 { 
            background: linear-gradient(135deg, #f5ebd0 0%, #dfc285 50%, #b8934f 100%) !important;
            -webkit-background-clip: text !important;
            -webkit-text-fill-color: transparent !important;
            text-align: center; 
            font-family: 'Cormorant Garamond', serif;
            letter-spacing: 1.5px;
        }

        .form-group { margin-bottom: 15px; }
        
        input[type="text"], textarea { 
            width: 100%; 
            padding: 12px 15px; 
            box-sizing: border-box; 
            border: 1px solid rgba(223, 194, 133, 0.3); 
            background: #161618; 
            color: #fff; 
            border-radius: 6px; 
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
        }
        input[type="text"]:focus, textarea:focus { border-color: var(--champagne); outline: none; box-shadow: 0 0 10px rgba(223,194,133,0.2); }
        
        button { 
            background: linear-gradient(135deg, #dfc285, #c5a059); 
            color: #0d0d0d; 
            border: none; 
            padding: 12px 15px; 
            cursor: pointer; 
            border-radius: 6px; 
            font-weight: 600; 
            width: 100%; 
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-size: 12px;
            box-shadow: 0 4px 15px rgba(223,194,133,0.2);
        }
        button:hover { background: var(--champagne-light); transform: translateY(-1px); }
        
        #loading { text-align: center; font-style: italic; color: #888; margin: 20px 0; }
        
        /* Estilo compacto de índice para el listado de temas */
        .post-index-item { 
            background: var(--box-bg); 
            backdrop-filter: blur(8px);
            padding: 16px 18px; 
            margin-bottom: 12px; 
            border-radius: 8px; 
            border-left: 4px solid var(--champagne); 
            border-top: 1px solid rgba(223,194,133,0.15);
            border-right: 1px solid rgba(223,194,133,0.15);
            border-bottom: 1px solid rgba(223,194,133,0.15);
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            gap: 15px; 
            transition: all 0.3s ease; 
        }
        .post-index-item:hover { background: #222226; transform: translateY(-2px); border-color: rgba(223,194,133,0.4); }
        .post-index-info { flex-grow: 1; cursor: pointer; }
        .post-index-info h3 { margin: 0 0 6px 0; color: var(--champagne); font-size: 1.15em; font-family: 'Cormorant Garamond', serif; letter-spacing: 0.5px; }
        .post-index-info small { color: #aaa; font-size: 12px; }

        .post { background: var(--box-bg); padding: 20px; margin-bottom: 20px; border-radius: 8px; border-left: 4px solid var(--champagne); position: relative; border: 1px solid rgba(223,194,133,0.15); }
        .post h2 { margin: 0 0 10px 0; text-align: left; font-size: 1.5em; }
        .post p { margin: 0 0 10px 0; word-break: break-word; color: #ddd; line-height: 1.5; }
        .post small { color: #aaa; }

        .actions-bar { display: flex; gap: 15px; margin-top: 15px; font-size: 0.85em; justify-content: space-between; align-items: center; }
        .like-btn { background: none; border: none; color: var(--champagne); cursor: pointer; padding: 0; font-weight: bold; width: auto; display: flex; align-items: center; gap: 5px; }
        .like-btn:hover { color: var(--champagne-light); background: none; }
        
        .view-btn { background: linear-gradient(135deg, #dfc285, #c5a059); color: #0d0d0d; border: none; padding: 8px 16px; border-radius: 6px; font-size: 12px; cursor: pointer; font-weight: 600; width: auto; white-space: nowrap; text-transform: uppercase; letter-spacing: 1px; }
        .view-btn:hover { background: var(--champagne-light); }

        .back-btn { background: #1a1a1c; color: var(--champagne); border: 1px solid var(--champagne); padding: 8px 16px; margin-bottom: 20px; border-radius: 6px; cursor: pointer; font-weight: 600; width: auto; display: inline-block; text-transform: uppercase; font-size: 11px; letter-spacing: 1px; }
        .back-btn:hover { background: #26262a; }

        .delete-btn { background: none; border: none; color: #ff5555; cursor: pointer; font-size: 0.8em; padding: 0; font-weight: bold; width: auto; float: right; text-transform: uppercase; }
        .delete-btn:hover { color: #ff8888; background: none; }

        .comments-section { margin-top: 20px; border-top: 1px solid rgba(223,194,133,0.2); padding-top: 15px; }
        .comment-item { font-size: 13px; margin-bottom: 12px; color: #ccc; word-break: break-word; background: #161618; padding: 12px; border-radius: 6px; position: relative; border: 1px solid rgba(223,194,133,0.1); border-left: 3px solid var(--champagne); }
        .comment-author { color: var(--champagne); font-weight: bold; margin-right: 6px; }
        .comment-time { font-size: 11px; color: #777; margin-left: 8px; display: block; margin-top: 6px; }
        
        .comment-form { margin-top: 15px; display: flex; flex-direction: column; gap: 10px; }
        .comment-inputs { display: flex; gap: 8px; }
        .comment-inputs input { font-size: 13px; padding: 10px; background: #161618; border: 1px solid rgba(223,194,133,0.3); }
        .comment-btn { width: auto; padding: 10px 18px; font-size: 11px; }

        .emoji-bar { display: flex; gap: 6px; flex-wrap: wrap; background: #161618; padding: 8px; border-radius: 6px; border: 1px solid rgba(223,194,133,0.3); align-items: center; }
        .emoji-btn { background: none; border: none; font-size: 1.2em; cursor: pointer; padding: 2px 6px; width: auto; }
        .emoji-btn:hover { background: #252529; border-radius: 4px; }

        .file-upload-label { color: var(--champagne); cursor: pointer; font-size: 12px; display: inline-flex; align-items: center; justify-content: center; background: rgba(223,194,133,0.1); width: 34px; height: 34px; border-radius: 50%; border: 1px solid rgba(223, 194, 133, 0.4); margin-left: auto; transition: all 0.3s ease; }
        .file-upload-label:hover { background: rgba(223,194,133,0.2); }
        input[type="file"] { display: none; }

        .reply-box { margin-top: 10px; display: none; flex-direction: column; gap: 8px; padding-left: 15px; border-left: 2px solid var(--champagne); }
        .reply-trigger { color: var(--champagne); cursor: pointer; font-size: 12px; background: none; border: none; padding: 0; text-decoration: underline; width: auto; }
        .reply-trigger:hover { color: var(--champagne-light); background: none; }
        
        .msg-media { max-width: 140px; max-height: 140px; border-radius: 6px; margin-top: 8px; display: block; object-fit: cover; background: #000; border: 1px solid rgba(223,194,133,0.3); }
        .post-media { max-width: 100%; max-height: 250px; border-radius: 6px; margin-top: 10px; display: block; object-fit: contain; background: #000; border: 1px solid rgba(223,194,133,0.3); }
        
        .file-preview-text { font-size: 11px; color: var(--champagne); margin-left: 5px; font-style: italic; }

        .admin-footer { text-align: center; margin-top: 30px; font-size: 11px; color: #555; text-transform: uppercase; letter-spacing: 1px; }
        .admin-link { color: #555; text-decoration: none; cursor: pointer; }
        .admin-link:hover { color: var(--champagne); }

        /* Logo Gigante Imponente */
        .logo-foro {
            height: 120px !important;
            max-height: 130px !important;
            width: auto !important;
            object-fit: contain !important;
        }
    </style>
</head>
<body>

<div style="text-align: center; margin-bottom: 20px;">
    <img src="img/logo.png" alt="Logo" class="logo-foro">
</div>

<div class="container">
    <h1>Foro Masajistas Privé</h1>

    <!-- VISTA 1: LISTA DE TEMAS (ÍNDICE COMPACTO) -->
    <div id="listView">
        <div class="form-group">
            <h2>Crear nuevo tema</h2>
            <input type="text" id="autorInput" placeholder="Tu nombre o apodo">
        </div>
        <div class="form-group">
            <input type="text" id="tituloInput" placeholder="Título del tema">
        </div>
        <div class="form-group">
            <textarea id="contenidoInput" rows="4" placeholder="Escribí tu mensaje aquí..."></textarea>
            <div class="emoji-bar" style="margin-top: 8px;">
                <button type="button" class="emoji-btn" onclick="agregarEmoji('contenidoInput', '😊')">😊</button>
                <button type="button" class="emoji-btn" onclick="agregarEmoji('contenidoInput', '👍')">👍</button>
                <button type="button" class="emoji-btn" onclick="agregarEmoji('contenidoInput', '🔥')">🔥</button>
                <button type="button" class="emoji-btn" onclick="agregarEmoji('contenidoInput', '❤️')">❤️</button>
                <button type="button" class="emoji-btn" onclick="agregarEmoji('contenidoInput', '👏')">👏</button>
                <button type="button" class="emoji-btn" onclick="agregarEmoji('contenidoInput', '✨')">✨</button>
                <label class="file-upload-label" title="Adjuntar foto">
                    📎 <input type="file" id="mainImageFile" accept="image/*" onchange="previewFile('mainImageFile', 'mainFileName')">
                </label>
            </div>
            <span id="mainFileName" class="file-preview-text"></span>
        </div>
        <button id="publicarBtn">Publicar Tema</button>

        <hr style="border: 0; border-top: 1px solid rgba(223,194,133,0.2); margin: 30px 0;">

        <h2>Temas del Foro</h2>
        <div id="loading">Cargando temas...</div>
        <div id="postsContainer"></div>
    </div>

    <!-- VISTA 2: HILO INDIVIDUAL -->
    <div id="threadView" style="display: none;">
        <button class="back-btn" onclick="volverAlListado()">← Volver al Foro</button>
        <div id="singlePostContainer"></div>
        
        <div class="comments-section">
            <h3 style="text-align: left; font-size: 1.2em; margin-bottom: 15px;">Comentarios y Respuestas</h3>
            <div id="singleCommentsContainer"></div>
            
            <div class="comment-form">
                <div class="comment-inputs">
                    <input type="text" id="activeAuthor" placeholder="Tu nombre" style="flex: 1;">
                    <input type="text" id="activeCommentText" placeholder="Escribir comentario..." style="flex: 2.5;">
                </div>
                <div class="emoji-bar">
                    <button type="button" class="emoji-btn" onclick="agregarEmoji('activeCommentText', '😊')">😊</button>
                    <button type="button" class="emoji-btn" onclick="agregarEmoji('activeCommentText', '👍')">👍</button>
                    <button type="button" class="emoji-btn" onclick="agregarEmoji('activeCommentText', '🔥')">🔥</button>
                    <button type="button" class="emoji-btn" onclick="agregarEmoji('activeCommentText', '❤️')">❤️</button>
                    <label class="file-upload-label" title="Adjuntar foto">
                        📎 <input type="file" id="activeImageFile" accept="image/*" onchange="previewFile('activeImageFile', 'activeFileName')">
                    </label>
                </div>
                <span id="activeFileName" class="file-preview-text"></span>
                <button class="comment-btn" onclick="enviarComentarioActivo()">Comentar</button>
            </div>
        </div>
    </div>

    <!-- Acceso discreto para administración -->
    <div class="admin-footer">
        <span class="admin-link" onclick="activarAdmin()">Admin</span>
    </div>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBDSGPbs_ioH74p-RTctx9av5KKjhnDjBQ",
    authDomain: "masajistasprivepro.firebaseapp.com",
    projectId: "masajistasprivepro",
    storageBucket: "masajistasprivepro.firebasestorage.app",
    messagingSenderId: "768677270509",
    appId: "1:768677270509:web:f4409c2f9c0bbb42ebcde4",
    measurementId: "G-SBN70C32JF"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  let currentPostId = null;
  let isAdmin = false;

  window.activarAdmin = function() {
      const pass = prompt("Ingresá la contraseña de administrador:");
      if (pass === "martinpalermo09") {
          isAdmin = true;
          sessionStorage.setItem("priveAdmin", "true");
          alert("Modo administrador activado.");
          location.reload();
      } else if (pass !== null) {
          alert("Contraseña incorrecta.");
      }
  };

  if (sessionStorage.getItem("priveAdmin") === "true") {
      isAdmin = true;
  }

  const loadingDiv = document.getElementById('loading');
  const postsContainer = document.getElementById('postsContainer');
  const publicarBtn = document.getElementById('publicarBtn');

  window.agregarEmoji = function(elementId, emoji) {
      const input = document.getElementById(elementId);
      input.value += emoji;
      input.focus();
  };

  window.previewFile = function(inputId, nameId) {
      const input = document.getElementById(inputId);
      const nameSpan = document.getElementById(nameId);
      if (input.files && input.files[0]) {
          nameSpan.textContent = "✓ Archivo adjunto: " + input.files[0].name;
      } else {
          nameSpan.textContent = "";
      }
  };

  function convertImageToBase64(fileInputId, callback) {
      const fileInput = document.getElementById(fileInputId);
      if (!fileInput || !fileInput.files || !fileInput.files[0]) {
          callback(null);
          return;
      }
      const file = fileInput.files[0];
      const reader = new FileReader();
      reader.onload = function(e) {
          const img = new Image();
          img.onload = function() {
              const canvas = document.createElement('canvas');
              let width = img.width;
              let height = img.height;
              const maxDim = 500;
              
              if (width > height && width > maxDim) {
                  height *= maxDim / width;
                  width = maxDim;
              } else if (height > maxDim) {
                  width *= maxDim / height;
                  height = maxDim;
              }
              
              canvas.width = width;
              canvas.height = height;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, width, height);
              callback(canvas.toDataURL('image/jpeg', 0.7));
          };
          img.src = e.target.result;
      };
      reader.readAsDataURL(file);
  }

  db.collection("temas").onSnapshot((snapshot) => {
      loadingDiv.style.display = 'none';
      postsContainer.innerHTML = "";

      if (snapshot.empty) {
          postsContainer.innerHTML = "<p style='text-align: center; color: #888;'>No hay temas publicados todavía. ¡Sé el primero en crear uno!</p>";
          return;
      }

      let docs = [];
      snapshot.forEach((docSnap) => {
          docs.push({ id: docSnap.id, ...docSnap.data() });
      });

      docs.sort((a, b) => {
          let timeA = a.fecha ? a.fecha.toMillis() : 0;
          let timeB = b.fecha ? b.fecha.toMillis() : 0;
          return timeB - timeA;
      });

      docs.forEach((data) => {
          const postId = data.id;
          const fechaFormateada = data.fecha ? new Date(data.fecha.toDate()).toLocaleDateString() : 'Reciente';
          
          let deleteBtnHtml = isAdmin ? `<button class="delete-btn" onclick="borrarTema('${postId}')" style="margin-left: 10px;">🗑️</button>` : '';

          const postElement = document.createElement('div');
          postElement.className = 'post-index-item';
          postElement.innerHTML = `
              <div class="post-index-info" onclick="abrirHilo('${postId}')">
                  <h3>💬 ${escapeHtml(data.titulo)}</h3>
                  <small>Por <b>${escapeHtml(data.autor)}</b> — ${fechaFormateada}</small>
              </div>
              <div style="display: flex; align-items: center;">
                  <button class="view-btn" onclick="abrirHilo('${postId}')">Ver Debate</button>
                  ${deleteBtnHtml}
              </div>
          `;
          postsContainer.appendChild(postElement);
      });
  });

  publicarBtn.addEventListener('click', () => {
      const autor = document.getElementById('autorInput').value.trim();
      const titulo = document.getElementById('tituloInput').value.trim();
      const contenido = document.getElementById('contenidoInput').value.trim();

      if (!autor || !titulo || !contenido) {
          alert("Por favor completá nombre, título y mensaje antes de publicar.");
          return;
      }

      publicarBtn.disabled = true;
      publicarBtn.textContent = "Publicando...";

      convertImageToBase64('mainImageFile', (imageBase64) => {
          db.collection("temas").add({
              autor: autor,
              titulo: titulo,
              contenido: contenido,
              image: imageBase64 || "",
              likes: 0,
              fecha: firebase.firestore.FieldValue.serverTimestamp()
          })
          .then(() => {
              document.getElementById('autorInput').value = '';
              document.getElementById('tituloInput').value = '';
              document.getElementById('contenidoInput').value = '';
              document.getElementById('mainImageFile').value = '';
              document.getElementById('mainFileName').textContent = '';
              publicarBtn.disabled = false;
              publicarBtn.textContent = "Publicar Tema";
          })
          .catch((error) => {
              console.error("Error al guardar el tema: ", error);
              publicarBtn.disabled = false;
              publicarBtn.textContent = "Publicar Tema";
          });
      });
  });

  window.borrarTema = function(postId) {
      if (confirm("¿Estás seguro de eliminar este tema y todas sus respuestas?")) {
          db.collection("temas").doc(postId).delete().then(() => {
              if (currentPostId === postId) {
                  volverAlListado();
              }
          }).catch((error) => {
              console.error("Error al eliminar el tema:", error);
          });
      }
  };

  window.borrarComentario = function(postId, replyId) {
      if (confirm("¿Estás seguro de eliminar este comentario?")) {
          db.collection("temas").doc(postId).collection("respuestas").doc(replyId).delete().catch((error) => {
              console.error("Error al eliminar el comentario:", error);
          });
      }
  };

  window.abrirHilo = function(postId) {
      currentPostId = postId;
      document.getElementById('listView').style.display = 'none';
      document.getElementById('threadView').style.display = 'block';

      db.collection("temas").doc(postId).get().then((doc) => {
          if (doc.exists) {
              const data = doc.data();
              const fechaFormateada = data.fecha ? new Date(data.fecha.toDate()).toLocaleString() : '';
              const likesCount = data.likes || 0;
              let mediaHtml = data.image ? `<img src="${data.image}" class="post-media" alt="Imagen">` : '';
              let deleteBtnHtml = isAdmin ? `<button class="delete-btn" onclick="borrarTema('${postId}')">🗑️ Eliminar tema</button>` : '';

              document.getElementById('singlePostContainer').innerHTML = `
                  <div class="post" style="border-left-color: var(--champagne); margin-bottom: 10px;">
                      ${deleteBtnHtml}
                      <h2>${escapeHtml(data.titulo)}</h2>
                      <p style="font-size: 1.1em;">${escapeHtml(data.contenido)}</p>
                      ${mediaHtml}
                      <small>Publicado por <b>${escapeHtml(data.autor)}</b> el ${fechaFormateada}</small>
                      <div class="actions-bar" style="margin-top: 15px;">
                          <button class="like-btn" onclick="darLikePost('${postId}', ${likesCount})">👍 Me gusta (<span id="likes-count-${postId}">${likesCount}</span>)</button>
                      </div>
                  </div>
              `;
          }
      });

      db.collection("temas").doc(postId).collection("respuestas").onSnapshot((snapshot) => {
          const commentsContainer = document.getElementById('singleCommentsContainer');
          commentsContainer.innerHTML = "";

          if (snapshot.empty) {
              commentsContainer.innerHTML = "<p style='color: #777; font-size: 0.9em;'>No hay comentarios aún. ¡Sé el primero en responder!</p>";
              return;
          }

          let replyDocs = [];
          snapshot.forEach((replyDoc) => {
              replyDocs.push({ id: replyDoc.id, ...replyDoc.data() });
          });

          replyDocs.sort((a, b) => {
              let timeA = a.fecha ? a.fecha.toMillis() : 0;
              let timeB = b.fecha ? b.fecha.toMillis() : 0;
              return timeA - timeB;
          });

          replyDocs.forEach((rData) => {
              const rId = rData.id;
              const rFecha = rData.fecha ? new Date(rData.fecha.toDate()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
              const rLikes = rData.likes || 0;
              let rMedia = rData.image ? `<img src="${rData.image}" class="msg-media" alt="Adjunto">` : '';
              let deleteCommentBtn = isAdmin ? `<button class="delete-btn" onclick="borrarComentario('${postId}', '${rId}')">🗑️ Eliminar</button>` : '';

              const commentDiv = document.createElement('div');
              commentDiv.className = 'comment-item';
              commentDiv.innerHTML = `
                  ${deleteCommentBtn}
                  <div>
                      <span class="comment-author">${escapeHtml(rData.autor)}:</span>
                      <span>${escapeHtml(rData.contenido)}</span>
                      ${rMedia}
                      <span class="comment-time">${rFecha}</span>
                  </div>
                  <div style="display: flex; gap: 15px; margin-top: 8px; align-items: center;">
                      <button class="like-btn" style="font-size: 0.8em;" onclick="darLikeComentario('${postId}', '${rId}', ${rLikes})">👍 <span id="r-likes-${rId}">${rLikes}</span></button>
                      <button class="reply-trigger" onclick="toggleReplyBox('${rId}')">Responder</button>
                  </div>
                  <div id="reply-box-${rId}" class="reply-box">
                      <input type="text" id="rAuthor-${rId}" placeholder="Nombre" style="font-size: 0.85em; padding: 6px;">
                      <input type="text" id="rText-${rId}" placeholder="Responder a ${escapeHtml(rData.autor)}..." style="font-size: 0.85em; padding: 6px;">
                      <label class="file-upload-label" style="font-size:0.8em; width:30px; height:30px;" title="Adjuntar foto">
                          📎 <input type="file" id="rFile-${rId}" accept="image/*" onchange="previewFile('rFile-${rId}', 'rFileName-${rId}')">
                      </label>
                      <span id="rFileName-${rId}" class="file-preview-text"></span>
                      <button class="comment-btn" onclick="enviarRespuestaAComentario('${postId}', '${rId}', '${escapeHtml(rData.autor)}')">Enviar</button>
                  </div>
              `;
              commentsContainer.appendChild(commentDiv);
          });
      });
  };

  window.volverAlListado = function() {
      currentPostId = null;
      document.getElementById('threadView').style.display = 'none';
      document.getElementById('listView').style.display = 'block';
  };

  window.enviarComentarioActivo = function() {
      if (!currentPostId) return;
      const autor = document.getElementById('activeAuthor').value.trim();
      const contenido = document.getElementById('activeCommentText').value.trim();

      if (!autor || !contenido) {
          alert("Ingresá tu nombre y un comentario.");
          return;
      }

      convertImageToBase64('activeImageFile', (imageBase64) => {
          db.collection("temas").doc(currentPostId).collection("respuestas").add({
              autor: autor,
              contenido: contenido,
              image: imageBase64 || "",
              likes: 0,
              fecha: firebase.firestore.FieldValue.serverTimestamp()
          })
          .then(() => {
              document.getElementById('activeCommentText').value = '';
              document.getElementById('activeImageFile').value = '';
              document.getElementById('activeFileName').textContent = '';
          });
      });
  };

  window.enviarRespuestaAComentario = function(postId, replyId, targetAuthor) {
      const autor = document.getElementById(`rAuthor-${replyId}`).value.trim();
      const contenido = document.getElementById(`rText-${replyId}`).value.trim();

      if (!autor || !contenido) {
          alert("Ingresá tu nombre y tu respuesta.");
          return;
      }

      const fileInputId = `rFile-${replyId}`;
      const fileInput = document.getElementById(fileInputId);
      
      const procesarEnvio = (imageBase64) => {
          db.collection("temas").doc(postId).collection("respuestas").add({
              autor: autor,
              contenido: `@${targetAuthor} ${contenido}`,
              image: imageBase64 || "",
              likes: 0,
              fecha: firebase.firestore.FieldValue.serverTimestamp()
          })
          .then(() => {
              document.getElementById(`rText-${replyId}`).value = '';
              fileInput.value = '';
              document.getElementById(`reply-box-${replyId}`).style.display = 'none';
          });
      };

      if (fileInput.files && fileInput.files[0]) {
          convertImageToBase64(fileInputId, procesarEnvio);
      } else {
          procesarEnvio(null);
      }
  };

  window.darLikePost = function(postId, currentLikes) {
      db.collection("temas").doc(postId).update({ likes: currentLikes + 1 });
  };

  window.darLikeComentario = function(postId, replyId, currentLikes) {
      db.collection("temas").doc(postId).collection("respuestas").doc(replyId).update({ likes: currentLikes + 1 });
  };

  window.toggleReplyBox = function(rId) {
      const box = document.getElementById(`reply-box-${rId}`);
      box.style.display = box.style.display === 'flex' ? 'none' : 'flex';
  };

  function escapeHtml(text) {
      if (!text) return '';
      const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
      return text.replace(/[&<>"']/g, function(m) { return map[m]; });
  }
</script>

</body>
</html>
