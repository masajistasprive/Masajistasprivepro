<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Foro General | Masajistas Privé</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body style="background-color: #0d0d0d; color: #e5e0d8; font-family: 'Montserrat', sans-serif; margin: 0; padding: 20px;">

  <div style="max-width: 600px; margin: 0 auto; padding-bottom: 40px;">
    <a href="index.html" style="color: #dfc285; text-decoration: none; font-size: 14px; display: inline-block; margin-bottom: 20px;">← Volver al Inicio</a>
    
    <div class="experiencias-section" style="background-color: #141414; border: 1px solid rgba(223, 194, 133, 0.2); border-radius: 8px; padding: 20px;">
      <h3 style="color: #dfc285; margin-top: 0; border-bottom: 1px solid rgba(223, 194, 133, 0.2); padding-bottom: 10px;">Foro General de Comunidad</h3>
      
      <!-- Contenedor donde se cargan los mensajes en tiempo real -->
      <div id="lista-experiencias" style="margin-bottom: 20px;"></div>
      
      <!-- Formulario del foro -->
      <form id="form-experiencia">
        <div style="margin-bottom: 12px;">
          <input type="text" id="nombre-usuario" placeholder="Tu nombre o apodo" required style="width: 100%; background-color: #0d0d0d; border: 1px solid rgba(223, 194, 133, 0.3); border-radius: 6px; padding: 12px; color: #e5e0d8; font-family: 'Montserrat', sans-serif; box-sizing: border-box;">
        </div>
        
        <div style="margin-bottom: 12px;">
          <textarea id="texto-experiencia" placeholder="Escribe tu mensaje en el foro..." required style="width: 100%; background-color: #0d0d0d; border: 1px solid rgba(223, 194, 133, 0.3); border-radius: 6px; padding: 12px; color: #e5e0d8; font-family: 'Montserrat', sans-serif; min-height: 90px; box-sizing: border-box; resize: vertical;"></textarea>
        </div>
        
        <div>
          <button type="submit" style="width: 100%; background-color: #dfc285; color: #0d0d0d; border: none; border-radius: 6px; padding: 12px; font-weight: 600; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; font-family: 'Montserrat', sans-serif; box-sizing: border-box;">Publicar en el Foro</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Script de Firebase conectado al proyecto -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, addDoc, query, where, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBDSGPbs_ioH74p-RTctx9av5KKjhnDjBQ",
      authDomain: "masajistasprivepro.firebaseapp.com",
      projectId: "masajistasprivepro",
      storageBucket: "masajistasprivepro.firebasestorage.app",
      messagingSenderId: "768677270509",
      appId: "1:768677270509:web:f4409c2f9c0bbb42ebcde4",
      measurementId: "G-SBN70C32JF"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const seccionForo = "foro-general";

    const form = document.getElementById("form-experiencia");
    const lista = document.getElementById("lista-experiencias");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const nombre = document.getElementById("nombre-usuario").value;
      const texto = document.getElementById("texto-experiencia").value;
      
      try {
        await addDoc(collection(db, "experiencias"), {
          perfil: seccionForo,
          autor: nombre,
          comentario: texto,
          fecha: serverTimestamp()
        });
        form.reset();
      } catch (error) {
        console.error("Error al guardar en el foro: ", error);
      }
    });

    const q = query(collection(db, "experiencias"), where("perfil", "==", seccionForo));
    onSnapshot(q, (snapshot) => {
      lista.innerHTML = "";
      if (snapshot.empty) {
        lista.innerHTML = "<p style='color: #888; font-size: 13px; text-align: center;'>Aún no hay mensajes. ¡Sé el primero en escribir!</p>";
        return;
      }
      snapshot.forEach((doc) => {
        const data = doc.data();
        const div = document.createElement("div");
        div.style.cssText = "background: #0d0d0d; border: 1px solid rgba(223, 194, 133, 0.1); padding: 12px; border-radius: 6px; margin-bottom: 10px;";
        div.innerHTML = `<strong style="color: #dfc285; display: block; margin-bottom: 4px;">${data.autor || "Anónimo"}</strong><p style="margin: 0; color: #ddd; font-size: 14px;">${data.comentario}</p>`;
        lista.appendChild(div);
      });
    });
  </script>
</body>
</html>
