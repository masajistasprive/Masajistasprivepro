    <!-- Firebase y Lógica -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBDSGPbs_ioH74p-RTctx9av5KKjhnDjBQ",
            authDomain: "masajistasprivepro.firebaseapp.com",
            projectId: "masajistasprivepro",
            storageBucket: "masajistasprivepro.firebasestorage.app",
            messagingSenderId: "768677270509",
            appId: "1:768677270509:web:f4409c2f9c0bbb42ebcde4",
            measurementId: "G-SBN70C32JF"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let hiloActualId = null;

        window.abrirModalCrear = function() { document.getElementById('modalCrear').style.display = 'flex'; }
        window.cerrarModalCrear = function() { document.getElementById('modalCrear').style.display = 'none'; }
        window.cerrarModalHilo = function() { document.getElementById('modalHilo').style.display = 'none'; }

        window.publicarDebate = async function(event) {
            event.preventDefault();
            const autor = document.getElementById('autorDebate').value;
            const categoria = document.getElementById('catDebate').value;
            const titulo = document.getElementById('tituloDebate').value;
            const texto = document.getElementById('textoDebate').value;

            try {
                await addDoc(collection(db, "foro_debates"), {
                    autor: autor,
                    categoria: categoria,
                    titulo: titulo,
                    texto: texto,
                    fecha: serverTimestamp()
                });
                document.getElementById('formDebate').reset();
                cerrarModalCrear(); // <--- Esto cierra la ventana al terminar
            } catch (error) {
                console.error("Error al crear debate: ", error);
                alert("Hubo un error al publicar. Verificá tu conexión.");
            }
        };

        window.abrirHilo = function(id, titulo, texto, autor, categoria) {
            hiloActualId = id;
            document.getElementById('hiloIdActual').value = id;
            document.getElementById('hiloCatModal').innerText = categoria;
            document.getElementById('hiloTituloModal').innerText = titulo;
            document.getElementById('hiloTextoModal').innerText = texto;
            document.getElementById('hiloAutorModal').innerText = autor;

            document.getElementById('modalHilo').style.display = 'flex';
            cargarRespuestasFirebase(id);
        }

        function cargarRespuestasFirebase(hiloId) {
            const contenedor = document.getElementById('contenedorRespuestas');
            contenedor.innerHTML = '<p style="color: #666; font-size: 13px;">Cargando respuestas...</p>';

            onSnapshot(collection(db, "foro_debates", hiloId, "respuestas"), (snapshot) => {
                contenedor.innerHTML = '';
                if (snapshot.empty) {
                    contenedor.innerHTML = '<p style="color: #666; font-size: 13px; font-style: italic;">Aún no hay comentarios. Sé el primero en responder.</p>';
                    return;
                }

                snapshot.forEach((docR) => {
                    const r = docR.data();
                    const div = document.createElement('div');
                    div.className = 'respuesta-card';
                    div.innerHTML = `
                        <div class="respuesta-meta">
                            <span style="color: #dfc285; font-weight: bold;">${r.autor || 'Anónimo'}</span>
                            <span>Hace un momento</span>
                        </div>
                        <div>${r.texto}</div>
                    `;
                    contenedor.appendChild(div);
                });
            });
        }

        window.enviarRespuesta = async function(event) {
            event.preventDefault();
            const autor = document.getElementById('autorRespuesta').value;
            const texto = document.getElementById('textoRespuesta').value;

            if (!hiloActualId) return;

            try {
                await addDoc(collection(db, "foro_debates", hiloActualId, "respuestas"), {
                    autor: autor,
                    texto: texto,
                    fecha: serverTimestamp()
                });
                document.getElementById('autorRespuesta').value = '';
                document.getElementById('textoRespuesta').value = '';
            } catch (error) {
                console.error("Error al enviar respuesta: ", error);
            }
        };

        // Escuchar debates en tiempo real
        onSnapshot(collection(db, "foro_debates"), (snapshot) => {
            const lista = document.getElementById('lista-hilos');
            lista.innerHTML = '';

            if (snapshot.empty) {
                lista.innerHTML = '<p style="color: #888; text-align: center; font-size: 14px;">Aún no hay debates creados. ¡Sé el primero en iniciar uno!</p>';
                return;
            }

            snapshot.forEach((docH) => {
                const h = docH.data();
                const idH = docH.id;

                const tarjeta = document.createElement('div');
                tarjeta.className = 'thread-card';
                tarjeta.innerHTML = `
                    <span class="thread-category">${h.categoria || 'General'}</span>
                    <a class="thread-title" onclick="abrirHilo('${idH}', '${h.titulo.replace(/'/g, "\\'")}', '${h.texto.replace(/'/g, "\\'")}', '${h.autor}', '${h.categoria}')">${h.titulo}</a>
                    <p class="thread-snippet">${h.texto}</p>
                    <div class="thread-meta">
                        <span class="thread-author">Por: ${h.autor}</span>
                        <span>Comunidad Activa</span>
                    </div>
                `;
                lista.appendChild(tarjeta);
            });
        });
    </script>
