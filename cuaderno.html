<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0a09"><meta name="description" content="Cuaderno Privé: lecturas sobre masajes, relax, sensualidad elegante y bienestar."><title>Cuaderno Privé | Masajistas Privé</title><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#0b0a09;color:#e9e2d6;font-family:Montserrat,sans-serif}header,main,footer{max-width:940px;margin:auto;padding:22px 18px}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #4c3c28}a{color:#dfc285}header a{text-decoration:none;font-size:12px}h1,h2{font-family:'Cormorant Garamond',serif;color:#dfc285}h1{font-size:clamp(36px,7vw,58px);margin:22px 0 6px}.sub{color:#a9a198;line-height:1.7}.eyebrow{color:#dfc285;font-size:11px;letter-spacing:2px;text-transform:uppercase}.feature,.entry{border:1px solid #4d3e29;background:#13110e;border-radius:12px;padding:23px;margin:18px 0}.feature h2{font-size:clamp(29px,5vw,42px);margin:12px 0}.feature p,.entry p{line-height:1.85}.entry{padding:16px 20px}.entry h2{font-size:26px;margin:8px 0}.btn{display:inline-block;border:1px solid #dfc285;border-radius:6px;padding:10px 15px;text-decoration:none;color:#dfc285;background:transparent;cursor:pointer;font:inherit;font-size:13px}#full{white-space:pre-line;line-height:1.95}.muted{color:#a9a198;font-size:12px}footer{border-top:1px solid #4c3c28;color:#8c8274;font-size:12px}</style><script src="/js/analytics-prive.js?v=20261029-medicion1"></script>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-DXX740HP41"></script></head><body><header><a href="index.html">← MASAJISTAS PRIVÉ</a><span class="eyebrow">EDICIÓN DIGITAL</span></header><main><h1>Cuaderno Privé</h1><p class="sub">Historias, ideas y rituales sobre el placer de desconectar.</p><section id="featured" class="feature" aria-live="polite"><p class="muted">Cargando publicaciones…</p></section><h2>Ediciones anteriores</h2><div id="history"></div></main><footer>Contenido editorial informativo para adultos. No sustituye consejo médico profesional.</footer><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function run(){const f=document.getElementById('featured'),h=document.getElementById('history');try{const r=await fetch('cuaderno/indice.json',{cache:'no-store'});if(!r.ok)throw Error('No hay publicaciones');const list=await r.json();if(!Array.isArray(list)||!list.length)throw Error('Aún no hay publicaciones');f.innerHTML=`<div class="eyebrow">ARTÍCULO MÁS RECIENTE · ${esc(list[0].fecha)}</div><h2>${esc(list[0].titulo)}</h2><p>${esc(list[0].bajada)}</p><button class="btn" data-date="${esc(list[0].fecha)}">Leer artículo →</button><div id="full" hidden></div>`;h.innerHTML=list.slice(1).map(a=>`<article class="entry"><span class="eyebrow">${esc(a.categoria)} · ${esc(a.fecha)}</span><h2>${esc(a.titulo)}</h2><p>${esc(a.bajada)}</p><button class="btn" data-date="${esc(a.fecha)}">Leer artículo →</button></article>`).join('');}catch(e){f.innerHTML='<p>Cuaderno Privé está preparando sus próximas publicaciones.</p>';h.textContent='';}}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-date]');if(!b)return;const date=b.dataset.date;if(!/^\d{4}-\d{2}-\d{2}$/.test(date))return;b.disabled=true;try{const r=await fetch(`cuaderno/articulos/${date}.json`);if(!r.ok)throw Error();const a=await r.json();const box=document.createElement('div');box.className='entry';const title=document.createElement('h2');title.textContent=a.titulo;const p=document.createElement('p');p.id='full';p.textContent=a.contenido;box.append(title,p);const existing=document.getElementById('lectura');if(existing)existing.remove();box.id='lectura';document.querySelector('main').append(box);box.scrollIntoView({behavior:'smooth'});}catch{alert('No se pudo abrir el artículo.');}finally{b.disabled=false;}});run();</script></body></html>
