<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Perfiles - Masajistas Privé</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0b0b;
            --card-bg: #141414;
            --gold: #d4af37;
            --gold-light: #f3e5ab;
            --text-main: #f5f5f5;
            --text-muted: #aaaaaa;
            --success: #2ecc71;
        }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 20px; font-family: 'Plus Jakarta Sans', sans-serif; }
        .container-gen { max-width: 800px; margin: 0 auto; background: var(--card-bg); border: 1px solid #222; border-radius: 12px; padding: 30px; box-shadow: 0 4px 20px rgba(0,0,0,0.6); }
        h1 { color: var(--gold); font-size: 1.5rem; text-transform: uppercase; margin-bottom: 20px; border-bottom: 1px solid #222; padding-bottom: 10px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 5px; }
        input, textarea { width: 100%; padding: 10px; background-color: #1f1f1f; border: 1px solid #333; border-radius: 6px; color: var(--text-main); font-size: 1rem; }
        input:focus, textarea:focus { outline: none; border-color: var(--gold); }
        textarea { resize: vertical; height: 90px; }
        .btn-action { background-color: var(--gold); color: #000; border: none; width: 100%; padding: 12px; font-weight: bold; border-radius: 6px; cursor: pointer; text-transform: uppercase; margin-top: 15px; transition: background 0.3s; }
        .btn-action:hover { background-color: var(--gold-light); }
        .output-section { margin-top: 25px; display: none; }
        textarea.code-output { background-color: #111; color: var(--success); font-family: monospace; font-size: 0.85rem; height: 220px; border: 1px solid #333; }
        .hint { font-size: 0.85rem; color: var(--gold); margin-bottom: 10px; }
        .back-link { color: var(--text-muted); text-decoration: none; font-size: 0.9rem; float: right; }
        .back-link:hover { color: var(--gold); }
    </style>
</head>
<body>

    <div class="container-gen">
        <a href="admin.html" class="back-link">&larr; Volver al Panel</a>
        <h1>Generador de Fichas Pro</h1>
        
        <form id="genForm">
            <div class="form-group">
                <label for="nombre">Nombre de la Profesional</label>
                <input type="text" id="nombre" placeholder="Ej: Valentina" required>
            </div>
            <div class="form-group">
                <label for="zona">Zona / Barrio</label>
                <input type="text" id="zona" placeholder="Ej: Recoleta" required>
            </div>
            <div class="form-group">
                <label for="modalidad">Modalidad</label>
                <input type="text" id="modalidad" value="Departamento propio" required>
            </div>
            <div class="form-group">
                <label for="whatsapp">WhatsApp (número con código de país y área sin símbolos)</label>
                <input type="text" id="whatsapp" placeholder="Ej: 5491112345678" required>
            </div>
            <div class="form-group">
                <label for="prefijoFoto">Prefijo de las fotos (ej: si tus fotos son valentina1.jpg, poné 'valentina')</label>
                <input type="text" id="prefijoFoto" placeholder="Ej: valentina" required>
            </div>
            <div class="form-group">
                <label for="bio">Biografía y Servicios</label>
                <textarea id="bio" placeholder="Te invito a vivir una experiencia de relajación única..." required></textarea>
            </div>
            <div class="form-group">
                <label for="horarios">Horarios</label>
                <input type="text" id="horarios" value="Lunes a sábados de 9 a 21 hs." required>
            </div>

            <button type="submit" class="btn-action">Generar Código de la Ficha</button>
        </form>

        <div class="output-section" id="outputSection">
            <p class="hint">Copiá este código, creá un archivo nuevo con el nombre <span id="fileNameDisplay" style="color:#fff"></span> y subilo a tu GitHub:</p>
            <textarea class="code-output" id="codeOutput" readonly></textarea>
            <button type="button" class="btn-action" id="btnCopiar" style="background-color: #333; color: #fff;">Copiar al Portapapeles</button>
        </div>
    </div>

    <!-- Plantilla HTML separada para evitar errores de sintaxis en JS -->
    <script type="text/template" id="plantillaFicha"><![CDATA[<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{nombre}} | Masajistas Privé</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="perfil-body">

    <header class="header-prive">
        <div class="header-left">
            <img src="img/monograma.png" alt="Monograma" class="header-monograma">
        </div>
        <div class="header-center">
            <img src="img/logo.png" alt="Masajistas Privé" class="header-logo-grande">
        </div>
        <div class="header-right">
            <a href="index.html" class="btn-buscar">← Volver</a>
        </div>
    </header>

    <main class="container perfil-container">
        <div class="perfil-galeria-grid">
            <img src="img/{{prefijo}}1.jpg" alt="{{nombre}}" class="foto-principal" id="fotoPrincipal">
            <div class="galeria-miniaturas">
                <img src="img/{{prefijo}}1.jpg" alt="{{nombre}} 1" onclick="cambiarFoto(this)">
                <img src="img/{{prefijo}}2.jpg" alt="{{nombre}} 2" onclick="cambiarFoto(this)">
                <img src="img/{{prefijo}}3.jpg" alt="{{nombre}} 3" onclick="cambiarFoto(this)">
                <img src="img/{{prefijo}}4.jpg" alt="{{nombre}} 4" onclick="cambiarFoto(this)">
            </div>
        </div>

        <div class="perfil-info">
            <div class="perfil-titulo-seccion">
                <h2>{{nombre}}</h2>
                <span class="badge-verificado">✓ Privé Verificado</span>
            </div>

            <p class="perfil-ubicacion">📍 Zona: <strong>{{zona}}</strong></p>
            <p class="perfil-modalidad">🏠 Modalidad: <strong>{{modalidad}}</strong></p>

            <div class="perfil-descripcion">
                <h3>Sobre mí y Servicios</h3>
                <p>{{bio}}</p>
            </div>

            <div class="perfil-detalles">
                <div class="detalle-item">
                    <span>Horarios:</span> {{horarios}}
                </div>
            </div>

            <a href="https://wa.me/{{whatsapp}}?text=Hola%20{{nombreEnc}},%20vi%20tu%20perfil%20en%20Masajistas%20Privé" target="_blank" rel="noopener noreferrer" class="btn-whatsapp">
                💬 Contactar por WhatsApp
            </a>
        </div>

        <div id="seccion-comentarios"></div>
    </main>

    <footer class="footer">
        <p>Este es un sitio para adultos (+18). Las anunciantes no tienen vínculo laboral con el portal.</p>
        <p class="copyright">© 2026 Masajistas Privé. Todos los derechos reservados.</p>
    </footer>

    <script>
        function cambiarFoto(element) {
            var fotoPrincipal = document.getElementById("fotoPrincipal");
            fotoPrincipal.src = element.src;
        }
    </script>
    <script src="comentarios.js"></script>
</body>
</html>]]></script>

    <script>
        document.getElementById('genForm').addEventListener('submit', function(e) {
            e.preventDefault();

            var nombre = document.getElementById('nombre').value.trim();
            var zona = document.getElementById('zona').value.trim();
            var modalidad = document.getElementById('modalidad').value.trim();
            var whatsapp = document.getElementById('whatsapp').value.trim();
            var prefijo = document.getElementById('prefijoFoto').value.trim().toLowerCase();
            var bio = document.getElementById('bio').value.trim();
            var horarios = document.getElementById('horarios').value.trim();

            var fileName = nombre.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, '') + '.html';
            document.getElementById('fileNameDisplay').textContent = fileName;

            var template = document.getElementById('plantillaFicha').innerHTML;
            
            var resultado = template
                .replace('<![CDATA[', '').replace(']]>', '')
                .replace(/\{\{nombre\}\}/g, nombre)
                .replace(/\{\{nombreEnc\}\}/g, encodeURIComponent(nombre))
                .replace(/\{\{zona\}\}/g, zona)
                .replace(/\{\{modalidad\}\}/g, modalidad)
                .replace(/\{\{whatsapp\}\}/g, whatsapp)
                .replace(/\{\{prefijo\}\}/g, prefijo)
                .replace(/\{\{bio\}\}/g, bio)
                .replace(/\{\{horarios\}\}/g, horarios);

            document.getElementById('codeOutput').value = resultado;
            var outputSec = document.getElementById('outputSection');
            outputSec.style.display = 'block';
            outputSec.scrollIntoView({ behavior: 'smooth' });
        });

        document.getElementById('btnCopiar').addEventListener('click', function() {
            var codeBox = document.getElementById('codeOutput');
            codeBox.select();
            document.execCommand('copy');
            this.textContent = '¡Copiado al portapapeles!';
            var btn = this;
            setTimeout(function() { btn.textContent = 'Copiar al Portapapeles'; }, 2000);
        });
    </script>
</body>
</html>
