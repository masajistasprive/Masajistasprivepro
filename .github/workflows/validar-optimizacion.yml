name: Validar optimizaciones Privé
on:
  pull_request:
    paths:
      - 'index.html'
      - 'perfil.html'
      - 'js/votos-visibles.js'
      - 'tests/**'
      - '.github/workflows/validar-optimizacion.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validacion-estatica:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ejecutar pruebas
        run: node tests/optimizacion.test.cjs
      - name: Probar sincronización de votos
        run: node tests/votos.test.cjs
      - name: Instalar navegador de pruebas
        run: |
          npm install --prefix qa --no-save --ignore-scripts --no-audit --no-fund playwright@1.58.2
          qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Probar navegación en escritorio y móvil sin datos reales
        run: node tests/navegacion.cjs
