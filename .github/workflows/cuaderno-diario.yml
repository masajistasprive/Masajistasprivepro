name: Cuaderno Prive Diario

on:
  schedule:
    - cron: '15 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cuaderno-prive-diario
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: python -m pip install requests

      - name: Generar articulo
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -f scripts/publicar.py ]; then
            python scripts/publicar.py
          elif [ -f publicar.py ]; then
            python publicar.py
          else
            echo "No se encontro publicar.py"
            exit 1
          fi

      - name: Guardar articulos nuevos
        run: |
          git config user.name "Cuaderno Prive Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No hay articulos nuevos"
          else
            git commit -m "Cuaderno Prive: actualizacion diaria"
            git push
          fi
  
