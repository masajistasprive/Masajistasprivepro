name: Cuaderno Prive Diario

on:
  schedule:
    # 07:15 de Buenos Aires (UTC-3), con reintentos a las 08:15, 09:15, 10:15, 12:15 y 14:15.
    # Si ya existe el artículo del día, publicar.py no lo duplica.
    - cron: '15 10,11,12,13,15,17 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: cuaderno-prive-diario
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: python -m pip install requests

      - name: Generar articulo
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -f scripts/publicar.py ]; then
            python scripts/publicar.py
          elif [ -f publicar.py ]; then
            python publicar.py
          else
            echo "No se encontro publicar.py"
            exit 1
          fi

      - name: Guardar articulos nuevos
        run: |
          git config user.name "Cuaderno Prive Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- cuaderno/articulos cuaderno/indice.json
          if git diff --cached --quiet; then
            echo "No hay articulos nuevos"
          else
            git commit -m "Cuaderno Prive: actualizacion diaria"
            git pull --rebase origin main
            git push
          fi
  


      # Un push con GITHUB_TOKEN no dispara Pages automáticamente.
      # Se solicita reconstruir el sitio existente, sin cambiar su hosting ni dominio.
      - name: Actualizar sitio publicado
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
