<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Caja y Vencimientos - Masajistas Privé</title>
    <style>
        :root {
            --bg-color: #0b0b0b;
            --card-bg: #141414;
            --gold: #dfc285;
            --gold-light: #f3e5ab;
            --text-main: #f5f5f5;
            --text-muted: #aaaaaa;
            --danger: #e74c3c;
            --success: #2ecc71;
            --danger-bg: rgba(231, 76, 60, 0.15);
            --success-bg: rgba(46, 204, 113, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', 'Segoe UI', Tahoma, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 15px;
        }

        .container {
            max-width: 950px;
            margin: 0 auto;
        }

        /* Pantalla de Login */
        #loginOverlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--bg-color);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000;
        }

        .login-card {
            background-color: var(--card-bg);
            border: 1px solid var(--gold);
            border-radius: 12px;
            padding: 30px;
            width: 100%;
            max-width: 360px;
            text-align: center;
            box-shadow: 0 4px 25px rgba(223, 194, 133, 0.15);
        }

        .login-card h2 {
            color: var(--gold);
            margin-bottom: 20px;
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: 'Cormorant Garamond', serif;
        }

        .main-content {
            display: none;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(223, 194, 133, 0.2);
            padding-bottom: 15px;
        }

        h1 {
            color: var(--gold);
            font-size: 1.3rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-family: 'Cormorant Garamond', serif;
        }

        .back-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: var(--gold);
        }

        /* Tarjeta de Resumen */
        .card-summary {
            background: linear-gradient(135deg, #1a1a1a, #111);
            border: 1px solid var(--gold);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.6);
        }

        .summary-title {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 5px;
        }

        .summary-amount {
            font-size: 2rem;
            color: var(--gold-light);
            font-weight: bold;
            font-family: 'Cormorant Garamond', serif;
        }

        /* Formulario de Carga */
        .form-card {
            background-color: var(--card-bg);
            border: 1px solid rgba(223, 194, 133, 0.25);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }

        .form-card h2 {
            font-size: 1rem;
            color: var(--gold);
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            background-color: #1a1a1a;
            border: 1px solid #333;
            border-radius: 6px;
            color: var(--text-main);
            font-size: 0.9rem;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--gold);
        }

        .btn-submit {
            background: linear-gradient(135deg, #dfc285, #c5a059);
            color: #000;
            border: none;
            width: 100%;
            padding: 12px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: opacity 0.3s;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 5px;
        }

        .btn-submit:hover {
            opacity: 0.9;
        }

        .btn-reset {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid #444;
            padding: 8px 15px;
            font-size: 0.75rem;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s;
            margin-bottom: 15px;
        }

        .btn-reset:hover {
            border-color: var(--danger);
            color: var(--danger);
        }

        .error-msg {
            color: var(--danger);
            font-size: 0.8rem;
            margin-top: 8px;
            display: none;
        }

        /* Listado de Anunciantes */
        .transactions-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .transactions-section h2 {
            font-size: 1rem;
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .table-responsive {
            overflow-x: auto;
            border-radius: 10px;
            border: 1px solid #222;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: var(--card-bg);
            white-space: nowrap;
        }

        th, td {
            padding: 12px 14px;
            text-align: left;
            font-size: 0.85rem;
        }

        th {
            background-color: #1a1a1a;
            color: var(--gold);
            border-bottom: 1px solid #333;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
        }

        tr:not(:last-child) td {
            border-bottom: 1px solid #1f1f1f;
        }

        .status-badge {
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: inline-block;
            text-align: center;
        }

        .status-activo {
            background-color: var(--success-bg);
            color: var(--success);
            border: 1px solid rgba(46, 204, 113, 0.3);
        }

        .status-vencido {
            background-color: var(--danger-bg);
            color: var(--danger);
            border: 1px solid rgba(231, 76, 60, 0.3);
            animation: pulseVencido 2s infinite;
        }

        @keyframes pulseVencido {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }

        .amount-col {
            color: var(--success);
            font-weight: bold;
        }

        .btn-delete {
            background: none;
            border: none;
            color: var(--danger);
            cursor: pointer;
            font-size: 0.8rem;
            transition: opacity 0.2s;
        }

        .btn-delete:hover {
            opacity: 0.7;
        }

        .empty-state {
            text-align: center;
            padding: 30px;
            color: var(--text-muted);
            font-style: italic;
        }
    </style>
</head>
<body>

    <!-- Pantalla de Ingreso por Contraseña -->
    <div id="loginOverlay">
        <div class="login-card">
            <h2>Acceso Restringido</h2>
            <form id="loginForm">
                <div class="form-group" style="text-align: left;">
                    <label for="passwordInput">Contraseña de Caja</label>
                    <input type="password" id="passwordInput" placeholder="Ingresá tu clave" required>
                </div>
                <button type="submit" class="btn-submit">Ingresar</button>
                <div class="error-msg" id="errorMsg">Contraseña incorrecta</div>
            </form>
        </div>
    </div>

    <!-- Contenido Principal -->
    <div class="container main-content" id="mainContent">
        <header>
            <h1>Control de Caja y Vencimientos</h1>
            <a href="admin.html" class="back-link">&larr; Volver al Panel</a>
        </header>

        <!-- Resumen de Ingresos -->
        <div class="card-summary">
            <div class="summary-title">Total Recaudado (Registrado)</div>
            <div class="summary-amount" id="totalIngresos">$0</div>
        </div>

        <!-- Formulario de Carga -->
        <div class="form-card">
            <h2>Registrar Nuevo Perfil / Pago</h2>
            <form id="cajaForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="nombre">Nombre de la Modelo</label>
                        <input type="text" id="nombre" placeholder="Ej: Jennyfer" required>
                    </div>
                    <div class="form-group">
                        <label for="zona">Barrio / Zona</label>
                        <input type="text" id="zona" placeholder="Ej: Tribunales" required>
                    </div>
                    <div class="form-group">
                        <label for="categoria">Categoría</label>
                        <select id="categoria" required>
                            <option value="TERAPEUTICAS">Terapéuticas ($50k)</option>
                            <option value="SENSUALES">Sensuales ($70k)</option>
                            <option value="FANTASIAS">Fantasías ($100k)</option>
                            <option value="MASCULINOS">Masculinos ($50k)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="monto">Monto Pagado ($)</label>
                        <input type="number" id="monto" placeholder="Ej: 50000" required>
                    </div>
                    <div class="form-group">
                        <label for="vencimiento">Fecha de Vencimiento</label>
                        <input type="date" id="vencimiento" required>
                    </div>
                </div>
                <button type="submit" class="btn-submit" style="margin-top: 15px;">Guardar Registro</button>
            </form>
        </div>

        <div class="transactions-section">
            <h2>Estado de Anunciantes</h2>
            <button class="btn-reset" onclick="restaurarDatosExcel()">Restaurar Planilla Original</button>
        </div>

        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Zona</th>
                        <th>Categoría</th>
                        <th>Vencimiento</th>
                        <th>Estado</th>
                        <th>Monto</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="tablaMovimientos">
                    <!-- Se llena con JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const CLASE_PASSWORD = "081101";

        const loginForm = document.getElementById('loginForm');
        const passwordInput = document.getElementById('passwordInput');
        const loginOverlay = document.getElementById('loginOverlay');
        const mainContent = document.getElementById('mainContent');
        const errorMsg = document.getElementById('errorMsg');

        if (sessionStorage.getItem('caja_autenticada') === 'true') {
            loginOverlay.style.display = 'none';
            mainContent.style.display = 'block';
        }

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            if (passwordInput.value === CLASE_PASSWORD) {
                sessionStorage.setItem('caja_autenticada', 'true');
                loginOverlay.style.display = 'none';
                mainContent.style.display = 'block';
            } else {
                errorMsg.style.display = 'block';
                passwordInput.value = '';
            }
        });

        // Datos originales basados en tu planilla de Excel
        const datosInicialesExcel = [
            { nombre: "JENNYFER", zona: "TRIBUNALES", categoria: "TERAPEUTICAS", vencimiento: "2026-10-01", monto: 0 },
            { nombre: "DEBY", zona: "CABALLITO", categoria: "SENSUALES", vencimiento: "2026-10-01", monto: 0 },
            { nombre: "PRADA", zona: "TRIBUNALES", categoria: "TERAPEUTICAS", vencimiento: "2026-11-01", monto: 50000 },
            { nombre: "PAMELA", zona: "TRIBUNALES", categoria: "SENSUALES", vencimiento: "2026-10-15", monto: 0 },
            { nombre: "LUPITA", zona: "TRIBUNALES", categoria: "SENSUALES", vencimiento: "2026-10-01", monto: 50000 },
            { nombre: "SOL", zona: "TRIBUNALES", categoria: "SENSUALES", vencimiento: "2026-10-02", monto: 0 },
            { nombre: "MATIAS", zona: "RECOLETA", categoria: "MASCULINOS", vencimiento: "2026-10-01", monto: 0 },
            { nombre: "DANIELA", zona: "MICROCENTRO", categoria: "TERAPEUTICAS", vencimiento: "2026-10-02", monto: 0 },
            { nombre: "ZARIA", zona: "CABALLITO", categoria: "TERAPEUTICAS", vencimiento: "2026-10-02", monto: 0 },
            { nombre: "DONATELLA", zona: "CABA", categoria: "SENSUALES", vencimiento: "2026-10-03", monto: 0 },
            { nombre: "MARIELA", zona: "CONGRESO", categoria: "TERAPEUTICAS", vencimiento: "2026-10-04", monto: 0 },
            { nombre: "MIA", zona: "CONGRESO", categoria: "SENSUALES", vencimiento: "2026-10-04", monto: 0 },
            { nombre: "CELESTE", zona: "TRIBUNALES", categoria: "SENSUALES", vencimiento: "2026-10-08", monto: 0 },
            { nombre: "LULY", zona: "CABA", categoria: "SENSUALES", vencimiento: "2026-10-22", monto: 0 },
            { nombre: "LULY", zona: "CABA", categoria: "TERAPEUTICAS", vencimiento: "2026-10-22", monto: 0 },
            { nombre: "MORA", zona: "TRIBUNALES", categoria: "TERAPEUTICAS", vencimiento: "2026-10-23", monto: 50000 },
            { nombre: "MORA", zona: "TRIBUNALES", categoria: "SENSUALES", vencimiento: "2026-10-23", monto: 50000 },
            { nombre: "RENATA", zona: "PTO MADERO", categoria: "SENSUALES", vencimiento: "2026-10-26", monto: 50000 }
        ];

        let registros = JSON.parse(localStorage.getItem('prive_control_modelos'));
        if (!registros || registros.length === 0) {
            registros = datosInicialesExcel;
            localStorage.setItem('prive_control_modelos', JSON.stringify(registros));
        }

        const selectCat = document.getElementById('categoria');
        const inputMonto = document.getElementById('monto');
        
        selectCat.addEventListener('change', () => {
            if(selectCat.value === 'TERAPEUTICAS' || selectCat.value === 'MASCULINOS') inputMonto.value = '50000';
            else if(selectCat.value === 'SENSUALES') inputMonto.value = '70000';
            else if(selectCat.value === 'FANTASIAS') inputMonto.value = '100000';
        });
        selectCat.dispatchEvent(new Event('change'));

        const form = document.getElementById('cajaForm');
        const tablaMovimientos = document.getElementById('tablaMovimientos');
        const totalIngresos = document.getElementById('totalIngresos');

        function actualizarTabla() {
            tablaMovimientos.innerHTML = '';
            let sumaTotal = 0;
            const hoy = new Date();
            hoy.setHours(0,0,0,0);

            if (registros.length === 0) {
                tablaMovimientos.innerHTML = `<tr><td colspan="7" class="empty-state">No hay perfiles registrados todavía.</td></tr>`;
                totalIngresos.textContent = '$0';
                return;
            }

            registros.forEach((reg, index) => {
                sumaTotal += Number(reg.monto || 0);

                const fechaVen = new Date(reg.vencimiento + 'T00:00:00');
                const estaVencido = fechaVen < hoy;

                const badgeHtml = estaVencido 
                    ? `<span class="status-badge status-vencido">⚠️ Vencido</span>` 
                    : `<span class="status-badge status-activo">✓ Al Día</span>`;

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${reg.nombre}</strong></td>
                    <td>${reg.zona}</td>
                    <td><small style="color:var(--gold);">${reg.categoria}</small></td>
                    <td>${reg.vencimiento.split('-').reverse().join('/')}</td>
                    <td>${badgeHtml}</td>
                    <td class="amount-col">+$${Number(reg.monto || 0).toLocaleString('es-AR')}</td>
                    <td><button class="btn-delete" onclick="eliminarRegistro(${index})">Eliminar</button></td>
                `;
                tablaMovimientos.appendChild(tr);
            });

            totalIngresos.textContent = `$${sumaTotal.toLocaleString('es-AR')}`;
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const nuevoReg = {
                nombre: document.getElementById('nombre').value.trim().toUpperCase(),
                zona: document.getElementById('zona').value.trim().toUpperCase(),
                categoria: document.getElementById('categoria').value,
                monto: parseFloat(document.getElementById('monto').value) || 0,
                vencimiento: document.getElementById('vencimiento').value
            };

            registros.unshift(nuevoReg);
            localStorage.setItem('prive_control_modelos', JSON.stringify(registros));

            form.reset();
            selectCat.dispatchEvent(new Event('change'));
            actualizarTabla();
        });

        window.eliminarRegistro = function(index) {
            if (confirm('¿Estás seguro de eliminar este registro?')) {
                registros.splice(index, 1);
                localStorage.setItem('prive_control_modelos', JSON.stringify(registros));
                actualizarTabla();
            }
        };

        window.restaurarDatosExcel = function() {
            if (confirm('¿Restaurar los datos originales de la planilla? Se perderán los cambios recientes.')) {
                registros = datosInicialesExcel;
                localStorage.setItem('prive_control_modelos', JSON.stringify(registros));
                actualizarTabla();
            }
        };

        actualizarTabla();
    </script>
</body>
</html>
